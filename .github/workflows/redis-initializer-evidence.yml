name: Redis initializer evidence (not release)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed source commit to inspect
        required: true
        type: string

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify checkout and host
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          test "$(uname -s)" = Linux
          ! uname -r | grep -Eiq 'microsoft|wsl'
          mkdir -p "$RUNNER_TEMP/aiat-redis-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/aiat-redis-evidence/source-commit.txt"
          uname -a > "$RUNNER_TEMP/aiat-redis-evidence/host.txt"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pinned uv
        run: python3 -m pip install --disable-pip-version-check uv==0.4.30
      - name: Run initializer regression tests
        working-directory: mas
        run: |
          set -euo pipefail
          uv sync --locked --dev
          uv run pytest apps/message-router/tests/test_redis_acl_init_persistence.py scripts/tests/test_redis_initializer_release_hold.py
      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build local candidate image
        run: |
          set -euo pipefail
          docker build --pull --iidfile "$RUNNER_TEMP/aiat-redis-evidence/image-id.txt" \
            -t aiat-redis-init-evidence:local -f mas/infra/compose/Dockerfile.redis-acl-init mas/infra/compose
          docker image inspect aiat-redis-init-evidence:local --format '{{.Id}} {{.Os}}/{{.Architecture}}' \
            > "$RUNNER_TEMP/aiat-redis-evidence/image-identity.txt"
      - name: Exercise disposable Redis restart and verifier
        working-directory: mas
        env:
          AIAT_REDIS_INTEGRATION: '1'
          AIAT_REDIS_TEST_IMAGE: aiat-redis-init-evidence:local
        run: uv run pytest apps/message-router/tests/test_redis_acl_init_disposable.py
      - name: Scan candidate dependencies and image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: aiat-redis-init-evidence:local
          format: json
          output: ${{ runner.temp }}/aiat-redis-evidence/trivy-image.json
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: false
      - name: Scan locked source dependencies
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: ${{ runner.temp }}/aiat-redis-evidence/trivy-dependencies.json
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: false
      - name: Generate candidate SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: aiat-redis-init-evidence:local
          format: cyclonedx
          output: ${{ runner.temp }}/aiat-redis-evidence/image-sbom.cdx.json
          exit-code: '0'
      - name: Mark evidence scope
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/aiat-redis-evidence"
          printf '%s\n' 'PREPARATORY EVIDENCE ONLY: no immutable registry digest, authenticated build provenance, full live Redis restart suite, release-ledger approval, or deployment is asserted.' > "$RUNNER_TEMP/aiat-redis-evidence/SCOPE.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: redis-initializer-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/aiat-redis-evidence/
          if-no-files-found: error
          retention-days: 14
