name: Redis initializer evidence (not release)

on:
  push:
    branches:
      - agent/fix-review-p1
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed source commit to inspect
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - name: Verify checkout and host
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          test "$(uname -s)" = Linux
          ! uname -r | grep -Eiq 'microsoft|wsl'
          mkdir -p "$RUNNER_TEMP/aiat-redis-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/aiat-redis-evidence/source-commit.txt"
          uname -a > "$RUNNER_TEMP/aiat-redis-evidence/host.txt"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pinned uv
        run: python3 -m pip install --disable-pip-version-check uv==0.4.30
      - name: Run initializer regression tests
        working-directory: mas
        run: |
          set -euo pipefail
          uv sync --locked --dev
          uv run pytest apps/message-router/tests/test_redis_acl_init_persistence.py scripts/tests/test_redis_initializer_release_hold.py
      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan complete candidate range for secrets
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
          CANDIDATE_BASE_SHA: b7e05419a6344ddcd6d8d5a5bdb99cb2d578ea88
        run: |
          set -euo pipefail
          git cat-file -e "${CANDIDATE_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_BASE_SHA" "$CANDIDATE_SHA"
          gitleaks_bin="$(command -v gitleaks || true)"
          if [[ -z "$gitleaks_bin" ]]; then
            for candidate in /tmp/gitleaks-*/gitleaks; do
              if [[ -x "$candidate" ]]; then
                gitleaks_bin="$candidate"
                break
              fi
            done
          fi
          test -n "$gitleaks_bin"
          "$gitleaks_bin" --version > "$RUNNER_TEMP/aiat-redis-evidence/gitleaks-version.txt"
          "$gitleaks_bin" detect --source . --redact --exit-code=2 \
            --report-format=sarif \
            --report-path="$RUNNER_TEMP/aiat-redis-evidence/candidate-range-gitleaks.sarif" \
            --log-opts="$CANDIDATE_BASE_SHA..$CANDIDATE_SHA" .
      - name: Build local candidate image
        run: |
          set -euo pipefail
          docker buildx build --builder default --pull --load --iidfile "$RUNNER_TEMP/aiat-redis-evidence/image-id.txt" \
            -t aiat-redis-init-evidence:local -f mas/infra/compose/Dockerfile.redis-acl-init mas/infra/compose
          docker image inspect aiat-redis-init-evidence:local --format '{{.Id}} {{.Os}}/{{.Architecture}}' \
            > "$RUNNER_TEMP/aiat-redis-evidence/image-identity.txt"
          docker image save --output "$RUNNER_TEMP/aiat-redis-evidence/candidate-image.tar" aiat-redis-init-evidence:local
          sha256sum "$RUNNER_TEMP/aiat-redis-evidence/candidate-image.tar" \
            > "$RUNNER_TEMP/aiat-redis-evidence/candidate-image.tar.sha256"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "aiat-redis-evidence"
          image_id, platform = (root / "image-identity.txt").read_text().strip().split()
          archive = root / "candidate-image.tar"
          record = {
              "schema_version": "aiat.redis-acl-init-candidate.v1",
              "source_commit": os.environ["GITHUB_SHA"],
              "local_tag": "aiat-redis-init-evidence:local",
              "docker_image_config_digest": image_id,
              "platform": platform,
              "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "registry_reference": None,
          }
          (root / "candidate-image-identity.json").write_text(
              json.dumps(record, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(record, sort_keys=True))
          PY
      - name: Exercise disposable Redis restart and verifier
        working-directory: mas
        env:
          AIAT_REDIS_INTEGRATION: '1'
          AIAT_REDIS_TEST_IMAGE: aiat-redis-init-evidence:local
        run: uv run pytest apps/message-router/tests/test_redis_acl_init_disposable.py
      - name: Scan candidate image OS and runtime packages
        id: image_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: aiat-redis-init-evidence:local
          format: json
          output: ${{ runner.temp }}/aiat-redis-evidence/trivy-image.json
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: false
      - name: Prepare Redis initializer source dependency context
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/aiat-redis-evidence/source-dependency-context"
          mkdir -p "$context"
          cp mas/infra/compose/Dockerfile.redis-acl-init "$context/Dockerfile"
          cp mas/infra/compose/redis-acl-init.sh "$context/redis-acl-init.sh"
          printf '%s\n' \
            'The initializer source is a shell script with no third-party library manifest.' \
            'The pinned Redis base and its runtime packages are scanned in trivy-image.json.' \
            > "$RUNNER_TEMP/aiat-redis-evidence/dependency-scope.txt"
      - name: Scan Redis initializer source dependencies
        id: dependency_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/aiat-redis-evidence/source-dependency-context
          format: json
          output: ${{ runner.temp }}/aiat-redis-evidence/trivy-dependencies.json
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: false
      - name: Generate candidate SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: aiat-redis-init-evidence:local
          format: cyclonedx
          output: ${{ runner.temp }}/aiat-redis-evidence/image-sbom.cdx.json
          exit-code: '0'
      - name: Summarize Redis initializer scans and SBOM
        if: always()
        run: |
          set -euo pipefail
          python3 mas/scripts/summarize_trivy_reports.py \
            --report redis_initializer_image="$RUNNER_TEMP/aiat-redis-evidence/trivy-image.json" \
            --report redis_initializer_dependencies="$RUNNER_TEMP/aiat-redis-evidence/trivy-dependencies.json" \
            --sbom "$RUNNER_TEMP/aiat-redis-evidence/image-sbom.cdx.json" \
            --output "$RUNNER_TEMP/aiat-redis-evidence/trivy-summary.json"
      - name: Attest Redis initializer archive build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/aiat-redis-evidence/candidate-image.tar
          subject-name: aiat-redis-acl-init-docker-archive
          push-to-registry: false
          create-storage-record: false

      - name: Attest Redis initializer archive SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/aiat-redis-evidence/candidate-image.tar
          subject-name: aiat-redis-acl-init-docker-archive
          sbom-path: ${{ runner.temp }}/aiat-redis-evidence/image-sbom.cdx.json
          push-to-registry: false
          create-storage-record: false

      - name: Save Redis attestation bundles and references
        env:
          PROVENANCE_ID: ${{ steps.provenance.outputs.attestation-id }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_ID: ${{ steps.sbom.outputs.attestation-id }}
          SBOM_URL: ${{ steps.sbom.outputs.attestation-url }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" "$RUNNER_TEMP/aiat-redis-evidence/provenance.sigstore.json"
          cp "$SBOM_BUNDLE" "$RUNNER_TEMP/aiat-redis-evidence/sbom.sigstore.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          record = {
              "provenance": {
                  "attestation_id": os.environ["PROVENANCE_ID"],
                  "attestation_url": os.environ["PROVENANCE_URL"],
                  "bundle": "provenance.sigstore.json",
              },
              "sbom": {
                  "attestation_id": os.environ["SBOM_ID"],
                  "attestation_url": os.environ["SBOM_URL"],
                  "bundle": "sbom.sigstore.json",
              },
          }
          root = Path(os.environ["RUNNER_TEMP"]) / "aiat-redis-evidence"
          (root / "attestation-references.json").write_text(
              json.dumps(record, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Verify Redis archive provenance and SBOM attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/aiat-redis-evidence/candidate-image.tar"
          signer="$GITHUB_REPOSITORY/.github/workflows/redis-initializer-evidence.yml"
          gh attestation verify "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" \
            --format json \
            > "$RUNNER_TEMP/aiat-redis-evidence/provenance-verification.json"
          gh attestation verify "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" \
            --predicate-type https://cyclonedx.org/bom \
            --format json \
            > "$RUNNER_TEMP/aiat-redis-evidence/sbom-verification.json"

      - name: Enforce Redis security scan results
        if: always()
        env:
          IMAGE_SCAN_OUTCOME: ${{ steps.image_scan.outcome }}
          DEPENDENCY_SCAN_OUTCOME: ${{ steps.dependency_scan.outcome }}
        run: |
          set -euo pipefail
          if [[ "$IMAGE_SCAN_OUTCOME" != success || "$DEPENDENCY_SCAN_OUTCOME" != success ]]; then
            echo "The Redis initializer image or source dependency scan did not pass; review the retained reports." >&2
            exit 1
          fi
      - name: Mark evidence scope
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/aiat-redis-evidence"
          printf '%s\n' \
            'PREPARATORY EVIDENCE ONLY: inspect step results; separate GitHub provenance and SBOM attestations bind the Docker archive to this workflow run.' \
            'This workflow does not publish a registry image, create an immutable registry reference, certify a live Redis restart, approve the release ledger, or authorize deployment.' \
            'Dependency scanning is scoped to the initializer Dockerfile and shell source; the image scan covers the pinned Redis base and runtime packages. Repository-wide application dependency findings are tracked separately.' \
            'candidate-range-gitleaks.sarif scans every commit since the pre-publication feature-branch tip b7e05419a6344ddcd6d8d5a5bdb99cb2d578ea88.' \
            > "$RUNNER_TEMP/aiat-redis-evidence/SCOPE.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: redis-initializer-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/aiat-redis-evidence/
          if-no-files-found: error
          retention-days: 90
