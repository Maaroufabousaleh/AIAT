name: OpenHands Candidate Certification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact AIAT candidate commit to certify"
        required: true
        type: string

permissions:
  contents: read

env:
  OPENHANDS_IMAGE: ghcr.io/openhands/agent-server:1.43.0-python@sha256:36f847d1dfbbbdce90052437b06a3c6e76b8a54683228182eaf73085f03fcd97
  LITELLM_IMAGE: ghcr.io/berriai/litellm@sha256:a50b02a6056095da29308310bb608f0509e08ddcd1d105bae9c21007d82b0e95
  OMNIROUTE_IMAGE: diegosouzapw/omniroute@sha256:ceae8d9da0acf075dbf5905b61c9ae32e749112650fcf7f4434c8d96ac6d3ebb
  OPENHANDS_MODEL_GATEWAY_URL: http://litellm:4000

jobs:
  certify:
    # ubuntu-slim is deliberately excluded: this job needs a privileged
    # Docker Engine and the native runsc runtime.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mas
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Bind evidence to candidate commit
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_SHA"
          echo "AIAT_CANDIDATE_SHA=$actual" >> "$GITHUB_ENV"

      - name: Install gVisor on native Linux
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          ! uname -r | grep -Eiq 'microsoft|wsl'
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg
          curl -fsSL https://gvisor.dev/archive.key \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          runsc --version
          sudo runsc install
          sudo systemctl restart docker
          docker info | grep -A10 Runtimes

      - name: Install AIAT environment
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check uv==0.4.30
          uv sync --locked --dev

      - name: Provision pinned scanners and SBOM tooling
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence" "$RUNNER_TEMP/aiat-openhands-tools"
          uv run python scripts/provision_openhands_certification_tools.py \
            --output "$RUNNER_TEMP/aiat-openhands-evidence/tooling" \
            --install-dir "$RUNNER_TEMP/aiat-openhands-tools"
          while IFS= read -r entry; do
            test -n "$entry"
            echo "$entry" >> "$GITHUB_PATH"
          done < "$RUNNER_TEMP/aiat-openhands-evidence/tooling/tooling-paths.txt"

      - name: Run deterministic OpenHands offline harnesses
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/offline"
          uv run python scripts/check_openhands_coding_task_fixture.py \
            --output "$RUNNER_TEMP/aiat-openhands-evidence/offline/coding-task-fixture.json"
          uv run python scripts/check_openhands_offline_harness.py \
            --output "$RUNNER_TEMP/aiat-openhands-evidence/offline/lifecycle-security-harness.json"

      - name: Generate disposable AIAT tool-service secret
        run: |
          set -euo pipefail
          tool_secret="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          test "${#tool_secret}" -ge 32
          echo "::add-mask::$tool_secret"
          {
            echo "AIAT_TOOL_SECRET=$tool_secret"
            echo "AIAT_TOOL_SECRET_SCOPE=github-run"
          } >> "$GITHUB_ENV"

      - name: Generate disposable AIAT model-gateway secret
        run: |
          set -euo pipefail
          gateway_key="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          test "${#gateway_key}" -ge 32
          echo "::add-mask::$gateway_key"
          {
            echo "OPENHANDS_MODEL_GATEWAY_API_KEY=$gateway_key"
            echo "OPENHANDS_MODEL_GATEWAY_API_KEY_SCOPE=github-run"
            echo "MODEL_GATEWAY_SECRET_SCOPE=github-run"
            echo "OPENHANDS_MODEL_GATEWAY_URL=http://litellm:4000"
          } >> "$GITHUB_ENV"

      - name: Check required external provider configuration
        id: provider_preflight
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/provider" \
            "$RUNNER_TEMP/aiat-openhands-evidence/certification"
          uv run python scripts/check_openhands_provider_configuration.py \
            --output "$RUNNER_TEMP/aiat-openhands-evidence/provider/preflight.json" \
            > /dev/null 2> /dev/null
          exit_code=$?
          provider_status=$(python3 - \
            "$RUNNER_TEMP/aiat-openhands-evidence/provider/preflight.json" \
            "$exit_code" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          exit_code = int(sys.argv[2])
          try:
              report = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError):
              report = {}
          status = report.get("status") if isinstance(report, dict) else None
          if exit_code == 0 and status == "PASS":
              print("PASS")
          elif status == "BLOCKED_MISSING_OPERATOR_SECRET":
              print("BLOCKED_MISSING_OPERATOR_SECRET")
          else:
              # A malformed report or an unexpected checker/tool failure is
              # not evidence that the operator omitted the provider secret.
              print("FAILED_CERTIFICATION_IMPLEMENTATION")
          PY
          )
          if [ "$provider_status" = "PASS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=$provider_status" >> "$GITHUB_OUTPUT"
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          PROVIDER_STATUS="$provider_status" EXIT_CODE="$exit_code" \
            python3 - "$RUNNER_TEMP/aiat-openhands-evidence/provider/preflight-wrapper.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "schema_version": "aiat.openhands-provider-preflight-wrapper.v1",
                      "status": os.environ["PROVIDER_STATUS"],
                      "checker_exit_code": int(os.environ["EXIT_CODE"]),
                      "secret_name": "GROQ_API_KEY",
                      "secret_value_retained": False,
                      "stdout_or_stderr_retained": False,
                  },
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          # A missing provider secret is a bounded operator block.  Any other
          # checker/tool failure remains a certification implementation failure;
          # both stay on the evidence/cleanup path without starting model stages.
          exit 0

      - name: Run non-secret OpenHands portability preflight
        id: preflight
        continue-on-error: true
        env:
          OPENHANDS_MODEL_ID: ${{ vars.OPENHANDS_MODEL_ID }}
          OPENHANDS_MCP_SETTINGS_KEY: ${{ vars.OPENHANDS_MCP_SETTINGS_KEY }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/preflight"
          uv run python scripts/check_openhands_candidate_preflight.py \
            --output "$RUNNER_TEMP/aiat-openhands-evidence/preflight/preflight.json"
          exit_code=$?
          preflight_status=$(python3 - \
            "$RUNNER_TEMP/aiat-openhands-evidence/preflight/preflight.json" \
            "$exit_code" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          exit_code = int(sys.argv[2])
          try:
              report = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError):
              report = {}
          status = report.get("status") if isinstance(report, dict) else None
          if exit_code == 0 and status == "READY_FOR_CERTIFICATION_AUTHORIZATION":
              print(status)
          elif status in {"BLOCKED_OPERATOR_CONFIGURATION", "BLOCKED_STATIC_CONFIGURATION"}:
              print(status)
          else:
              print("FAILED_CERTIFICATION_IMPLEMENTATION")
          PY
          )
          if [ "$preflight_status" = "READY_FOR_CERTIFICATION_AUTHORIZATION" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
          echo "status=$preflight_status" >> "$GITHUB_OUTPUT"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Pull pinned certification images and verify gateway provenance
        if: steps.provider_preflight.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true'
        run: |
          set -euo pipefail
          docker pull "$OPENHANDS_IMAGE"
          docker pull "$LITELLM_IMAGE"
          docker pull "$OMNIROUTE_IMAGE"
          docker image inspect "$OPENHANDS_IMAGE" >/dev/null
          docker image inspect "$LITELLM_IMAGE" >/dev/null
          docker image inspect "$OMNIROUTE_IMAGE" >/dev/null
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/gateway"
          openhands_platform="$(docker image inspect "$OPENHANDS_IMAGE" --format '{{.Os}}/{{.Architecture}}')"
          litellm_platform="$(docker image inspect "$LITELLM_IMAGE" --format '{{.Os}}/{{.Architecture}}')"
          omniroute_platform="$(docker image inspect "$OMNIROUTE_IMAGE" --format '{{.Os}}/{{.Architecture}}')"
          test "$openhands_platform" = "linux/amd64"
          test "$litellm_platform" = "linux/amd64"
          test "$omniroute_platform" = "linux/amd64"
          OPENHANDS_PLATFORM="$openhands_platform" LITELLM_PLATFORM="$litellm_platform" \
            OMNIROUTE_PLATFORM="$omniroute_platform" \
            python3 - "$RUNNER_TEMP/aiat-openhands-evidence/gateway/image-platforms.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "schema_version": "aiat.openhands-certification-image-platforms.v1",
                      "expected_platform": "linux/amd64",
                      "platforms": {
                          "openhands": os.environ["OPENHANDS_PLATFORM"],
                          "litellm": os.environ["LITELLM_PLATFORM"],
                          "omniroute": os.environ["OMNIROUTE_PLATFORM"],
                      },
                      "all_verified": True,
                      "payloads_retained": False,
                  },
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          uv run python scripts/verify_openhands_gateway_pins.py \
            --output "$RUNNER_TEMP/aiat-openhands-evidence/gateway/pins.json"
          uv run python scripts/verify_openhands_gateway_provenance.py \
            --litellm-image "$LITELLM_IMAGE" \
            --omniroute-image "$OMNIROUTE_IMAGE" \
            --output "$RUNNER_TEMP/aiat-openhands-evidence/gateway/version-verification.json"

      - name: Create disposable model-gateway network
        id: network
        if: steps.provider_preflight.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true'
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/gateway"
          network="aiat-openhands-cert-network-${GITHUB_RUN_ID}"
          docker_available=false
          if docker info >/dev/null 2>&1; then
            docker_available=true
          fi
          create_exit_code=1
          if [ "$docker_available" = true ]; then
            docker network create "$network" >/dev/null 2>&1
            create_exit_code=$?
          fi
          DOCKER_AVAILABLE="$docker_available" CREATE_EXIT_CODE="$create_exit_code" NETWORK_NAME="$network" \
            python3 - "$RUNNER_TEMP/aiat-openhands-evidence/gateway/network-startup.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          created = os.environ.get("CREATE_EXIT_CODE") == "0"
          Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "schema_version": "aiat.openhands-certification-network-startup.v1",
                      "network_name": os.environ.get("NETWORK_NAME", ""),
                      "docker_available": os.environ.get("DOCKER_AVAILABLE") == "true",
                      "status": "PASS" if created else "BLOCKED",
                      "failure_class": None if created else "FAILED_INFRASTRUCTURE",
                      "reason": None if created else "docker_network_create_failed",
                      "payloads_retained": False,
                  },
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          if [ "$create_exit_code" -ne 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=FAILED_INFRASTRUCTURE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "network=$network" >> "$GITHUB_OUTPUT"
          echo "network=$network" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "status=PASS" >> "$GITHUB_OUTPUT"

      - name: Start disposable OmniRoute provider gateway
        id: omniroute
        if: steps.provider_preflight.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' && steps.network.outputs.ready == 'true'
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/gateway/omniroute"
          name="aiat-openhands-omniroute-${GITHUB_RUN_ID}"
          run_exit_code=0
          docker run --detach --name "$name" \
            --network "$network" --network-alias omniroute \
            --publish 127.0.0.1:20128:20128 \
            --publish 127.0.0.1:20129:20129 \
            --env PORT=20128 \
            --env DASHBOARD_PORT=20128 \
            --env API_PORT=20129 \
            --env API_HOST=0.0.0.0 \
            --env REQUIRE_API_KEY=true \
            --env OMNIROUTE_API_KEY="$OPENHANDS_MODEL_GATEWAY_API_KEY" \
            --env GROQ_API_KEY="$GROQ_API_KEY" \
            "$OMNIROUTE_IMAGE" || run_exit_code=$?
          echo "omniroute_container=$name" >> "$GITHUB_ENV"
          echo "container=$name" >> "$GITHUB_OUTPUT"
          container_running=false
          if docker inspect "$name" >/dev/null 2>&1; then
            docker inspect --format '{{json .State}}' "$name" > "$RUNNER_TEMP/aiat-openhands-evidence/gateway/omniroute/container-state.json"
            docker inspect --format '{{json .HostConfig.Runtime}}' "$name" > "$RUNNER_TEMP/aiat-openhands-evidence/gateway/omniroute/container-runtime.json"
            container_running="$(docker inspect --format '{{if .State.Running}}true{{else}}false{{end}}' "$name")"
          fi
          readiness_exit_code=0
          # The readiness helper emits OMNIROUTE_STARTUP_FAILURE,
          # OMNIROUTE_HEALTH_AUTH_CONTRACT_FAILURE,
          # OMNIROUTE_APPLICATION_HEALTH_FAILURE, or OMNIROUTE_HEALTH_TIMEOUT.
          uv run python scripts/check_openhands_omniroute_readiness.py \
            --url http://127.0.0.1:20128/api/monitoring/health \
            --output "$RUNNER_TEMP/aiat-openhands-evidence/gateway/omniroute/health.json" \
            --run-exit-code "$run_exit_code" \
            --container-running "$container_running" \
            --attempts 60 --interval-seconds 2 --timeout-seconds 5 || readiness_exit_code=$?
          readiness_status="$(python3 - "$RUNNER_TEMP/aiat-openhands-evidence/gateway/omniroute/health.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError):
              report = {}
          print(report.get("status", "BLOCKED") if isinstance(report, dict) else "BLOCKED")
          PY
          )"
          if [ "$run_exit_code" -ne 0 ] || [ "$readiness_exit_code" -ne 0 ] || [ "$readiness_status" != PASS ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=BLOCKED_RUNTIME_STARTUP" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "status=PASS" >> "$GITHUB_OUTPUT"

      - name: Verify OmniRoute OpenAI API authentication boundary
        id: omniroute_auth
        if: steps.provider_preflight.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' && steps.network.outputs.ready == 'true' && steps.omniroute.outputs.ready == 'true'
        continue-on-error: true
        run: |
          set +e
          output="$RUNNER_TEMP/aiat-openhands-evidence/gateway/omniroute/auth.json"
          mkdir -p "$(dirname "$output")"
          echo "::add-mask::$OPENHANDS_MODEL_GATEWAY_API_KEY"
          uv run python scripts/check_openhands_omniroute_auth.py \
            --url http://127.0.0.1:20129/v1/models \
            --output "$output" \
            --attempts 30 \
            --interval-seconds 1
          auth_exit_code=$?
          if [ "$auth_exit_code" -eq 0 ]; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "status=BLOCKED" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure exactly one disposable OmniRoute provider route
        id: provider
        if: steps.provider_preflight.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' && steps.network.outputs.ready == 'true' && steps.omniroute.outputs.ready == 'true' && steps.omniroute_auth.outputs.ready == 'true'
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/gateway"
          OMNIROUTE_BASE_URL=http://127.0.0.1:20128 \
            OMNIROUTE_API_KEY="$OPENHANDS_MODEL_GATEWAY_API_KEY" \
            uv run python scripts/provision_openhands_certification_gateway.py \
              --output "$RUNNER_TEMP/aiat-openhands-evidence/gateway/provider-provisioning.json"
          exit_code=$?
          provider_status=$(python3 - "$RUNNER_TEMP/aiat-openhands-evidence/gateway/provider-provisioning.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError):
              report = {}
          print("PASS" if isinstance(report, dict) and report.get("status") == "PASS" else "BLOCKED")
          PY
          )
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo "status=$provider_status" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 0 ] && [ "$provider_status" = PASS ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify deterministic provider baseline through OmniRoute
        id: baseline
        if: steps.provider_preflight.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' && steps.network.outputs.ready == 'true' && steps.provider.outputs.ready == 'true'
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/gateway"
          OMNIROUTE_BASE_URL=http://127.0.0.1:20129 \
            OPENHANDS_MODEL_GATEWAY_API_KEY="$OPENHANDS_MODEL_GATEWAY_API_KEY" \
            uv run python scripts/check_openhands_provider_baseline.py \
              --url http://127.0.0.1:20129 \
              --output "$RUNNER_TEMP/aiat-openhands-evidence/gateway/provider-baseline.json"
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=BLOCKED" >> "$GITHUB_OUTPUT"
          fi

      - name: Start disposable LiteLLM model gateway
        id: litellm
        if: steps.provider_preflight.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' && steps.network.outputs.ready == 'true' && steps.provider.outputs.ready == 'true' && steps.baseline.outputs.ready == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/gateway/litellm"
          name="aiat-openhands-litellm-${GITHUB_RUN_ID}"
          config="$GITHUB_WORKSPACE/mas/infra/compose/litellm_openhands_certification.yaml"
          test -s "$config"
          run_exit_code=0
          docker run --detach --name "$name" \
            --network "$network" --network-alias litellm \
            --publish 127.0.0.1:4000:4000 \
            --volume "$config:/app/config.yaml:ro" \
            --env LITELLM_MASTER_KEY="$OPENHANDS_MODEL_GATEWAY_API_KEY" \
            --env OMNIROUTE_API_KEY="$OPENHANDS_MODEL_GATEWAY_API_KEY" \
            "$LITELLM_IMAGE" \
            --config /app/config.yaml --host 0.0.0.0 --port 4000 || run_exit_code=$?
          echo "litellm_container=$name" >> "$GITHUB_ENV"
          echo "container=$name" >> "$GITHUB_OUTPUT"
          healthy=0
          if [ "$run_exit_code" -eq 0 ]; then
            for _ in $(seq 1 60); do
              if curl --fail --silent --show-error http://127.0.0.1:4000/health/readiness >/dev/null; then
                healthy=1
                break
              fi
              sleep 2
            done
            docker inspect --format '{{json .State}}' "$name" > "$RUNNER_TEMP/aiat-openhands-evidence/gateway/litellm/container-state.json"
            docker inspect --format '{{json .HostConfig.Runtime}}' "$name" > "$RUNNER_TEMP/aiat-openhands-evidence/gateway/litellm/container-runtime.json"
          fi
          RUN_EXIT_CODE="$run_exit_code" python3 - "$healthy" "$RUNNER_TEMP/aiat-openhands-evidence/gateway/litellm/health.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          healthy, output = sys.argv[1:]
          run_exit_code = os.environ.get("RUN_EXIT_CODE", "1")
          startup_failed = run_exit_code != "0"
          Path(output).write_text(
              json.dumps(
                  {
                      "schema_version": "aiat.openhands-certification-litellm-health.v1",
                      "health_status": "PASS" if healthy == "1" else "BLOCKED",
                      "failure_class": None if healthy == "1" else "LITELLM_STARTUP_FAILURE" if startup_failed else "LITELLM_HEALTH_FAILURE",
                      "run_exit_code": int(run_exit_code),
                      "endpoint": "http://litellm:4000/health/readiness",
                      "model_id": "omniroute-coding",
                      "raw_response_retained": False,
                  },
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          if [ "$run_exit_code" -ne 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=BLOCKED_RUNTIME_STARTUP" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$healthy" = 1
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "status=PASS" >> "$GITHUB_OUTPUT"

      - name: Verify governed OmniRoute auto/coding route through LiteLLM
        id: gateway
        if: steps.provider_preflight.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' && steps.network.outputs.ready == 'true' && steps.provider.outputs.ready == 'true' && steps.baseline.outputs.ready == 'true' && steps.litellm.outputs.ready == 'true'
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/gateway"
          LITELLM_BASE_URL=http://127.0.0.1:4000 \
            OMNIROUTE_BASE_URL=http://127.0.0.1:20128 \
            uv run python scripts/check_openhands_certification_gateway.py \
              --litellm-url http://127.0.0.1:4000 \
              --omniroute-url http://127.0.0.1:20128 \
              --output "$RUNNER_TEMP/aiat-openhands-evidence/gateway/route-probe.json" \
              --auto-routing-output "$RUNNER_TEMP/aiat-openhands-evidence/gateway/auto-routing.json"
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=BLOCKED" >> "$GITHUB_OUTPUT"
          fi

      - name: Start disposable AIAT tool-service bridge
        id: bridge
        if: steps.provider_preflight.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' && steps.network.outputs.ready == 'true' && steps.gateway.outputs.ready == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aiat-openhands-workspace" "$RUNNER_TEMP/aiat-openhands-evidence/bridge"
          tool_name="aiat-openhands-tool-service-${GITHUB_RUN_ID}"
          image="aiat-openhands-tool-service-cert:${GITHUB_RUN_ID}"
          build_exit_code=0
          docker build --file infra/docker/Dockerfile.tool-service --tag "$image" . || build_exit_code=$?
          run_exit_code=0
          if [ "$build_exit_code" -eq 0 ]; then
            docker run --detach --name "$tool_name" \
            --network "$network" --network-alias tool-service \
            --publish 127.0.0.1:18002:8002 \
            --volume "$RUNNER_TEMP/aiat-openhands-workspace:/workspace:rw" \
            --env TOOL_SECRET="$AIAT_TOOL_SECRET" \
            --env TOOL_WORKSPACE_ROOT=/workspace \
            --env LOG_LEVEL=INFO \
            "$image" || run_exit_code=$?
          else
            run_exit_code=125
          fi
          echo "network=$network" >> "$GITHUB_OUTPUT"
          echo "tool_container=$tool_name" >> "$GITHUB_OUTPUT"
          echo "network=$network" >> "$GITHUB_ENV"
          echo "tool_container=$tool_name" >> "$GITHUB_ENV"
          healthy=0
          if [ "$run_exit_code" -eq 0 ]; then
            for _ in $(seq 1 60); do
              if curl --fail --silent --show-error http://127.0.0.1:18002/health >/dev/null; then
                healthy=1
                break
              fi
              sleep 2
            done
            docker inspect --format '{{json .State}}' "$tool_name" > "$RUNNER_TEMP/aiat-openhands-evidence/bridge/container-state.json"
            docker inspect --format '{{json .HostConfig.Runtime}}' "$tool_name" > "$RUNNER_TEMP/aiat-openhands-evidence/bridge/container-runtime.json"
          fi
          BUILD_EXIT_CODE="$build_exit_code" RUN_EXIT_CODE="$run_exit_code" \
            python3 - "$healthy" "$RUNNER_TEMP/aiat-openhands-evidence/bridge/startup.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          healthy, output = sys.argv[1:]
          build_exit_code = os.environ.get("BUILD_EXIT_CODE", "1")
          run_exit_code = os.environ.get("RUN_EXIT_CODE", "1")
          startup_failed = build_exit_code != "0" or run_exit_code != "0"
          Path(output).write_text(
              json.dumps(
                  {
                      "schema_version": "aiat.openhands-tool-service-startup.v1",
                      "health_status": "PASS" if healthy == "1" else "BLOCKED",
                      "failure_class": None if healthy == "1" else "TOOL_SERVICE_STARTUP_FAILURE" if startup_failed else "TOOL_SERVICE_HEALTH_FAILURE",
                      "build_exit_code": int(build_exit_code),
                      "run_exit_code": int(run_exit_code),
                      "bridge_url": "http://tool-service:8002/openhands/mcp",
                      "payloads_retained": False,
                      "container_logs_retained": False,
                  },
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          if [ "$run_exit_code" -ne 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=BLOCKED_TOOL_BRIDGE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$healthy" = 1
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "status=PASS" >> "$GITHUB_OUTPUT"

      - name: Start Agent Server under runsc
        id: server
        if: steps.provider_preflight.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' && steps.network.outputs.ready == 'true' && steps.bridge.outputs.ready == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/startup" "$RUNNER_TEMP/aiat-openhands-workspace"
          name="aiat-openhands-cert-${GITHUB_RUN_ID}"
          key=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          echo "::add-mask::$key"
          key_file="$RUNNER_TEMP/aiat-openhands-session-key"
          umask 077
          printf '%s' "$key" > "$key_file"
          echo "container=$name" >> "$GITHUB_OUTPUT"
          echo "agent_container=$name" >> "$GITHUB_ENV"
          run_exit_code=0
          docker run --detach --name "$name" --runtime=runsc \
            --network "$network" --network-alias agent-server \
            --publish 127.0.0.1:18000:8000 \
            --volume "$RUNNER_TEMP/aiat-openhands-workspace:/workspace/project:rw" \
            --env SESSION_API_KEY="$key" \
            "$OPENHANDS_IMAGE" || run_exit_code=$?
          healthy=0
          if [ "$run_exit_code" -eq 0 ]; then
            for _ in $(seq 1 60); do
              if curl --fail --silent --show-error \
                -H "X-Session-API-Key: $key" \
                http://127.0.0.1:18000/health >/dev/null; then
                healthy=1
                break
              fi
              sleep 2
            done
            docker inspect --format '{{json .State}}' "$name" > "$RUNNER_TEMP/aiat-openhands-evidence/startup/container-state.json"
            docker inspect --format '{{json .HostConfig.Runtime}}' "$name" > "$RUNNER_TEMP/aiat-openhands-evidence/startup/container-runtime.json"
          fi
          RUN_EXIT_CODE="$run_exit_code" python3 - "$healthy" "$RUNNER_TEMP/aiat-openhands-evidence/startup/startup.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          healthy, output = sys.argv[1:]
          run_exit_code = os.environ.get("RUN_EXIT_CODE", "1")
          startup_failed = run_exit_code != "0"
          Path(output).write_text(
              json.dumps(
                  {
                      "schema_version": "aiat.openhands-startup.v1",
                      "health_status": "PASS" if healthy == "1" else "BLOCKED",
                      "failure_class": None if healthy == "1" else "OPENHANDS_AGENT_SERVER_STARTUP_FAILURE" if startup_failed else "OPENHANDS_AGENT_SERVER_HEALTH_FAILURE",
                      "run_exit_code": int(run_exit_code),
                      "runtime_expected": "runsc",
                      "payloads_retained": False,
                      "container_logs_retained": False,
                  },
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          if [ "$run_exit_code" -ne 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=BLOCKED_GVISOR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$healthy" != 1 ]; then
            echo "OpenHands Agent Server did not become healthy under runsc" >&2
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "status=PASS" >> "$GITHUB_OUTPUT"

      - name: Prove runsc Agent Server can reach the internal LiteLLM target
        id: runsc_gateway
        if: steps.provider_preflight.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' && steps.network.outputs.ready == 'true' && steps.server.outputs.ready == 'true' && steps.gateway.outputs.ready == 'true'
        continue-on-error: true
        env:
          AGENT_CONTAINER: ${{ steps.server.outputs.container }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/gateway"
          docker exec "$AGENT_CONTAINER" python -c \
            'import urllib.request; response = urllib.request.urlopen("http://litellm:4000/health/readiness", timeout=10); raise SystemExit(0 if response.status == 200 else 1)'
          exit_code=$?
          python3 - "$exit_code" "$RUNNER_TEMP/aiat-openhands-evidence/gateway/runsc-to-litellm.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          exit_code, output = sys.argv[1:]
          Path(output).write_text(
              json.dumps(
                  {
                      "schema_version": "aiat.openhands-runsc-to-litellm.v1",
                      "endpoint": "http://litellm:4000/health/readiness",
                      "runtime": "runsc",
                      "status": "PASS" if exit_code == "0" else "BLOCKED",
                      "response_payload_retained": False,
                  },
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=BLOCKED" >> "$GITHUB_OUTPUT"
          fi
          test "$exit_code" = 0

      - name: Record disposable gateway network topology
        id: network_topology
        if: steps.provider_preflight.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' && steps.network.outputs.ready == 'true' && steps.omniroute.outputs.ready == 'true' && steps.litellm.outputs.ready == 'true' && steps.bridge.outputs.ready == 'true' && steps.server.outputs.ready == 'true'
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/gateway"
          topology_input="$RUNNER_TEMP/aiat-openhands-network-inspect.json"
          inspect_exit_code=0
          docker network inspect "$network" > "$topology_input" || inspect_exit_code=$?
          python3 - \
            "$RUNNER_TEMP/aiat-openhands-evidence/gateway/network-topology.json" \
            "$topology_input" \
            "$GITHUB_RUN_ID" \
            "$inspect_exit_code" <<'PY'
          import json
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          run_id = sys.argv[3]
          inspect_exit_code = sys.argv[4]
          try:
              raw = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError):
              raw = []
          network = raw[0] if isinstance(raw, list) and raw else {}
          containers = network.get("Containers") if isinstance(network, dict) else {}
          topology = []
          expected_aliases = {
              f"aiat-openhands-cert-{run_id}": "agent-server",
              f"aiat-openhands-tool-service-{run_id}": "tool-service",
              f"aiat-openhands-litellm-{run_id}": "litellm",
              f"aiat-openhands-omniroute-{run_id}": "omniroute",
          }
          if isinstance(containers, dict):
              for value in containers.values():
                  if not isinstance(value, dict):
                      continue
                  topology.append(
                      {
                          "name": value.get("Name"),
                          "aliases": sorted(str(item) for item in (value.get("Aliases") or []) if item),
                          "ipv4": bool(value.get("IPv4Address")),
                      }
                  )
          expected = {
              f"aiat-openhands-cert-{run_id}",
              f"aiat-openhands-tool-service-{run_id}",
              f"aiat-openhands-litellm-{run_id}",
              f"aiat-openhands-omniroute-{run_id}",
          }
          observed = {str(item.get("name")) for item in topology}
          complete = (
              inspect_exit_code == "0"
              and observed == expected
              and all(item.get("ipv4") for item in topology)
              and all(expected_aliases.get(str(item.get("name"))) in item.get("aliases", []) for item in topology)
          )
          output.write_text(
              json.dumps(
                  {
                      "schema_version": "aiat.openhands-certification-network-topology.v1",
                      "network_aliases_expected": expected_aliases,
                      "attached_containers": sorted(topology, key=lambda item: str(item.get("name"))),
                      "expected_container_count": len(expected),
                      "observed_container_count": len(observed),
                      "docker_inspect_exit_code": int(inspect_exit_code),
                      "topology_status": "PASS" if complete else "BLOCKED",
                      "credentials_or_payloads_retained": False,
                  },
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          exit_code=$?
          rm -f "$topology_input"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          topology_status=$(python3 - "$RUNNER_TEMP/aiat-openhands-evidence/gateway/network-topology.json" <<'PY'
          import json
          import sys

          try:
              report = json.load(open(sys.argv[1], encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              report = {}
          print(report.get("topology_status", "BLOCKED"))
          PY
          )
          test "$topology_status" = PASS
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "status=PASS" >> "$GITHUB_OUTPUT"

      - name: Materialize run-scoped OpenHands profile and MCP entry
        id: runtime
        if: steps.provider_preflight.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' && steps.network.outputs.ready == 'true' && steps.network_topology.outputs.ready == 'true' && steps.runsc_gateway.outputs.ready == 'true'
        continue-on-error: true
        env:
          OPENHANDS_MODEL_ID: ${{ vars.OPENHANDS_MODEL_ID }}
          OPENHANDS_MCP_SETTINGS_KEY: ${{ vars.OPENHANDS_MCP_SETTINGS_KEY }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/runtime"
          test -s "$RUNNER_TEMP/aiat-openhands-session-key"
          export OPENHANDS_SESSION_API_KEY="$(cat "$RUNNER_TEMP/aiat-openhands-session-key")"
          uv run python scripts/provision_openhands_candidate_runtime.py \
            --base-url http://127.0.0.1:18000 \
            --output "$RUNNER_TEMP/aiat-openhands-evidence/runtime/runtime-provisioning.json" \
            --github-output "$GITHUB_OUTPUT"
          exit_code=$?
          runtime_status=$(python3 - "$RUNNER_TEMP/aiat-openhands-evidence/runtime/runtime-provisioning.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError):
              report = {}
          print("PASS" if isinstance(report, dict) and report.get("status") == "PASS" else "BLOCKED")
          PY
          )
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo "status=$runtime_status" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 0 ] && [ "$runtime_status" = PASS ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run governed OpenHands live adapter wave
        id: live
        if: steps.provider_preflight.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' && steps.network.outputs.ready == 'true' && steps.runtime.outputs.ready == 'true'
        continue-on-error: true
        env:
          OPENHANDS_AGENT_PROFILE_ID: ${{ steps.runtime.outputs.profile_id }}
          OPENHANDS_MCP_SETTINGS_KEY: ${{ steps.runtime.outputs.mcp_key }}
          OPENHANDS_MODEL_ID: ${{ vars.OPENHANDS_MODEL_ID }}
          OPENHANDS_CERT_RUN_ID: ${{ steps.runtime.outputs.run_id }}
          OPENHANDS_PROJECT_ID: ${{ steps.runtime.outputs.project_id }}
          OPENHANDS_MCP_PRECONFIGURED: "1"
          OPENHANDS_CERTIFICATION_CONTROLLER: aiat-github-actions
          OPENHANDS_CERT_CONTROLLER_RUN_ID: ${{ github.run_id }}
          OPENHANDS_SANDBOX_PROFILE: gvisor
          OPENHANDS_SANDBOX_RUNTIME: runsc
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/live" "$RUNNER_TEMP/aiat-openhands-workspace"
          cp -R "$GITHUB_WORKSPACE/mas/scripts/fixtures/openhands-coding-task/." \
            "$RUNNER_TEMP/aiat-openhands-workspace/"
          git -C "$RUNNER_TEMP/aiat-openhands-workspace" init --quiet
          git -C "$RUNNER_TEMP/aiat-openhands-workspace" config user.email aiat-certification@localhost
          git -C "$RUNNER_TEMP/aiat-openhands-workspace" config user.name aiat-certification
          git -C "$RUNNER_TEMP/aiat-openhands-workspace" add -- \
            pyproject.toml README.md slugger tests
          git -C "$RUNNER_TEMP/aiat-openhands-workspace" commit --quiet -m "certification baseline"
          test -s "$RUNNER_TEMP/aiat-openhands-session-key"
          export OPENHANDS_SESSION_API_KEY="$(cat "$RUNNER_TEMP/aiat-openhands-session-key")"
          uv run python scripts/openhands_live_certify.py \
            --base-url http://127.0.0.1:18000 \
            --interface-report docs/provenance/openhands-candidate/2026-08-22-v1.43.0/interface-verification.json \
            --workspace /workspace/project \
            --host-workspace "$RUNNER_TEMP/aiat-openhands-workspace" \
            --fixture-root "$GITHUB_WORKSPACE/mas/scripts/fixtures/openhands-coding-task" \
            --exercise-lifecycle \
            --task-spec docs/provenance/openhands-candidate/2026-08-22-v1.43.0/coding-task-spec.json \
            --output "$RUNNER_TEMP/aiat-openhands-evidence/live/live-certification.json"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Run OpenHands supply-chain and runtime evidence
        id: certification
        if: steps.provider_preflight.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' && steps.network.outputs.ready == 'true' && steps.runtime.outputs.ready == 'true'
        continue-on-error: true
        env:
          CONTAINER_NAME: ${{ steps.server.outputs.container }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/certification"
          test -s "$RUNNER_TEMP/aiat-openhands-session-key"
          SESSION_KEY="$(cat "$RUNNER_TEMP/aiat-openhands-session-key")"
          uv run python scripts/openhands_candidate_certify.py \
            --output "$RUNNER_TEMP/aiat-openhands-evidence/certification" \
            --tooling-manifest "$RUNNER_TEMP/aiat-openhands-evidence/tooling/tooling-provisioning.json" \
            --boundary-command "uv run pytest packages/mas-core/tests/test_openhands_agent_server_adapter.py packages/mas-core/tests/test_openhands_bridge.py apps/tool-service/tests/test_openhands_mcp.py -q" \
            --agent-server-url http://127.0.0.1:18000 \
            --session-api-key "$SESSION_KEY" \
            --container-name "$CONTAINER_NAME"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Verify disposable cleanup
        if: always()
        env:
          OPENHANDS_MCP_SETTINGS_KEY: ${{ steps.runtime.outputs.mcp_key || vars.OPENHANDS_MCP_SETTINGS_KEY }}
        run: |
          set +e
          name="aiat-openhands-cert-${GITHUB_RUN_ID}"
          tool_name="${tool_container:-aiat-openhands-tool-service-${GITHUB_RUN_ID}}"
          litellm_name="${litellm_container:-aiat-openhands-litellm-${GITHUB_RUN_ID}}"
          omniroute_name="${omniroute_container:-aiat-openhands-omniroute-${GITHUB_RUN_ID}}"
          network_name="${network:-aiat-openhands-cert-network-${GITHUB_RUN_ID}}"
          cleanup_ok=1
          docker_available=false
          if docker info >/dev/null 2>&1; then
            docker_available=true
          else
            cleanup_ok=0
          fi
          mcp_status="NOT_CREATED"
          mcp_verified_absent=true
          agent_existed=0
          if [ "$docker_available" = true ] && [ -n "$(docker ps -aq --filter "name=^/${name}$" 2>/dev/null)" ]; then
            agent_existed=1
          fi
          profile_status="NOT_CREATED"
          if [ "$agent_existed" = 1 ]; then
            # The workflow gives Agent Server no named profile volume.  Its
            # run-scoped profile therefore dies with this disposable
            # container; retain only that scalar disposal assertion.
            profile_status="VERIFIED_BY_CONTAINER_DISPOSAL"
          fi
          if [ -s "$RUNNER_TEMP/aiat-openhands-session-key" ] && [ -n "${OPENHANDS_MCP_SETTINGS_KEY:-}" ]; then
            session_key="$(cat "$RUNNER_TEMP/aiat-openhands-session-key")"
            delete_code=$(curl --silent --show-error --output /dev/null \
              --request DELETE \
              --header "X-Session-API-Key: $session_key" \
              --write-out '%{http_code}' \
              "http://127.0.0.1:18000/api/settings/mcp/${OPENHANDS_MCP_SETTINGS_KEY}" || true)
            settings_response=$(curl --silent --show-error --write-out '\n%{http_code}' \
              --header "X-Session-API-Key: $session_key" \
              "http://127.0.0.1:18000/api/settings" || true)
            settings_code="${settings_response##*$'\n'}"
            settings_json="${settings_response%$'\n'*}"
            delete_ok=false
            case "$delete_code" in
              200|204|404) delete_ok=true ;;
            esac
            DELETE_CODE="$delete_code" SETTINGS_CODE="$settings_code" SETTINGS_JSON="$settings_json" MCP_KEY="$OPENHANDS_MCP_SETTINGS_KEY" \
              python3 - "$RUNNER_TEMP/aiat-openhands-evidence/mcp-cleanup.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          try:
              settings = json.loads(os.environ.get("SETTINGS_JSON", "{}"))
          except json.JSONDecodeError:
              settings = {}
          config = settings.get("mcp_config") if isinstance(settings, dict) else None
          if not isinstance(config, dict):
              config = settings.get("mcp_servers") if isinstance(settings, dict) else None
          readback_ok = os.environ.get("SETTINGS_CODE", "") == "200"
          present = isinstance(config, dict) and os.environ.get("MCP_KEY", "") in config
          Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "schema_version": "aiat.openhands-mcp-cleanup.v1",
                      "delete_http_status": os.environ.get("DELETE_CODE", ""),
                      "settings_readback_http_status": os.environ.get("SETTINGS_CODE", ""),
                      "verified_absent": readback_ok and not present,
                      "payloads_retained": False,
                  },
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
            mcp_verified_absent=$(python3 - "$RUNNER_TEMP/aiat-openhands-evidence/mcp-cleanup.json" <<'PY'
          import json
          import sys

          try:
              report = json.load(open(sys.argv[1], encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              report = {}
          print("true" if report.get("verified_absent") is True else "false")
          PY
            )
            mcp_status="PASS"
            if [ "$delete_ok" != true ] || [ "$mcp_verified_absent" != true ]; then
              mcp_status="BLOCKED"
              cleanup_ok=0
            fi
          elif [ "$agent_existed" = 1 ]; then
            mcp_status="BLOCKED"
            mcp_verified_absent=false
            cleanup_ok=0
            python3 - "$RUNNER_TEMP/aiat-openhands-evidence/mcp-cleanup.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "schema_version": "aiat.openhands-mcp-cleanup.v1",
                      "status": "BLOCKED",
                      "reason": "agent_server_existed_without_session_key_or_mcp_key",
                      "verified_absent": False,
                      "payloads_retained": False,
                  },
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          else
            mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence"
            python3 - "$RUNNER_TEMP/aiat-openhands-evidence/mcp-cleanup.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "schema_version": "aiat.openhands-mcp-cleanup.v1",
                      "status": "NOT_CREATED",
                      "verified_absent": True,
                      "payloads_retained": False,
                  },
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          fi
          docker rm --force "$name" >/dev/null 2>&1 || true
          docker rm --force "$tool_name" >/dev/null 2>&1 || true
          docker rm --force "$litellm_name" >/dev/null 2>&1 || true
          docker rm --force "$omniroute_name" >/dev/null 2>&1 || true
          tool_image="aiat-openhands-tool-service-cert-${GITHUB_RUN_ID}"
          docker image rm "$tool_image" >/dev/null 2>&1 || true
          containers_absent=true
          image_absent=true
          network_absent=true
          if [ "$docker_available" = true ]; then
            for container in "$name" "$tool_name" "$litellm_name" "$omniroute_name"; do
              if [ -n "$(docker ps -aq --filter "name=^/${container}$" 2>/dev/null)" ]; then
                containers_absent=false
                cleanup_ok=0
              fi
            done
            if docker image inspect "$tool_image" >/dev/null 2>&1; then
              image_absent=false
              cleanup_ok=0
            fi
            docker network rm "$network_name" >/dev/null 2>&1 || true
          else
            containers_absent=false
            network_absent=false
          fi
          if [ "$docker_available" = true ] && [ -n "$(docker network ls -q --filter "name=^${network_name}$" 2>/dev/null)" ]; then
            network_absent=false
            cleanup_ok=0
          fi
          rm -f "$RUNNER_TEMP/aiat-openhands-session-key"
          secret_files_absent=true
          if [ -e "$RUNNER_TEMP/aiat-openhands-session-key" ]; then
            secret_files_absent=false
            cleanup_ok=0
          fi
          rm -rf -- "$RUNNER_TEMP/aiat-openhands-workspace"
          workspace_absent=true
          if [ -e "$RUNNER_TEMP/aiat-openhands-workspace" ]; then
            workspace_absent=false
            cleanup_ok=0
          fi
          unset AIAT_TOOL_SECRET OPENHANDS_MODEL_GATEWAY_API_KEY GROQ_API_KEY || true
          unset session_key settings_response settings_json delete_code || true
          secret_environment_entries_absent=true
          if [ -n "${GITHUB_ENV:-}" ]; then
            if [ -f "$GITHUB_ENV" ]; then
              if ! sed -i \
                -e '/^AIAT_TOOL_SECRET=/d' \
                -e '/^AIAT_TOOL_SECRET_SCOPE=/d' \
                -e '/^OPENHANDS_MODEL_GATEWAY_API_KEY=/d' \
                -e '/^OPENHANDS_MODEL_GATEWAY_API_KEY_SCOPE=/d' \
                -e '/^MODEL_GATEWAY_SECRET_SCOPE=/d' \
                "$GITHUB_ENV"; then
                secret_environment_entries_absent=false
                cleanup_ok=0
              fi
              if grep -Eq '^(AIAT_TOOL_SECRET|AIAT_TOOL_SECRET_SCOPE|OPENHANDS_MODEL_GATEWAY_API_KEY|OPENHANDS_MODEL_GATEWAY_API_KEY_SCOPE|MODEL_GATEWAY_SECRET_SCOPE)=' "$GITHUB_ENV"; then
                secret_environment_entries_absent=false
                cleanup_ok=0
              fi
            else
              secret_environment_entries_absent=false
              cleanup_ok=0
            fi
          fi
          python3 - "$RUNNER_TEMP/aiat-openhands-evidence/gateway/cleanup.json" \
            "$name" "$tool_name" "$litellm_name" "$omniroute_name" "$network_name" \
            "$mcp_status" "$mcp_verified_absent" "$profile_status" "$containers_absent" "$image_absent" "$network_absent" "$secret_files_absent" "$workspace_absent" "$secret_environment_entries_absent" "$cleanup_ok" "$docker_available" <<'PY'
          import json
          import sys
          from pathlib import Path

          output, *values = sys.argv[1:]
          names = values[:5]
          mcp_status, mcp_verified_absent, profile_status, containers_absent, image_absent, network_absent, secret_files_absent, workspace_absent, secret_environment_entries_absent, cleanup_ok, docker_available = values[5:]
          Path(output).parent.mkdir(parents=True, exist_ok=True)
          Path(output).write_text(
              json.dumps(
                  {
                  "schema_version": "aiat.openhands-certification-gateway-cleanup.v1",
                  "docker_available": docker_available == "true",
                  "containers": {
                      name: "absent" for name in names[:-1]
                  },
                  "network": {"name": names[-1], "status": "absent"},
                  "run_scoped_secret_files": "absent",
                  "run_scoped_secret_environment_entries_absent": secret_environment_entries_absent == "true",
                  "mcp": {
                      "status": mcp_status,
                      "verified_absent": mcp_verified_absent == "true",
                  },
                  "profile": {
                      "status": profile_status,
                      "run_scoped": True,
                      "verified_by_agent_container_absence": profile_status in {"NOT_CREATED", "VERIFIED_BY_CONTAINER_DISPOSAL"} and containers_absent == "true",
                  },
                  "containers_absent": containers_absent == "true",
                  "tool_image_absent": image_absent == "true",
                  "network_absent": network_absent == "true",
                  "secret_files_absent": secret_files_absent == "true",
                  "workspace_absent": workspace_absent == "true",
                  "provider_payloads_retained": False,
                  "zero_residue": cleanup_ok == "1",
              },
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          test "$cleanup_ok" = 1

      - name: Evaluate mandatory OpenHands gate matrix
        if: always()
        env:
          PROVIDER_STATUS: ${{ steps.provider_preflight.outputs.status }}
          CONFIGURATION_STATUS: ${{ steps.preflight.outputs.status }}
          CANDIDATE_SHA: ${{ env.AIAT_CANDIDATE_SHA }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/certification"
          provider_status="${PROVIDER_STATUS:-BLOCKED_MISSING_OPERATOR_SECRET}"
          configuration_status="${CONFIGURATION_STATUS:-FAILED_CERTIFICATION_IMPLEMENTATION}"
          uv run python scripts/check_openhands_gate_matrix.py \
            --output "$RUNNER_TEMP/aiat-openhands-evidence/certification/gate-evaluation.json" \
            --provider-status "$provider_status" \
            --configuration-status "$configuration_status" \
            --evidence-root "$RUNNER_TEMP/aiat-openhands-evidence" \
            --candidate-sha "$CANDIDATE_SHA" \
            --source-commit 4c1237f391fe394e9f67505fe3a0bd2d81f84188 \
            --image-digest sha256:36f847d1dfbbbdce90052437b06a3c6e76b8a54683228182eaf73085f03fcd97
          exit 0

      - name: Validate sanitized OpenHands evidence schema
        if: always()
        id: evidence_schema
        continue-on-error: true
        run: |
          set +e
          uv run python scripts/check_openhands_evidence_schema.py \
            --root "$RUNNER_TEMP/aiat-openhands-evidence" \
            --output "$RUNNER_TEMP/aiat-openhands-evidence/certification/evidence-schema-validation.json"
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 0 ]; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED_CERTIFICATION_IMPLEMENTATION" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload sanitized OpenHands evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openhands-candidate-certification-${{ github.run_id }}
          path: ${{ runner.temp }}/aiat-openhands-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Summarize fail-closed certification result
        if: always()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/aiat-openhands-evidence/certification/gate-evaluation.json"
          {
            echo "## OpenHands candidate certification"
            echo
          if [ -f "$report" ]; then
              python3 - "$report" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          evaluation = report.get("evaluation") or {}
          root = Path(sys.argv[1]).parent.parent

          def read_status(relative: str, field: str) -> str:
              try:
                  value = json.loads((root / relative).read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                  return "NOT_RECORDED"
              return str(value.get(field) or "NOT_RECORDED") if isinstance(value, dict) else "NOT_RECORDED"

          final_status = str(report.get("status") or "FAILED_CERTIFICATION_IMPLEMENTATION")
          print(f"- Candidate SHA: `{report.get('candidate_sha') or 'unknown'}`")
          print(f"- Provider configuration: `{report.get('provider_configuration_status') or 'unknown'}`")
          print(f"- Candidate preflight: `{report.get('configuration_status') or 'unknown'}`")
          print(f"- gVisor startup: `{read_status('startup/startup.json', 'health_status')}`")
          print(f"- Provider baseline: `{read_status('gateway/provider-baseline.json', 'status')}`")
          print(f"- Auto-router evidence: `{read_status('gateway/auto-routing.json', 'status')}`")
          print(f"- Model gateway route: `{read_status('gateway/route-probe.json', 'status')}`")
          print(f"- Evidence blocker: `{report.get('evidence_blocker_status') or 'none'}`")
          print(f"- Evidence schema: `{read_status('certification/evidence-schema-validation.json', 'status')}`")
          print(f"- Mandatory gates: `{evaluation.get('passed_gate_count', 0)}/{evaluation.get('mandatory_gate_count', 0)} PASS`")
          print(f"- Final result: `{final_status}`")
          if final_status != "PASSED":
              print("- Workflow outcome: `EXPECTED_FAIL_CLOSED_CERTIFICATION_BLOCK`")
          print("- Worker activation: `INACTIVE`")
          PY
            else
              echo '- Final result: `FAILED_CERTIFICATION_IMPLEMENTATION` (gate-evaluation.json missing)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the workflow red when certification is blocked or unresolved
        if: always()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/aiat-openhands-evidence/certification/gate-evaluation.json"
          test -f "$report"
          status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$report")
          test "$status" = PASSED
          schema_report="$RUNNER_TEMP/aiat-openhands-evidence/certification/evidence-schema-validation.json"
          test -f "$schema_report"
          schema_status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$schema_report")
          test "$schema_status" = PASS
