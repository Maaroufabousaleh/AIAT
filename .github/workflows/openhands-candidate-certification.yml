name: OpenHands Candidate Certification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact AIAT candidate commit to certify"
        required: true
        type: string

permissions:
  contents: read

env:
  OPENHANDS_IMAGE: ghcr.io/openhands/agent-server:1.43.0-python@sha256:36f847d1dfbbbdce90052437b06a3c6e76b8a54683228182eaf73085f03fcd97
  LITELLM_IMAGE: ghcr.io/berriai/litellm@sha256:a50b02a6056095da29308310bb608f0509e08ddcd1d105bae9c21007d82b0e95
  OMNIROUTE_IMAGE: diegosouzapw/omniroute@sha256:ceae8d9da0acf075dbf5905b61c9ae32e749112650fcf7f4434c8d96ac6d3ebb
  OPENHANDS_MODEL_GATEWAY_URL: http://litellm:4000

jobs:
  certify:
    # ubuntu-slim is deliberately excluded: this job needs a privileged
    # Docker Engine and the native runsc runtime.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mas
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Bind evidence to candidate commit
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_SHA"
          echo "AIAT_CANDIDATE_SHA=$actual" >> "$GITHUB_ENV"

      - name: Install gVisor on native Linux
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          ! uname -r | grep -Eiq 'microsoft|wsl'
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg
          curl -fsSL https://gvisor.dev/archive.key \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          runsc --version
          sudo runsc install
          sudo systemctl restart docker
          docker info | grep -A10 Runtimes

      - name: Install AIAT environment
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check uv==0.4.30
          uv sync --locked --dev

      - name: Provision pinned scanners and SBOM tooling
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence" "$RUNNER_TEMP/aiat-openhands-tools"
          uv run python scripts/provision_openhands_certification_tools.py \
            --output "$RUNNER_TEMP/aiat-openhands-evidence/tooling" \
            --install-dir "$RUNNER_TEMP/aiat-openhands-tools"
          while IFS= read -r entry; do
            test -n "$entry"
            echo "$entry" >> "$GITHUB_PATH"
          done < "$RUNNER_TEMP/aiat-openhands-evidence/tooling/tooling-paths.txt"

      - name: Generate disposable AIAT tool-service secret
        run: |
          set -euo pipefail
          tool_secret="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          test "${#tool_secret}" -ge 32
          echo "::add-mask::$tool_secret"
          {
            echo "AIAT_TOOL_SECRET=$tool_secret"
            echo "AIAT_TOOL_SECRET_SCOPE=github-run"
          } >> "$GITHUB_ENV"

      - name: Generate disposable AIAT model-gateway secret
        run: |
          set -euo pipefail
          gateway_key="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          test "${#gateway_key}" -ge 32
          echo "::add-mask::$gateway_key"
          {
            echo "OPENHANDS_MODEL_GATEWAY_API_KEY=$gateway_key"
            echo "OPENHANDS_MODEL_GATEWAY_API_KEY_SCOPE=github-run"
            echo "MODEL_GATEWAY_SECRET_SCOPE=github-run"
            echo "OPENHANDS_MODEL_GATEWAY_URL=http://litellm:4000"
          } >> "$GITHUB_ENV"

      - name: Run non-secret OpenHands portability preflight
        id: preflight
        continue-on-error: true
        env:
          OPENHANDS_MODEL_ID: ${{ vars.OPENHANDS_MODEL_ID }}
          OPENHANDS_MCP_SETTINGS_KEY: ${{ vars.OPENHANDS_MCP_SETTINGS_KEY }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/preflight"
          uv run python scripts/check_openhands_candidate_preflight.py \
            --output "$RUNNER_TEMP/aiat-openhands-evidence/preflight/preflight.json"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Pull pinned certification images and verify gateway provenance
        run: |
          set -euo pipefail
          docker pull "$OPENHANDS_IMAGE"
          docker pull "$LITELLM_IMAGE"
          docker pull "$OMNIROUTE_IMAGE"
          docker image inspect "$OPENHANDS_IMAGE" >/dev/null
          docker image inspect "$LITELLM_IMAGE" >/dev/null
          docker image inspect "$OMNIROUTE_IMAGE" >/dev/null
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/gateway"
          uv run python scripts/verify_openhands_gateway_pins.py \
            --output "$RUNNER_TEMP/aiat-openhands-evidence/gateway/pins.json"
          litellm_version="$(docker run --rm --network none --entrypoint python "$LITELLM_IMAGE" \
            -c 'import importlib.metadata; print(importlib.metadata.version("litellm"))')"
          test "$litellm_version" = "1.90.0"
          omniroute_version="$(docker run --rm --network none --entrypoint node "$OMNIROUTE_IMAGE" \
            -e 'console.log(require("/app/package.json").version)')"
          test "$omniroute_version" = "3.8.38"
          tag_commit="$(git ls-remote https://github.com/diegosouzapw/OmniRoute.git 'refs/tags/v3.8.38^{}' | awk '{print $1}')"
          test "$tag_commit" = "7b139fdb5e42658a49f9d99ddf0eeeba9a994fd8"
          LITELLM_VERSION="$litellm_version" OMNIROUTE_VERSION="$omniroute_version" \
            OMNIROUTE_TAG_COMMIT="$tag_commit" \
            python3 - "$RUNNER_TEMP/aiat-openhands-evidence/gateway/version-verification.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "schema_version": "aiat.openhands-certification-gateway-version-verification.v1",
                      "litellm_version": os.environ["LITELLM_VERSION"],
                      "omniroute_version": os.environ["OMNIROUTE_VERSION"],
                      "omniroute_release_tag_commit": os.environ["OMNIROUTE_TAG_COMMIT"],
                      "floating_tags_used": False,
                      "source_or_payload_retained": False,
                  },
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )

      - name: Create disposable model-gateway network
        id: network
        continue-on-error: true
        run: |
          set -euo pipefail
          network="aiat-openhands-cert-network-${GITHUB_RUN_ID}"
          docker network create "$network"
          echo "network=$network" >> "$GITHUB_OUTPUT"
          echo "network=$network" >> "$GITHUB_ENV"

      - name: Start disposable OmniRoute provider gateway
        id: omniroute
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/gateway/omniroute"
          name="aiat-openhands-omniroute-${GITHUB_RUN_ID}"
          docker run --detach --name "$name" \
            --network "$network" --network-alias omniroute \
            --publish 127.0.0.1:20128:20128 \
            --env PORT=20128 \
            --env DASHBOARD_PORT=20128 \
            --env API_PORT=20129 \
            --env API_HOST=0.0.0.0 \
            --env OMNIROUTE_API_KEY="$OPENHANDS_MODEL_GATEWAY_API_KEY" \
            --env GROQ_API_KEY="$GROQ_API_KEY" \
            "$OMNIROUTE_IMAGE"
          echo "omniroute_container=$name" >> "$GITHUB_ENV"
          echo "container=$name" >> "$GITHUB_OUTPUT"
          healthy=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:20128/api/health/ping >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          docker inspect --format '{{json .State}}' "$name" > "$RUNNER_TEMP/aiat-openhands-evidence/gateway/omniroute/container-state.json"
          docker inspect --format '{{json .HostConfig.Runtime}}' "$name" > "$RUNNER_TEMP/aiat-openhands-evidence/gateway/omniroute/container-runtime.json"
          python3 - "$healthy" "$RUNNER_TEMP/aiat-openhands-evidence/gateway/omniroute/health.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          healthy, output = sys.argv[1:]
          Path(output).write_text(
              json.dumps(
                  {
                      "schema_version": "aiat.openhands-certification-omniroute-health.v1",
                      "health_status": "PASS" if healthy == "1" else "BLOCKED",
                      "endpoint": "http://omniroute:20128/api/health/ping",
                      "provider_count_expected": 1,
                      "raw_response_retained": False,
                  },
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          test "$healthy" = 1

      - name: Configure exactly one disposable OmniRoute provider route
        id: provider
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/gateway"
          OMNIROUTE_BASE_URL=http://127.0.0.1:20128 \
            OMNIROUTE_API_KEY="$OPENHANDS_MODEL_GATEWAY_API_KEY" \
            uv run python scripts/provision_openhands_certification_gateway.py \
              --output "$RUNNER_TEMP/aiat-openhands-evidence/gateway/provider-provisioning.json"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Start disposable LiteLLM model gateway
        id: litellm
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/gateway/litellm"
          name="aiat-openhands-litellm-${GITHUB_RUN_ID}"
          config="$GITHUB_WORKSPACE/mas/infra/compose/litellm_openhands_certification.yaml"
          test -s "$config"
          docker run --detach --name "$name" \
            --network "$network" --network-alias litellm \
            --publish 127.0.0.1:4000:4000 \
            --volume "$config:/app/config.yaml:ro" \
            --env LITELLM_MASTER_KEY="$OPENHANDS_MODEL_GATEWAY_API_KEY" \
            --env OMNIROUTE_API_KEY="$OPENHANDS_MODEL_GATEWAY_API_KEY" \
            "$LITELLM_IMAGE" \
            --config /app/config.yaml --host 0.0.0.0 --port 4000
          echo "litellm_container=$name" >> "$GITHUB_ENV"
          echo "container=$name" >> "$GITHUB_OUTPUT"
          healthy=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4000/health/readiness >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          docker inspect --format '{{json .State}}' "$name" > "$RUNNER_TEMP/aiat-openhands-evidence/gateway/litellm/container-state.json"
          docker inspect --format '{{json .HostConfig.Runtime}}' "$name" > "$RUNNER_TEMP/aiat-openhands-evidence/gateway/litellm/container-runtime.json"
          python3 - "$healthy" "$RUNNER_TEMP/aiat-openhands-evidence/gateway/litellm/health.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          healthy, output = sys.argv[1:]
          Path(output).write_text(
              json.dumps(
                  {
                      "schema_version": "aiat.openhands-certification-litellm-health.v1",
                      "health_status": "PASS" if healthy == "1" else "BLOCKED",
                      "endpoint": "http://litellm:4000/health/readiness",
                      "model_id": "omniroute-coding",
                      "raw_response_retained": False,
                  },
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          test "$healthy" = 1

      - name: Verify deterministic provider route through LiteLLM
        id: gateway
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/gateway"
          LITELLM_BASE_URL=http://127.0.0.1:4000 \
            OMNIROUTE_BASE_URL=http://127.0.0.1:20128 \
            uv run python scripts/check_openhands_certification_gateway.py \
              --litellm-url http://127.0.0.1:4000 \
              --omniroute-url http://127.0.0.1:20128 \
              --output "$RUNNER_TEMP/aiat-openhands-evidence/gateway/route-probe.json"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Start disposable AIAT tool-service bridge
        id: bridge
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aiat-openhands-workspace" "$RUNNER_TEMP/aiat-openhands-evidence/bridge"
          tool_name="aiat-openhands-tool-service-${GITHUB_RUN_ID}"
          image="aiat-openhands-tool-service-cert:${GITHUB_RUN_ID}"
          docker build --file infra/docker/Dockerfile.tool-service --tag "$image" .
          docker run --detach --name "$tool_name" \
            --network "$network" --network-alias tool-service \
            --publish 127.0.0.1:18002:8002 \
            --volume "$RUNNER_TEMP/aiat-openhands-workspace:/workspace:rw" \
            --env TOOL_SECRET="$AIAT_TOOL_SECRET" \
            --env TOOL_WORKSPACE_ROOT=/workspace \
            --env LOG_LEVEL=INFO \
            "$image"
          echo "network=$network" >> "$GITHUB_OUTPUT"
          echo "tool_container=$tool_name" >> "$GITHUB_OUTPUT"
          echo "network=$network" >> "$GITHUB_ENV"
          echo "tool_container=$tool_name" >> "$GITHUB_ENV"
          healthy=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18002/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          docker inspect --format '{{json .State}}' "$tool_name" > "$RUNNER_TEMP/aiat-openhands-evidence/bridge/container-state.json"
          docker inspect --format '{{json .HostConfig.Runtime}}' "$tool_name" > "$RUNNER_TEMP/aiat-openhands-evidence/bridge/container-runtime.json"
          python3 - "$healthy" "$RUNNER_TEMP/aiat-openhands-evidence/bridge/startup.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          healthy, output = sys.argv[1:]
          Path(output).write_text(
              json.dumps(
                  {
                      "schema_version": "aiat.openhands-tool-service-startup.v1",
                      "health_status": "PASS" if healthy == "1" else "BLOCKED",
                      "bridge_url": "http://tool-service:8002/openhands/mcp",
                      "payloads_retained": False,
                      "container_logs_retained": False,
                  },
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          test "$healthy" = 1

      - name: Start Agent Server under runsc
        id: server
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/startup" "$RUNNER_TEMP/aiat-openhands-workspace"
          name="aiat-openhands-cert-${GITHUB_RUN_ID}"
          key=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          echo "::add-mask::$key"
          key_file="$RUNNER_TEMP/aiat-openhands-session-key"
          umask 077
          printf '%s' "$key" > "$key_file"
          echo "container=$name" >> "$GITHUB_OUTPUT"
          echo "agent_container=$name" >> "$GITHUB_ENV"
          docker run --detach --name "$name" --runtime=runsc \
            --network "$network" --network-alias agent-server \
            --publish 127.0.0.1:18000:8000 \
            --volume "$RUNNER_TEMP/aiat-openhands-workspace:/workspace/project:rw" \
            --env SESSION_API_KEY="$key" \
            "$OPENHANDS_IMAGE"
          healthy=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error \
              -H "X-Session-API-Key: $key" \
              http://127.0.0.1:18000/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          docker inspect --format '{{json .State}}' "$name" > "$RUNNER_TEMP/aiat-openhands-evidence/startup/container-state.json"
          docker inspect --format '{{json .HostConfig.Runtime}}' "$name" > "$RUNNER_TEMP/aiat-openhands-evidence/startup/container-runtime.json"
          python3 - "$healthy" "$RUNNER_TEMP/aiat-openhands-evidence/startup/startup.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          healthy, output = sys.argv[1:]
          Path(output).write_text(
              json.dumps(
                  {
                      "schema_version": "aiat.openhands-startup.v1",
                      "health_status": "PASS" if healthy == "1" else "BLOCKED",
                      "runtime_expected": "runsc",
                      "payloads_retained": False,
                      "container_logs_retained": False,
                  },
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          if [ "$healthy" != 1 ]; then
            echo "OpenHands Agent Server did not become healthy under runsc" >&2
            docker logs --tail 40 "$name" >&2 || true
            exit 1
          fi

      - name: Prove runsc Agent Server can reach the internal LiteLLM target
        id: runsc_gateway
        continue-on-error: true
        env:
          AGENT_CONTAINER: ${{ steps.server.outputs.container }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/gateway"
          docker exec "$AGENT_CONTAINER" python -c \
            'import urllib.request; response = urllib.request.urlopen("http://litellm:4000/health/readiness", timeout=10); raise SystemExit(0 if response.status == 200 else 1)'
          exit_code=$?
          python3 - "$exit_code" "$RUNNER_TEMP/aiat-openhands-evidence/gateway/runsc-to-litellm.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          exit_code, output = sys.argv[1:]
          Path(output).write_text(
              json.dumps(
                  {
                      "schema_version": "aiat.openhands-runsc-to-litellm.v1",
                      "endpoint": "http://litellm:4000/health/readiness",
                      "runtime": "runsc",
                      "status": "PASS" if exit_code == "0" else "BLOCKED",
                      "response_payload_retained": False,
                  },
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          test "$exit_code" = 0

      - name: Materialize run-scoped OpenHands profile and MCP entry
        id: runtime
        continue-on-error: true
        env:
          OPENHANDS_MODEL_ID: ${{ vars.OPENHANDS_MODEL_ID }}
          OPENHANDS_MCP_SETTINGS_KEY: ${{ vars.OPENHANDS_MCP_SETTINGS_KEY }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/runtime"
          test -s "$RUNNER_TEMP/aiat-openhands-session-key"
          export OPENHANDS_SESSION_API_KEY="$(cat "$RUNNER_TEMP/aiat-openhands-session-key")"
          uv run python scripts/provision_openhands_candidate_runtime.py \
            --base-url http://127.0.0.1:18000 \
            --output "$RUNNER_TEMP/aiat-openhands-evidence/runtime/runtime-provisioning.json" \
            --github-output "$GITHUB_OUTPUT"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Run governed OpenHands live adapter wave
        id: live
        continue-on-error: true
        env:
          OPENHANDS_AGENT_PROFILE_ID: ${{ steps.runtime.outputs.profile_id }}
          OPENHANDS_MCP_SETTINGS_KEY: ${{ steps.runtime.outputs.mcp_key }}
          OPENHANDS_MODEL_ID: ${{ vars.OPENHANDS_MODEL_ID }}
          OPENHANDS_CERT_RUN_ID: ${{ steps.runtime.outputs.run_id }}
          OPENHANDS_PROJECT_ID: ${{ steps.runtime.outputs.project_id }}
          OPENHANDS_MCP_PRECONFIGURED: "1"
          OPENHANDS_CERTIFICATION_CONTROLLER: aiat-github-actions
          OPENHANDS_CERT_CONTROLLER_RUN_ID: ${{ github.run_id }}
          OPENHANDS_SANDBOX_PROFILE: gvisor
          OPENHANDS_SANDBOX_RUNTIME: runsc
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/live" "$RUNNER_TEMP/aiat-openhands-workspace"
          test -s "$RUNNER_TEMP/aiat-openhands-session-key"
          export OPENHANDS_SESSION_API_KEY="$(cat "$RUNNER_TEMP/aiat-openhands-session-key")"
          uv run python scripts/openhands_live_certify.py \
            --base-url http://127.0.0.1:18000 \
            --interface-report docs/provenance/openhands-candidate/2026-08-22-v1.43.0/interface-verification.json \
            --workspace /workspace/project \
            --output "$RUNNER_TEMP/aiat-openhands-evidence/live/live-certification.json"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Run OpenHands supply-chain and runtime evidence
        id: certification
        continue-on-error: true
        env:
          CONTAINER_NAME: ${{ steps.server.outputs.container }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/aiat-openhands-evidence/certification"
          test -s "$RUNNER_TEMP/aiat-openhands-session-key"
          SESSION_KEY="$(cat "$RUNNER_TEMP/aiat-openhands-session-key")"
          uv run python scripts/openhands_candidate_certify.py \
            --output "$RUNNER_TEMP/aiat-openhands-evidence/certification" \
            --tooling-manifest "$RUNNER_TEMP/aiat-openhands-evidence/tooling/tooling-provisioning.json" \
            --boundary-command "uv run pytest packages/mas-core/tests/test_openhands_agent_server_adapter.py packages/mas-core/tests/test_openhands_bridge.py apps/tool-service/tests/test_openhands_mcp.py -q" \
            --agent-server-url http://127.0.0.1:18000 \
            --session-api-key "$SESSION_KEY" \
            --container-name "$CONTAINER_NAME"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Verify disposable cleanup
        if: always()
        env:
          OPENHANDS_MCP_SETTINGS_KEY: ${{ steps.runtime.outputs.mcp_key || vars.OPENHANDS_MCP_SETTINGS_KEY }}
        run: |
          set -euo pipefail
          name="aiat-openhands-cert-${GITHUB_RUN_ID}"
          tool_name="${tool_container:-aiat-openhands-tool-service-${GITHUB_RUN_ID}}"
          litellm_name="${litellm_container:-aiat-openhands-litellm-${GITHUB_RUN_ID}}"
          omniroute_name="${omniroute_container:-aiat-openhands-omniroute-${GITHUB_RUN_ID}}"
          network_name="${network:-aiat-openhands-cert-network-${GITHUB_RUN_ID}}"
          if [ -s "$RUNNER_TEMP/aiat-openhands-session-key" ] && [ -n "${OPENHANDS_MCP_SETTINGS_KEY:-}" ]; then
            session_key="$(cat "$RUNNER_TEMP/aiat-openhands-session-key")"
            delete_code=$(curl --silent --show-error --output /dev/null \
              --request DELETE \
              --header "X-Session-API-Key: $session_key" \
              --write-out '%{http_code}' \
              "http://127.0.0.1:18000/api/settings/mcp/${OPENHANDS_MCP_SETTINGS_KEY}" || true)
            settings_response=$(curl --silent --show-error --write-out '\n%{http_code}' \
              --header "X-Session-API-Key: $session_key" \
              "http://127.0.0.1:18000/api/settings" || true)
            settings_code="${settings_response##*$'\n'}"
            settings_json="${settings_response%$'\n'*}"
            DELETE_CODE="$delete_code" SETTINGS_CODE="$settings_code" SETTINGS_JSON="$settings_json" MCP_KEY="$OPENHANDS_MCP_SETTINGS_KEY" \
              python3 - "$RUNNER_TEMP/aiat-openhands-evidence/mcp-cleanup.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          try:
              settings = json.loads(os.environ.get("SETTINGS_JSON", "{}"))
          except json.JSONDecodeError:
              settings = {}
          config = settings.get("mcp_config") if isinstance(settings, dict) else None
          if not isinstance(config, dict):
              config = settings.get("mcp_servers") if isinstance(settings, dict) else None
          readback_ok = os.environ.get("SETTINGS_CODE", "") == "200"
          present = isinstance(config, dict) and os.environ.get("MCP_KEY", "") in config
          Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "schema_version": "aiat.openhands-mcp-cleanup.v1",
                      "delete_http_status": os.environ.get("DELETE_CODE", ""),
                      "settings_readback_http_status": os.environ.get("SETTINGS_CODE", ""),
                      "verified_absent": readback_ok and not present,
                      "payloads_retained": False,
                  },
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          fi
          docker rm --force "$name" >/dev/null 2>&1 || true
          docker rm --force "$tool_name" >/dev/null 2>&1 || true
          docker rm --force "$litellm_name" >/dev/null 2>&1 || true
          docker rm --force "$omniroute_name" >/dev/null 2>&1 || true
          test -z "$(docker ps -aq --filter "name=^/${name}$")"
          test -z "$(docker ps -aq --filter "name=^/${tool_name}$")"
          test -z "$(docker ps -aq --filter "name=^/${litellm_name}$")"
          test -z "$(docker ps -aq --filter "name=^/${omniroute_name}$")"
          docker network rm "$network_name" >/dev/null 2>&1 || true
          test -z "$(docker network ls -q --filter "name=^${network_name}$")"
          rm -f "$RUNNER_TEMP/aiat-openhands-session-key"
          unset AIAT_TOOL_SECRET OPENHANDS_MODEL_GATEWAY_API_KEY GROQ_API_KEY || true
          python3 - "$RUNNER_TEMP/aiat-openhands-evidence/gateway/cleanup.json" \
            "$name" "$tool_name" "$litellm_name" "$omniroute_name" "$network_name" <<'PY'
          import json
          import sys
          from pathlib import Path

          output, *names = sys.argv[1:]
          Path(output).parent.mkdir(parents=True, exist_ok=True)
          Path(output).write_text(
              json.dumps(
                  {
                      "schema_version": "aiat.openhands-certification-gateway-cleanup.v1",
                      "containers": {
                          name: "absent" for name in names[:-1]
                      },
                      "network": {"name": names[-1], "status": "absent"},
                      "run_scoped_secret_files": "absent",
                      "provider_payloads_retained": False,
                      "zero_residue": True,
                  },
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload sanitized OpenHands evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openhands-candidate-certification-${{ github.run_id }}
          path: ${{ runner.temp }}/aiat-openhands-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Keep the workflow red when certification is blocked or unresolved
        if: always()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/aiat-openhands-evidence/certification/candidate-certification.json"
          test -f "$report"
          status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$report")
          test "$status" = passed
