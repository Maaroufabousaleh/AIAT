name: AIAT candidate image promotion (trusted workflow)

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/aiat-image-candidate-promotion.yml
      - mas/release/image-promotion-candidate.json
      - mas/release/IMAGE-PROMOTION.md
      - mas/scripts/verify_image_candidate_evidence.py
      - mas/scripts/verify_image_promotion.py
      - mas/scripts/tests/test_verify_image_promotion.py
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed source SHA pinned in mas/release/image-promotion-candidate.json
        required: true
        type: string
      image:
        description: Promote exactly one image; Redis must be promoted before worker
        required: true
        type: choice
        options:
          - redis
          - worker
      repository_ci_run_id:
        description: Expected AIAT CI run ID from the pinned candidate manifest
        required: true
        type: string
      worker_evidence_run_id:
        description: Expected Alpine worker evidence run ID from the pinned candidate manifest
        required: true
        type: string
      redis_evidence_run_id:
        description: Expected Redis evidence run ID from the pinned candidate manifest
        required: true
        type: string
      publish_candidate:
        description: Publish the reviewed private candidate after all read-only gates pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aiat-image-candidate-promotion-${{ inputs.candidate_sha }}-${{ inputs.image }}
  cancel-in-progress: false

jobs:
  pull-request-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out pull request contents without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run read-only promotion preflight regression tests
        run: python3 -m unittest mas.scripts.tests.test_verify_image_promotion -v

      - name: Install pinned actionlint binary and verify its checksum
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --location --fail --silent --show-error \
            --proto '=https' --proto-redir '=https' --max-redirs 5 \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          "$RUNNER_TEMP/actionlint-bin/actionlint" .github/workflows/aiat-image-candidate-promotion.yml

      - name: Install pinned Gitleaks binary and verify its checksum
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --location --fail --silent --show-error \
            --proto '=https' --proto-redir '=https' --max-redirs 5 \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks

      - name: Secret-scan only the reviewed promotion files
        run: |
          set -euo pipefail
          scan_root="$RUNNER_TEMP/promotion-secret-scan"
          mkdir -p "$scan_root/.github/workflows" "$scan_root/mas/scripts/tests" "$scan_root/mas/release"
          cp .github/workflows/aiat-image-candidate-promotion.yml "$scan_root/.github/workflows/"
          cp mas/scripts/verify_image_candidate_evidence.py mas/scripts/verify_image_promotion.py "$scan_root/mas/scripts/"
          cp mas/scripts/tests/test_verify_image_promotion.py "$scan_root/mas/scripts/tests/"
          cp mas/release/image-promotion-candidate.json mas/release/IMAGE-PROMOTION.md "$scan_root/mas/release/"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" dir "$scan_root" \
            --no-banner --redact --report-format json \
            --report-path "$RUNNER_TEMP/promotion-secret-scan.json"
          cat "$RUNNER_TEMP/promotion-secret-scan.json"

  evidence-preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      image: ${{ steps.dispatch.outputs.image }}
    steps:
      - name: Check out trusted workflow revision, never the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify workflow revision and exact candidate inputs
        id: dispatch
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          IMAGE: ${{ inputs.image }}
          CI_RUN_ID: ${{ inputs.repository_ci_run_id }}
          WORKER_RUN_ID: ${{ inputs.worker_evidence_run_id }}
          REDIS_RUN_ID: ${{ inputs.redis_evidence_run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python mas/scripts/verify_image_promotion.py \
            --manifest mas/release/image-promotion-candidate.json dispatch \
            --candidate-sha "$CANDIDATE_SHA" --image "$IMAGE" \
            --ci-run-id "$CI_RUN_ID" --worker-run-id "$WORKER_RUN_ID" \
            --redis-run-id "$REDIS_RUN_ID" \
            --run-ref "$RUN_REF" --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Verify the repository CI run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.repository_ci_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/repository-ci-run.json"
          python mas/scripts/verify_image_promotion.py \
            --manifest mas/release/image-promotion-candidate.json run \
            --kind repository_ci --json "$RUNNER_TEMP/repository-ci-run.json"

      - name: Verify both candidate evidence run identities
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_RUN_ID: ${{ inputs.worker_evidence_run_id }}
          REDIS_RUN_ID: ${{ inputs.redis_evidence_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WORKER_RUN_ID" > "$RUNNER_TEMP/worker-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REDIS_RUN_ID" > "$RUNNER_TEMP/redis-run.json"
          python mas/scripts/verify_image_promotion.py \
            --manifest mas/release/image-promotion-candidate.json run \
            --kind worker --json "$RUNNER_TEMP/worker-run.json"
          python mas/scripts/verify_image_promotion.py \
            --manifest mas/release/image-promotion-candidate.json run \
            --kind redis --json "$RUNNER_TEMP/redis-run.json"

      - name: Verify selected artifact identity and GitHub digest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          artifact_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["images"][sys.argv[2]]["artifact_id"])' \
            mas/release/image-promotion-candidate.json "$IMAGE")"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "$RUNNER_TEMP/evidence-artifact.json"
          python mas/scripts/verify_image_promotion.py \
            --manifest mas/release/image-promotion-candidate.json artifact \
            --kind "$IMAGE" --json "$RUNNER_TEMP/evidence-artifact.json"

      - name: Download and hash-check the evidence artifact archive
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence-download"
          artifact_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["images"][sys.argv[2]]["artifact_id"])' \
            mas/release/image-promotion-candidate.json "$IMAGE")"
          curl --location --fail --silent --show-error \
            --proto '=https' --proto-redir '=https' --max-redirs 5 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --output "$RUNNER_TEMP/evidence-download/evidence.zip" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
          python mas/scripts/verify_image_promotion.py \
            --manifest mas/release/image-promotion-candidate.json extract \
            --kind "$IMAGE" --zip "$RUNNER_TEMP/evidence-download/evidence.zip" \
            --destination "$RUNNER_TEMP/candidate-evidence"

      - name: Verify candidate scan reports, SBOM, source and image archive hash
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          python mas/scripts/verify_image_promotion.py \
            --manifest mas/release/image-promotion-candidate.json evidence \
            --kind "$IMAGE" --root "$RUNNER_TEMP/candidate-evidence"

      - name: Verify original archive provenance and SBOM attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          if [[ "$IMAGE" == redis ]]; then
            archive="$RUNNER_TEMP/candidate-evidence/candidate-image.tar"
            signer="$GITHUB_REPOSITORY/.github/workflows/redis-initializer-evidence.yml"
          else
            archive="$RUNNER_TEMP/candidate-evidence/candidate.oci.tar"
            signer="$GITHUB_REPOSITORY/.github/workflows/first-party-worker-alpine-candidate-evidence.yml"
          fi
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" --format json \
            > "$RUNNER_TEMP/original-build-provenance-verification.json"
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" --predicate-type https://cyclonedx.org/bom \
            --format json > "$RUNNER_TEMP/original-build-sbom-verification.json"

      - name: Place original attestation verification results beside the verified payload
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/original-build-provenance-verification.json" \
            "$RUNNER_TEMP/candidate-evidence/original-build-provenance-verification.json"
          cp "$RUNNER_TEMP/original-build-sbom-verification.json" \
            "$RUNNER_TEMP/candidate-evidence/original-build-sbom-verification.json"

      - name: Retain verified payload for the protected promotion job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aiat-verified-promotion-input-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-evidence/**
          if-no-files-found: error
          retention-days: 30

  control-preflight:
    if: github.ref == 'refs/heads/main'
    needs: evidence-preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      controls: ${{ steps.verify.outputs.controls }}
    steps:
      - name: Check out trusted workflow revision, never the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Mint short-lived read-only release-control token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AIAT_RELEASE_GATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AIAT_RELEASE_GATE_APP_PRIVATE_KEY }}
          owner: Maaroufabousaleh
          repositories: AIAT
          permission-administration: read
          permission-environments: read
          permission-contents: read

      - name: Verify current environment, reviewer, branch and package controls
        id: verify
        env:
          AIAT_RELEASE_CONTROL_TOKEN: ${{ steps.app-token.outputs.token }}
          AIAT_GHCR_METADATA_TOKEN: ${{ secrets.AIAT_GHCR_METADATA_TOKEN }}
          AIAT_GHCR_PACKAGE_ACCESS_MODE: ${{ vars.AIAT_GHCR_PACKAGE_ACCESS_MODE }}
          AIAT_GHCR_PACKAGE_ACCESS_VERIFIED_SHA: ${{ vars.AIAT_GHCR_PACKAGE_ACCESS_VERIFIED_SHA }}
          AIAT_GHCR_REDIS_PROMOTED_DIGEST: ${{ vars.AIAT_GHCR_REDIS_PROMOTED_DIGEST }}
          AIAT_GHCR_REDIS_PROMOTED_SOURCE_SHA: ${{ vars.AIAT_GHCR_REDIS_PROMOTED_SOURCE_SHA }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          result="$(python mas/scripts/verify_image_promotion.py \
            --manifest mas/release/image-promotion-candidate.json controls --kind "$IMAGE")"
          echo "$result"
          echo "controls=verified" >> "$GITHUB_OUTPUT"

  publish:
    if: inputs.publish_candidate == true && github.ref == 'refs/heads/main'
    needs: [evidence-preflight, control-preflight]
    runs-on: ubuntu-24.04
    environment: aiat-image-candidate-release
    timeout-minutes: 45
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      registry_digest: ${{ steps.push.outputs.digest }}
      package: ${{ steps.push.outputs.package }}
    steps:
      - name: Check out trusted workflow revision, never the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download preflight-verified image payload
        uses: actions/download-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aiat-verified-promotion-input-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-evidence

      - name: Recheck the exact payload before registry access
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          python mas/scripts/verify_image_promotion.py \
            --manifest mas/release/image-promotion-candidate.json evidence \
            --kind "$IMAGE" --root "$RUNNER_TEMP/candidate-evidence"

      - name: Enable OCI archive loading on the ephemeral publisher runner
        run: |
          set -euo pipefail
          sudo python3 - <<'PY'
          import json
          import os
          import stat
          import tempfile
          from pathlib import Path
          path = Path("/etc/docker/daemon.json")
          config = json.loads(path.read_text()) if path.exists() else {}
          features = config.setdefault("features", {})
          features["containerd-snapshotter"] = True
          mode = stat.S_IMODE(path.stat().st_mode) if path.exists() else 0o644
          with tempfile.NamedTemporaryFile(mode="w", encoding="utf-8", dir=path.parent, delete=False) as handle:
              json.dump(config, handle, sort_keys=True, indent=2)
              handle.write("\n")
              temporary = Path(handle.name)
          os.chmod(temporary, mode)
          os.replace(temporary, path)
          PY
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' | grep -q 'io.containerd.snapshotter.v1'

      - name: Load and verify the exact image configuration
        id: image
        env:
          IMAGE: ${{ inputs.image }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "candidate-evidence"
          kind = os.environ["IMAGE"]
          if kind == "redis":
              identity = json.loads((root / "candidate-image-identity.json").read_text())
              archive = root / "candidate-image.tar"
              image_id = identity["docker_image_config_digest"]
              local_tag = identity["local_tag"]
          else:
              identity = json.loads((root / "candidate-image.json").read_text())
              archive = root / "candidate.oci.tar"
              image_id = identity["docker_image_id"]
              local_tag = identity["runtime_reference"]
          with (root / "loaded-image-identity.json").open("w") as output:
              json.dump({"archive": str(archive), "image_id": image_id, "local_tag": local_tag}, output)
          PY
          archive="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive"])' "$RUNNER_TEMP/candidate-evidence/loaded-image-identity.json")"
          local_tag="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["local_tag"])' "$RUNNER_TEMP/candidate-evidence/loaded-image-identity.json")"
          docker load --input "$archive"
          docker image tag "$local_tag" aiat-promotion-preflight:local
          docker image inspect aiat-promotion-preflight:local > "$RUNNER_TEMP/candidate-evidence/loaded-image-inspect.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "candidate-evidence"
          expected = json.loads((root / "loaded-image-identity.json").read_text())
          image = json.loads((root / "loaded-image-inspect.json").read_text())[0]
          if image.get("Id") != expected["image_id"]:
              raise SystemExit("loaded image ID differs from the scanned archive")
          if image.get("Os") != "linux" or image.get("Architecture") != "amd64":
              raise SystemExit("loaded image platform differs from linux/amd64")
          if os.environ["IMAGE"] == "worker":
              labels = image.get("Config", {}).get("Labels", {}) or {}
              if labels.get("org.opencontainers.image.revision") != os.environ["CANDIDATE_SHA"]:
                  raise SystemExit("worker image source label differs from the pinned source SHA")
          PY
          echo "local_tag=aiat-promotion-preflight:local" >> "$GITHUB_OUTPUT"

      - name: Rescan the exact image before publication
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: aiat-promotion-preflight:local
          format: json
          output: ${{ runner.temp }}/candidate-evidence/registry-promotion-trivy.json
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: false

      - name: Log in to private GHCR after all read-only gates pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish only the candidate SHA tag and record the registry digest
        id: push
        env:
          IMAGE: ${{ inputs.image }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          package="$(python -c 'import json,sys; print("ghcr.io/maaroufabousaleh/" + json.load(open(sys.argv[1]))["images"][sys.argv[2]]["package_name"])' \
            mas/release/image-promotion-candidate.json "$IMAGE")"
          candidate_tag="$package:candidate-$CANDIDATE_SHA"
          docker image tag aiat-promotion-preflight:local "$candidate_tag"
          docker push "$candidate_tag" 2>&1 | tee "$RUNNER_TEMP/registry-push.log"
          digest="$(awk '/digest: sha256:[0-9a-f]{64}/ {for(i=1;i<=NF;i++) if($i ~ /^sha256:[0-9a-f]{64}$/) d=$i} END {print d}' "$RUNNER_TEMP/registry-push.log")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "reference=$package@$digest" >> "$GITHUB_OUTPUT"

      - name: Create a registry promotion provenance predicate
        env:
          IMAGE: ${{ inputs.image }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REGISTRY_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "candidate-evidence"
          manifest = json.loads(Path("mas/release/image-promotion-candidate.json").read_text())
          kind = os.environ["IMAGE"]
          spec = manifest["images"][kind]
          sbom = root / "image-sbom.cdx.json"
          predicate = {
              "schema_version": "aiat.registry-image-promotion.v1",
              "promotion": {
                  "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
                  "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                  "candidate_tag": "candidate-" + os.environ["CANDIDATE_SHA"],
                  "registry_digest": os.environ["REGISTRY_DIGEST"],
                  "payload_rebuilt": False,
              },
              "source": {
                  "repository": manifest["repository"],
                  "commit": manifest["source"]["sha"],
                  "evidence_run_id": spec["id"],
                  "evidence_artifact_id": spec["artifact_id"],
                  "evidence_artifact_digest": spec["artifact_digest"],
                  "attested_archive_name": spec["archive_name"],
                  "attested_archive_sha256": spec["archive_sha256"],
                  "platform_manifest_digest": spec.get("platform_manifest_digest"),
                  "image_config_digest": spec["config_digest"],
                  "buildkit_builder_authenticated": spec.get("buildkit_builder_authenticated"),
                  "buildkit_source_base_binding_verified": spec.get("buildkit_source_base_binding_verified"),
              },
              "sbom": {"format": "CycloneDX", "sha256": hashlib.sha256(sbom.read_bytes()).hexdigest()},
              "status": "candidate promotion only; not production approval",
          }
          Path(os.environ["RUNNER_TEMP"], "promotion-predicate.json").write_text(
              json.dumps(predicate, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Attest the registry image with trusted promotion workflow provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.package }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest the verified candidate SBOM to the registry digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.package }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/candidate-evidence/image-sbom.cdx.json
          push-to-registry: true

      - name: Attest the source-to-registry promotion record
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.package }}
          subject-digest: ${{ steps.push.outputs.digest }}
          predicate-type: https://aiat.dev/attestations/registry-image-promotion/v1
          predicate-path: ${{ runner.temp }}/promotion-predicate.json
          push-to-registry: true

      - name: Retain immutable registry candidate reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aiat-registry-promotion-record-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/promotion-predicate.json
            ${{ runner.temp }}/registry-push.log
            ${{ runner.temp }}/candidate-evidence/registry-promotion-trivy.json
          if-no-files-found: error
          retention-days: 90

  verify-registry:
    if: inputs.publish_candidate == true && github.ref == 'refs/heads/main'
    needs: [evidence-preflight, control-preflight, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    steps:
      - name: Check out trusted workflow revision, never the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the verified evidence and publication record
        uses: actions/download-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aiat-verified-promotion-input-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-evidence

      - name: Download registry digest and promotion predicate
        uses: actions/download-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aiat-registry-promotion-record-${{ github.run_id }}
          path: ${{ runner.temp }}/registry-record

      - name: Verify private image payload from a fresh runner by immutable digest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
          REGISTRY_DIGEST: ${{ needs.publish.outputs.registry_digest }}
          PACKAGE: ${{ needs.publish.outputs.package }}
        run: |
          set -euo pipefail
          [[ "$REGISTRY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          python mas/scripts/verify_image_promotion.py \
            --manifest mas/release/image-promotion-candidate.json evidence \
            --kind "$IMAGE" --root "$RUNNER_TEMP/candidate-evidence"
          sudo python3 - <<'PY'
          import json, os, stat, tempfile
          from pathlib import Path
          path = Path("/etc/docker/daemon.json")
          config = json.loads(path.read_text()) if path.exists() else {}
          config.setdefault("features", {})["containerd-snapshotter"] = True
          mode = stat.S_IMODE(path.stat().st_mode) if path.exists() else 0o644
          with tempfile.NamedTemporaryFile(mode="w", encoding="utf-8", dir=path.parent, delete=False) as handle:
              json.dump(config, handle, sort_keys=True, indent=2)
              handle.write("\n")
              temporary = Path(handle.name)
          os.chmod(temporary, mode)
          os.replace(temporary, path)
          PY
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' | grep -q 'io.containerd.snapshotter.v1'
          if [[ "$IMAGE" == redis ]]; then archive="$RUNNER_TEMP/candidate-evidence/candidate-image.tar"; else archive="$RUNNER_TEMP/candidate-evidence/candidate.oci.tar"; fi
          docker load --input "$archive"
          local_tag="$(python -c 'import json,os; from pathlib import Path; r=Path(os.environ["RUNNER_TEMP"])/"candidate-evidence"; d=json.loads((r/("candidate-image-identity.json" if os.environ["IMAGE"]=="redis" else "candidate-image.json")).read_text()); print(d["local_tag"] if os.environ["IMAGE"]=="redis" else d["runtime_reference"])')"
          docker image tag "$local_tag" aiat-source-payload:verified
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$PACKAGE@$REGISTRY_DIGEST"
          docker image inspect aiat-source-payload:verified > "$RUNNER_TEMP/source-inspect.json"
          docker image inspect "$PACKAGE@$REGISTRY_DIGEST" > "$RUNNER_TEMP/registry-inspect.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          source = json.loads((root / "source-inspect.json").read_text())[0]
          remote = json.loads((root / "registry-inspect.json").read_text())[0]
          for field in ("Id", "Os", "Architecture", "Config", "RootFS"):
              if source.get(field) != remote.get(field):
                  raise SystemExit(f"registry payload differs from scanned image archive: {field}")
          if not any(row.endswith("@" + os.environ["REGISTRY_DIGEST"]) for row in remote.get("RepoDigests", [])):
              raise SystemExit("fresh pull does not report the expected immutable registry digest")
          if remote.get("Os") != "linux" or remote.get("Architecture") != "amd64":
              raise SystemExit("registry pull platform differs from the certified linux/amd64 candidate")
          PY

      - name: Verify registry provenance, SBOM, and source linkage attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
          REGISTRY_DIGEST: ${{ needs.publish.outputs.registry_digest }}
          PACKAGE: ${{ needs.publish.outputs.package }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$PACKAGE@$REGISTRY_DIGEST" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/aiat-image-candidate-promotion.yml" \
            --format json > "$RUNNER_TEMP/registry-provenance-verification.json"
          gh attestation verify "oci://$PACKAGE@$REGISTRY_DIGEST" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/aiat-image-candidate-promotion.yml" \
            --predicate-type https://cyclonedx.org/bom --format json \
            > "$RUNNER_TEMP/registry-sbom-verification.json"
          gh attestation verify "oci://$PACKAGE@$REGISTRY_DIGEST" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/aiat-image-candidate-promotion.yml" \
            --predicate-type https://aiat.dev/attestations/registry-image-promotion/v1 \
            --format json > "$RUNNER_TEMP/registry-promotion-verification.json"

      - name: Retain fresh-pull and attestation verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aiat-registry-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source-inspect.json
            ${{ runner.temp }}/registry-inspect.json
            ${{ runner.temp }}/registry-provenance-verification.json
            ${{ runner.temp }}/registry-sbom-verification.json
            ${{ runner.temp }}/registry-promotion-verification.json
          if-no-files-found: error
          retention-days: 90
