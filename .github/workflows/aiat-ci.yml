name: AIAT CI

on:
  pull_request:
  push:
    branches: [main, develop, agent/fix-review-p1]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned uv
        run: python3 -m pip install --disable-pip-version-check uv==0.4.30
      - run: uv sync --locked --dev
      - run: uv run python -m compileall -q packages apps
      - run: uv run python scripts/check_provenance.py
      - run: uv run python scripts/check_docs_index.py --json
      - run: uv run python scripts/check_api_contract.py --json
      - run: uv run python scripts/check_api_observability.py --json
      - run: uv run python scripts/check_trace_evidence.py --json
      - run: uv run python scripts/check_native_trace_spans.py --json
      - run: uv run python scripts/check_slo_capacity.py --json
      - run: uv run python scripts/generate_typescript_api.py --check
      - run: uv run python scripts/generate_python_api.py --check
      - run: uv run python scripts/check_prompt_tool_reconciliation.py --json
      - run: uv run python scripts/check_worker_reconciliation.py --json
      - run: uv run python scripts/check_runtime_install_profile.py --json
      - run: uv run python scripts/check_worker_steward_contract.py --json
      - run: uv run python scripts/generate_worker_certification_matrix.py --check
      - run: uv run python scripts/generate_flow_node_schemas.py --check
      - run: uv run python scripts/check_network_boundary.py --json
      - run: uv run python scripts/check_image_provenance.py
      - run: uv run python scripts/check_image_budgets.py
      - run: uv run python scripts/check_release_ledger.py --json
      - run: uv run pytest scripts/tests/test_verify_image_candidate_evidence.py scripts/tests/test_image_candidate_registry_release_workflow.py scripts/tests/test_native_docker_engine.py
      - run: uv run pytest packages/mas-core/tests packages/mas-api-sdk/tests apps/orchestrator-api/tests apps/tool-service/tests apps/team-runner/tests
      - run: PYTHONPATH=apps/identity-service uv run pytest apps/identity-service/tests/test_identity_service.py
  dashboard-contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mas/apps/mas-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mas/apps/mas-dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:auth
  migration-and-compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pyyaml
      - run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in (Path('mas/infra/compose/docker-compose.yml'),
                       Path('mas/infra/compose/docker-compose.dev.yml'),
                       Path('mas/infra/compose/docker-compose.stalwart-local.yml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print(f'parsed {path}')
          PY
        shell: bash
      - run: python -m pip install --disable-pip-version-check alembic sqlalchemy
      - run: alembic -c alembic.ini heads
        working-directory: mas
  sbom:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: aiat-sbom.cdx.json
          artifact-name: aiat-sbom.cdx.json
