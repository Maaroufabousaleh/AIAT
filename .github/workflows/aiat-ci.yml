name: AIAT CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.4.x"
      - run: uv sync --locked --dev
      - run: uv run python -m compileall -q packages apps
      - run: uv run python scripts/check_provenance.py
      - run: uv run pytest packages/mas-core/tests apps/orchestrator-api/tests apps/tool-service/tests
  migration-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pyyaml
      - run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in (Path('mas/infra/compose/docker-compose.yml'),
                       Path('mas/infra/compose/docker-compose.dev.yml'),
                       Path('mas/infra/compose/docker-compose.stalwart-local.yml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print(f'parsed {path}')
          PY
        shell: bash
      - run: python -m pip install --disable-pip-version-check alembic sqlalchemy
      - run: alembic -c alembic.ini heads
        working-directory: mas
  sbom:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: aiat-sbom.cdx.json
          artifact-name: aiat-sbom.cdx.json
