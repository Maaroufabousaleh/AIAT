[project]
name = "tool-service"
version = "0.1.0"
description = "HTTP tool gateway — role-gated access, 7 tool groups, circuit breakers, rate limits"
requires-python = ">=3.11"

dependencies = [
    "mas-core",
    "mas-tools-sdk",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis[hiredis]>=5.0",
    "aiolimiter>=1.1",          # token-bucket rate limiting per tool group
    "httpx[http2]>=0.27",       # web_search, external API calls
    "playwright>=1.42",         # browser automation
    "pydantic-settings>=2.3",
    "structlog>=24.2",
    "prometheus-fastapi-instrumentator>=7.0",
    "mcp==1.23.3",
    "cryptography>=42",
    "asyncpg>=0.29",
]

[project.scripts]
aiat-sandbox-runner = "tool_service.sandbox_runner:main"
aiat-code-review = "tool_service.code_review_runner:main"
aiat-devops-adapter = "tool_service.devops_adapter:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tool_service"]

[tool.uv.sources]
mas-core = { workspace = true }
mas-tools-sdk = { workspace = true }
