[project]
name = "orchestrator-api"
version = "0.1.0"
description = "FastAPI orchestrator + deterministic workflow controller"
requires-python = ">=3.11"

dependencies = [
    "mas-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "redis[hiredis]>=5.0",
    "httpx[http2]>=0.27",
    "pydantic-settings>=2.3",
    "structlog>=24.2",
    "apscheduler>=3.10",  # scheduled auto-shutdown / auto-resume cron
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator_api"]

[tool.uv.sources]
mas-core = { workspace = true }
