[project]
name = "orchestrator-api"
version = "0.1.0"
description = "FastAPI orchestrator + deterministic workflow controller"
requires-python = ">=3.11"

dependencies = [
    "mas-core",
    "anyio>=4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "redis[hiredis]>=5.0",
    "httpx[http2]>=0.27",
    "pydantic-settings>=2.3",
    "structlog>=24.2",
    "cryptography>=42",
    "apscheduler>=3.10",  # scheduled auto-shutdown / auto-resume cron
]

[project.optional-dependencies]
# The default image ships only the approved departmental runtimes. Specialist
# runtimes stay separate opt-in adapters so the control plane does not silently
# install or activate them.
runtime-default = [
    "langgraph>=0.2,<1.0",
    "crewai>=0.80,<2.0",
]
runtime-autogen = [
    "autogen-agentchat>=0.4,<1.0",
    "autogen-core>=0.4,<1.0",
]
runtime-letta = ["letta>=0.6,<2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator_api"]

[tool.uv.sources]
mas-core = { workspace = true }
