[project]
name = "message-router"
version = "0.1.0"
description = "HTTP + WebSocket message router — policy enforcement, Redis Streams backend"
requires-python = ">=3.11"

dependencies = [
    "mas-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis[hiredis]>=5.0",
    "websockets>=13.0",
    "structlog>=24.2",
    "pydantic-settings>=2.3",
    "prometheus-fastapi-instrumentator>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["message_router"]

[tool.uv.sources]
mas-core = { workspace = true }
