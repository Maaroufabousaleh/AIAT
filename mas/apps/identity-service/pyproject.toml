[project]
name = "identity-service"
version = "0.1.0"
description = "AIAT signed mail identity and external-account control plane"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx[http2]>=0.27",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg2-binary>=2.9.11",
    "cryptography>=42",
    "structlog>=24.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "trio>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["identity_service"]
