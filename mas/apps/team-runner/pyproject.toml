[project]
name = "team-runner"
version = "0.1.0"
description = "Docker entrypoint per team — loads YAML config, starts agents"
requires-python = ">=3.11"

dependencies = [
    "mas-core",
    "mas-tools-sdk",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.2",
    "uvicorn[standard]>=0.30",  # small health-check HTTP server
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["team_runner"]

[tool.uv.sources]
mas-core = { workspace = true }
mas-tools-sdk = { workspace = true }
