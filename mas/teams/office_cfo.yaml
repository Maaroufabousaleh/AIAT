# ── office_cfo — CFO office ───────────────────────────────────────────────────
# MAS role: c_suite
# Financial feasibility, budget review, cost/benefit analysis, ROI.
# Hiring board role: budget and cost reviewer.

team_id: office_cfo

admin:
  agent_id: cfo
  worker_manifest_ref: cfo
  role: c_suite
  class: CSuiteAgent
  display_name: "Chief Financial Officer"
  system_prompt_file: prompts/cfo.md
  budget_defaults:
    max_llm_calls: 30
    max_tool_calls: 15
    max_cost_usd: 1.00
  tools:
    - document.get_latest
    - document.list
    - review.submit
    - kpi.compute
    - kpi.query_history
    - web_search
    - web_fetch

workers:
  - agent_id: financial_analyst
    worker_manifest_ref: financial_analyst
    role: worker
    class: WorkerAgent
    display_name: "Financial Analyst"
    min_instances: 0
    max_instances: 1
    budget_defaults:
      max_llm_calls: 20
      max_tool_calls: 10
      max_cost_usd: 0.50
    tools:
      - kpi.compute
      - kpi.query_history
      - web_search
      - blob.upload

  - agent_id: budget_evaluator
    worker_manifest_ref: budget_evaluator
    role: worker
    class: WorkerAgent
    display_name: "Budget Evaluator"
    min_instances: 0
    max_instances: 1
    budget_defaults:
      max_llm_calls: 20
      max_tool_calls: 10
      max_cost_usd: 0.50
    tools:
      - kpi.compute
      - kpi.query_history
      - web_search
      - blob.upload
