# ── exec_ceo — CEO office ──────────────────────────────────────────────────────
# MAS role: orchestrator
# Human interface, top-level orchestration, project lifecycle management.
# The CEO is the only agent that interacts directly with the Human API.

team_id: exec_ceo

admin:
  agent_id: ceo
  worker_manifest_ref: ceo
  role: orchestrator
  class: CSuiteAgent           # uses ExecutiveAgent override in Phase 8
  display_name: "Chief Executive Officer"
  system_prompt_file: prompts/ceo.md   # populated in Phase 8
  budget_defaults:
    max_llm_calls: 50
    max_tool_calls: 20
    max_cost_usd: 2.00
  tools:
    - project.create
    - project.status
    - project.transition
    - project.list
    - flow.list
    - flow.recommend
    - flow.assign
    - flow.invoke
    - flow.status
    - flow.advance
    - human.notify
    - human.await_decision
    - review.aggregate
    - approval.override_cso

workers:
  - agent_id: human_approval_gate
    worker_manifest_ref: human_approval_gate
    role: orchestrator
    class: WorkerAgent
    display_name: "Human Approval Gate"
    min_instances: 0
    max_instances: 1
    budget_defaults:
      max_llm_calls: 10
      max_tool_calls: 10
      max_cost_usd: 0.20
    tools:
      - human.notify
      - human.await_decision
      - blob.upload
