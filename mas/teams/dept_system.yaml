# ── dept_system — System Department ──────────────────────────────────────────
# MAS role: admin (PM) + worker
# Purpose: Create the Critical Design Review (CDR) document.
#
# Internal workflow:
#   1. PM receives PDR + review comments from COO, decomposes into subtasks.
#   2. system_architect  → overall architecture, component diagram.
#   3. solution_designer → detailed per-component design, API specs, DB schemas.
#   4. tech_writer       → full CDR assembly with diagrams; all review comments addressed.
#   5. PM reviews → CDR → MinIO → DOCUMENT_SUBMIT event to controller.

team_id: dept_system

admin:
  agent_id: system_pm
  role: admin
  class: AdminAgent
  display_name: "System PM"
  system_prompt_file: prompts/system_pm.md
  budget_defaults:
    max_llm_calls: 20
    max_tool_calls: 15
    max_cost_usd: 0.75
  tools:
    - document.create_draft
    - document.get_latest
    - blob.upload
    - blob.download
    - project.status

workers:
  - agent_id: system_architect
    role: worker
    class: WorkerAgent
    display_name: "System Architect"
    min_instances: 1
    max_instances: 1
    budget_defaults:
      max_llm_calls: 40
      max_tool_calls: 12
      max_cost_usd: 1.50
    tools:
      - capability.search
      - web_search
      - blob.upload

  - agent_id: solution_designer
    role: worker
    class: WorkerAgent
    display_name: "Solution Designer"           
    min_instances: 1
    max_instances: 1
    budget_defaults:
      max_llm_calls: 35
      max_tool_calls: 10
      max_cost_usd: 1.25
    tools:
      - capability.search
      - web_search
      - blob.upload

  - agent_id: tech_writer
    role: worker
    class: WorkerAgent
    display_name: "Tech Writer"
    min_instances: 1
    max_instances: 1
    budget_defaults:
      max_llm_calls: 25
      max_tool_calls: 8
      max_cost_usd: 0.75
    tools:
      - file_read
      - blob.upload
      - blob.download
