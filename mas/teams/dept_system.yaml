# ── dept_system — System department ───────────────────────────────────────────
# MAS role: admin
# Architecture, solution design, and technical documentation.

team_id: dept_system

admin:
  agent_id: system_pm
  worker_manifest_ref: system_pm
  role: admin
  class: AdminAgent
  display_name: "System PM"
  system_prompt_file: prompts/system_pm.md
  budget_defaults:
    max_llm_calls: 60
    max_tool_calls: 40
    max_cost_usd: 1.50
  tools:
    - document.create_draft
    - document.submit
    - document.revise
    - document.get_latest
    - document.list
    - capability.search
    - capability.list_workers
    - blob.upload
    - blob.download

workers:
  - agent_id: system_architect
    worker_manifest_ref: system_architect
    role: worker
    class: WorkerAgent
    display_name: "System Architect"
    min_instances: 0
    max_instances: 1
    budget_defaults:
      max_llm_calls: 30
      max_tool_calls: 15
      max_cost_usd: 0.75
    tools:
      - document.get_latest
      - document.list
      - web_search
      - web_fetch
      - blob.upload

  - agent_id: solution_designer
    worker_manifest_ref: solution_designer
    role: worker
    class: WorkerAgent
    display_name: "Solution Designer"
    min_instances: 0
    max_instances: 1
    budget_defaults:
      max_llm_calls: 30
      max_tool_calls: 15
      max_cost_usd: 0.75
    tools:
      - document.get_latest
      - capability.search
      - web_search
      - blob.upload

  - agent_id: tech_writer
    worker_manifest_ref: tech_writer
    role: worker
    class: WorkerAgent
    display_name: "Technical Writer"
    min_instances: 0
    max_instances: 1
    budget_defaults:
      max_llm_calls: 25
      max_tool_calls: 15
      max_cost_usd: 0.60
    tools:
      - document.get_latest
      - document.list
      - web_search
      - blob.upload
