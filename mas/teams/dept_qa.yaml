# ── dept_qa — Quality assurance department ────────────────────────────────────
# MAS role: admin
# Coding/test evaluation, browser/API checks, and PR review.

team_id: dept_qa

admin:
  agent_id: qa_lead
  worker_manifest_ref: qa_lead
  role: admin
  class: AdminAgent
  display_name: "QA Lead"
  system_prompt_file: prompts/qa_lead.md
  budget_defaults:
    max_llm_calls: 60
    max_tool_calls: 50
    max_cost_usd: 1.50
  tools:
    - document.get_latest
    - document.list
    - issue.update_status
    - capability.search
    - capability.list_workers
    - file_read
    - file_write
    - blob.upload
    - blob.download

workers:
  - agent_id: tester
    worker_manifest_ref: tester
    role: worker
    class: WorkerAgent
    display_name: "Tester"
    min_instances: 0
    max_instances: 2
    budget_defaults:
      max_llm_calls: 25
      max_tool_calls: 20
      max_cost_usd: 0.60
    tools:
      - file_read
      - file_write
      - web_search
      - browser_navigate
      - browser_screenshot
      - blob.upload

  - agent_id: coding_worker
    worker_manifest_ref: coding_worker
    role: worker
    class: WorkerAgent
    display_name: "Coding Worker"
    min_instances: 0
    max_instances: 2
    budget_defaults:
      max_llm_calls: 30
      max_tool_calls: 25
      max_cost_usd: 0.75
    tools:
      - file_read
      - file_write
      - web_search
      - blob.upload

  - agent_id: test_evaluation_worker
    worker_manifest_ref: test_evaluation_worker
    role: worker
    class: WorkerAgent
    display_name: "Test Evaluation Worker"
    min_instances: 0
    max_instances: 1
    budget_defaults:
      max_llm_calls: 25
      max_tool_calls: 20
      max_cost_usd: 0.60
    tools:
      - file_read
      - web_search
      - browser_navigate
      - browser_screenshot
      - blob.upload

  - agent_id: code_review_worker
    worker_manifest_ref: code_review_worker
    role: worker
    class: WorkerAgent
    display_name: "Code Review Worker"
    min_instances: 0
    max_instances: 1
    budget_defaults:
      max_llm_calls: 25
      max_tool_calls: 15
      max_cost_usd: 0.60
    tools:
      - file_read
      - web_search
      - blob.upload
