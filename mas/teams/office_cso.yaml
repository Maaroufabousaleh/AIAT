# ── office_cso — CSO office ───────────────────────────────────────────────────
# MAS role: c_suite
# Security review, threat analysis, compliance, VETO authority.
# Hiring board role: provenance and safety reviewer.
#
# CSO VETO PROTOCOL
# -----------------
# If the CSO submits a REVIEW_RESPONSE with severity=BLOCKER and veto=true,
# the controller transitions the project to SECURITY_BLOCKED.  The project
# cannot advance until either:
#   a) The CSO approves a revised document, OR
#   b) The CEO issues CEO_OVERRIDE_CSO (justification audited in Postgres).

team_id: office_cso

admin:
  agent_id: cso
  worker_manifest_ref: cso
  role: c_suite
  class: CSuiteAgent
  display_name: "Chief Security Officer"
  system_prompt_file: prompts/cso.md
  budget_defaults:
    max_llm_calls: 30
    max_tool_calls: 15
    max_cost_usd: 1.00
  tools:
    - review.submit
    - review.submit_veto

workers:
  - agent_id: security_analyst
    worker_manifest_ref: security_analyst
    role: worker
    class: WorkerAgent
    display_name: "Security Analyst"
    min_instances: 0
    max_instances: 2
    budget_defaults:
      max_llm_calls: 20
      max_tool_calls: 10
      max_cost_usd: 0.50
    tools:
      - file_read
      - web_search
      - blob.upload

  - agent_id: security_evaluator
    worker_manifest_ref: security_evaluator
    role: worker
    class: WorkerAgent
    display_name: "Security Evaluator"
    min_instances: 0
    max_instances: 1
    budget_defaults:
      max_llm_calls: 20
      max_tool_calls: 12
      max_cost_usd: 0.50
    tools:
      - file_read
      - web_search
      - blob.upload

  - agent_id: sandbox_evaluator
    worker_manifest_ref: sandbox_evaluator
    role: worker
    class: WorkerAgent
    display_name: "Sandbox Evaluator"
    min_instances: 0
    max_instances: 1
    budget_defaults:
      max_llm_calls: 20
      max_tool_calls: 12
      max_cost_usd: 0.50
    tools:
      - file_read
      - web_search
      - blob.upload

  - agent_id: license_provenance_evaluator
    worker_manifest_ref: license_provenance_evaluator
    role: worker
    class: WorkerAgent
    display_name: "License Provenance Evaluator"
    min_instances: 0
    max_instances: 1
    budget_defaults:
      max_llm_calls: 20
      max_tool_calls: 12
      max_cost_usd: 0.50
    tools:
      - file_read
      - web_search
      - blob.upload

  - agent_id: policy_grant_reviewer
    worker_manifest_ref: policy_grant_reviewer
    role: worker
    class: WorkerAgent
    display_name: "Policy Grant Reviewer"
    min_instances: 0
    max_instances: 1
    budget_defaults:
      max_llm_calls: 20
      max_tool_calls: 12
      max_cost_usd: 0.40
    tools:
      - capability.search
      - capability.list_workers
      - blob.upload
