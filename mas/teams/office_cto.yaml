# ── office_cto — CTO office ───────────────────────────────────────────────────
# MAS role: c_suite
# Technical execution governance and worker evaluation.
# Hiring board role: test and sandbox evaluation reviewer.

team_id: office_cto

admin:
  agent_id: cto
  role: c_suite
  class: CSuiteAgent
  display_name: "Chief Technology Officer"
  system_prompt_file: prompts/cto.md
  budget_defaults:
    max_llm_calls: 40
    max_tool_calls: 60    # high — many DB operations (KPIs, sprints, issues)
    max_cost_usd: 1.50
  tools:
    - sprint.create
    - issue.create
    - issue.decompose
    - kpi.compute
    - kpi.query_history
    - kpi.update_agent_profile
    - velocity.report
    - estimation.adjust

workers:
  - agent_id: tester_1
    role: worker
    class: WorkerAgent
    display_name: "Tester"
    min_instances: 0
    max_instances: 1
    budget_defaults:
      max_llm_calls: 20
      max_tool_calls: 10
      max_cost_usd: 0.50
    tools:
      - file_read
      - capability.search
      - web_search
      - blob.upload
