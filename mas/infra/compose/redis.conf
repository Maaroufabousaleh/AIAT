# ── infra/compose/redis.conf ──────────────────────────────────────────────────
# AOF persistence: at most 1 s data loss on hard crash; zero on graceful stop.

appendonly yes
appendfsync everysec

# RDB snapshots as additional backup
save 900 1
save 300 10
save 60 10000

# Never evict stream data — fail writes instead of silently dropping messages.
maxmemory-policy noeviction

# Increase stream consumer group idle-timeout tolerance
# (XAUTOCLAIM reclaim threshold is configured in the router, not here)

# ── Redis ACL (Phase 3) ─────────────────────────────────────────────────────
# ACL users are configured via redis-acl-init.sh startup script.
# See docker-compose.yml for ROUTER_PASSWORD and TOOLCACHE_PASSWORD env vars.
#
# Users configured:
#   - router_user: message-router access (stream:*, dedupe:*, heartbeat:*)
#   - toolcache_user: tool-service caching (tool_cache:*)
#   - default: disabled via `ACL SETUSER default off` (no access without explicit credentials)
