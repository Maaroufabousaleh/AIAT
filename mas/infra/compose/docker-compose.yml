# ── docker-compose.yml ────────────────────────────────────────────────────────
# Core platform/infra services plus 11 governed department team-runners.
# All infra is $0 self-hosted OSS; only LLM API costs apply.
#
# Usage:
#   ./mas.sh up
#   ./mas.sh logs -f orchestrator-api
#   ./mas.sh down -v   # removes volumes (destructive!)
#
# Environment:
#   All env vars are sourced from the project root .env (c:\projects\AIAT\.env).
#   Platform service env_file paths resolve from this Compose file; team
#   runners receive only the explicitly allowlisted gateway/runtime variables
#   below so provider keys never enter agent containers.
#   Required: POSTGRES_PASSWORD, MINIO_ROOT_PASSWORD,
#             ROUTER_PASSWORD, TOOLCACHE_PASSWORD,
#             ROUTER_SECRET or AGENT_TOKEN_SECRET, TOOL_SECRET,
#             LLM_GATEWAY_URL, LLM_API_KEY, LITELLM_MASTER_KEY

name: mas

# ── Shared env vars (merged into each team's environment: block) ──────────────
x-team-env: &team-env
  ROUTER_URL: "http://message-router:8001"
  ROUTER_SECRET: "${ROUTER_SECRET}"
  TOOL_SERVICE_URL: "http://tool-service:8002"
  TOOL_SECRET: "${TOOL_SECRET}"
  PGBOUNCER_DSN: "postgresql+asyncpg://mas_user:${POSTGRES_PASSWORD}@pgbouncer:5432/mas"
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_ACCESS_KEY: "mas_agent"
  MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
  ORCHESTRATOR_URL: "http://orchestrator-api:8000"
  MAS_API_KEY: "${MAS_API_KEY}"
  LOG_LEVEL: "INFO"
  # ── LLM gateway defaults ──────────────────────────────────────────────────
  LLM_BACKEND: "${LLM_BACKEND:-litellm}"
  LLM_GATEWAY_URL: "${LLM_GATEWAY_URL}"
  LLM_DEFAULT_MODEL: "${LLM_DEFAULT_MODEL}"
  LLM_API_KEY: "${LLM_API_KEY:-}"

# ── Shared team defaults ───────────────────────────────────────────────────
x-team-defaults: &team-defaults
  image: "${AIAT_TEAM_RUNNER_IMAGE_REF:?AIAT_TEAM_RUNNER_IMAGE_REF must be an immutable OCI image reference}"
  build:
    context: ${MAS_BUILD_CONTEXT:-../..}
    dockerfile: infra/docker/Dockerfile.team-runner
  restart: unless-stopped
  networks:
    - workers
  mem_limit: 512m
  cpus: "0.5"
  depends_on:
    message-router:
      condition: service_healthy
    tool-service:
      condition: service_healthy
    orchestrator-api:
      condition: service_healthy
  volumes:
    - ../../teams:/app/teams:ro
    - ../../prompts:/app/prompts:ro
    - ../../workers:/app/workers:ro

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true
  workers:
    driver: bridge
    internal: true

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  redis_data:
  postgres_data:
  minio_data:
  worker_mirrors:
  omniroute_data:
  omniroute_logs:
  opencode_workspace:
  browser_profiles:

# ── Services ─────────────────────────────────────────────────────────────────

services:

  # ── OpenCode workspace and browser-profile ownership ──────────────────────
  # Docker creates named volumes as root. The tool/OpenCode runtimes
  # deliberately run as UID 10001, so prepare both persistent volumes first.
  opencode-workspace-init:
    image: alpine:3.21.3@sha256:a8560b36e8b8210634f77d9f7f9efd7ffa463e380b75e2e74aff4511df3ef88c
    restart: "no"
    user: "0:0"
    network_mode: "none"
    volumes:
      - opencode_workspace:/workspace
      - browser_profiles:/browser-profiles
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /workspace /browser-profiles
        chown -R 10001:10001 /workspace /browser-profiles

  # ── 0. Redis ACL Init (one-time setup) ──────────────────────────────────────
  # Runs once to configure ACL users. Can be removed after first run.
  redis-acl-init:
    image: "${AIAT_REDIS_ACL_INIT_IMAGE_REF:?AIAT_REDIS_ACL_INIT_IMAGE_REF must be an immutable OCI image reference}"
    build:
      context: .
      dockerfile: Dockerfile.redis-acl-init
    restart: "no"
    networks:
      - internal
    env_file:
      - path: ../../../.env
        format: raw
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_started

  # ── 1. Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6
    restart: unless-stopped
    command: >-
      sh -c 'if [ ! -f /data/users.acl ]; then
      printf "%s\n" "user default on >redis_init_temp_pass ~* +@all" > /data/users.acl;
      fi; exec redis-server /etc/redis/redis.conf'
    env_file:
      - path: ../../../.env
        format: raw
    volumes:
      - redis_data:/data
      - ./redis.conf:/etc/redis/redis.conf:ro
    networks:
      - internal
    # Redis ports are NOT published to the host in production.
    # Use docker-compose.dev.yml to expose them for local debugging.
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -u \"redis://router_user:$${ROUTER_PASSWORD}@redis:6379\" ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  # ── 2. Postgres ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    restart: unless-stopped
    env_file:
      - path: ../../../.env
        format: raw
    environment:
      POSTGRES_DB: mas
      POSTGRES_USER: mas_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mas_user -d mas"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  # ── 3. PgBouncer ────────────────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
    restart: unless-stopped
    env_file:
      - path: ../../../.env
        format: raw
    environment:
      DATABASE_URL: "postgres://mas_user:${POSTGRES_PASSWORD}@postgres:5432/mas"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      AUTH_TYPE: scram-sha-256
      SERVER_RESET_QUERY: "DISCARD ALL"
      LISTEN_PORT: "5432"
    networks:
      - internal
      - workers
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    cpus: "0.25"

  # ── 4. MinIO ────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    env_file:
      - path: ../../../.env
        format: raw
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_root
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio_data:/data
    networks:
      - internal
      - workers
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # MinIO init: create bucket + access key for agents
  minio-init:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    env_file:
      - path: ../../../.env
        format: raw
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal
    environment:
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minio_root $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/mas-agents &&
        mc admin user add local mas_agent $$MINIO_ROOT_PASSWORD &&
        mc admin policy attach local readwrite --user mas_agent &&
        echo 'MinIO init complete'
      "

  # ── 5. Message Router ───────────────────────────────────────────────────────
  message-router:
    image: "${AIAT_MESSAGE_ROUTER_IMAGE_REF:?AIAT_MESSAGE_ROUTER_IMAGE_REF must be an immutable OCI image reference}"
    build:
      context: ${MAS_BUILD_CONTEXT:-../..}
      dockerfile: infra/docker/Dockerfile.message-router
    restart: unless-stopped
    env_file:
      - path: ../../../.env
        format: raw
    networks:
      - internal
      - workers
    depends_on:
      redis-acl-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: "redis://router_user:${ROUTER_PASSWORD}@redis:6379/0"
      REDIS_USERNAME: "router_user"
      REDIS_PASSWORD: "${ROUTER_PASSWORD}"
      POSTGRES_DSN: "postgresql://mas_user:${POSTGRES_PASSWORD}@pgbouncer:5432/mas"
      ROUTER_SECRET: "${ROUTER_SECRET}"
      LOG_LEVEL: "INFO"
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── 6. Tool Service ─────────────────────────────────────────────────────────
  tool-service:
    image: "${AIAT_TOOL_SERVICE_IMAGE_REF:?AIAT_TOOL_SERVICE_IMAGE_REF must be an immutable OCI image reference}"
    build:
      context: ${MAS_BUILD_CONTEXT:-../..}
      dockerfile: infra/docker/Dockerfile.tool-service
    restart: unless-stopped
    user: "10001:10001"
    env_file:
      - path: ../../../.env
        format: raw
    networks:
      - internal
      - workers
      - public
    # No host port in production — only team-runners (on workers) need it.
    # Use docker-compose.dev.yml to expose for local debugging.
    depends_on:
      opencode-workspace-init:
        condition: service_completed_successfully
      redis-acl-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    environment:
      # Redis ACL: connect as toolcache_user (DB 1 for tool cache)
      REDIS_URL: "redis://toolcache_user:${TOOLCACHE_PASSWORD}@redis:6379/1"
      REDIS_USERNAME: "toolcache_user"
      REDIS_PASSWORD: "${TOOLCACHE_PASSWORD}"
      TOOL_SECRET: "${TOOL_SECRET}"
      ORCHESTRATOR_URL: "http://orchestrator-api:8000"
      MAS_API_KEY: "${MAS_API_KEY}"
      AIAT_OPERATOR_API_KEY: "${AIAT_OPERATOR_API_KEY:?AIAT_OPERATOR_API_KEY must be configured for governed tool mutations}"
      PGBOUNCER_DSN: "postgresql+asyncpg://mas_user:${POSTGRES_PASSWORD}@pgbouncer:5432/mas"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "mas_agent"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      MINIO_BUCKET: "mas-agents"
      LLM_BACKEND: "${LLM_BACKEND:-litellm}"
      LLM_GATEWAY_URL: "${LLM_GATEWAY_URL}"
      LLM_API_KEY: "${LLM_API_KEY}"
      TOOL_CODE_REVIEW_COMMAND: "${TOOL_CODE_REVIEW_COMMAND:-aiat-code-review --json-stdin}"
      TOOL_INFRA_PROVISION_COMMAND: "${TOOL_INFRA_PROVISION_COMMAND:-aiat-devops-adapter infra --json-stdin}"
      TOOL_MONITORING_SETUP_COMMAND: "${TOOL_MONITORING_SETUP_COMMAND:-aiat-devops-adapter monitoring --json-stdin}"
      TOOL_SANDBOX_COMMAND: "${TOOL_SANDBOX_COMMAND:-aiat-sandbox-runner --json-stdin}"
      AIAT_SANDBOX_IMAGE: "${AIAT_SANDBOX_IMAGE:-mas/tool-service:latest}"
      TOOL_WORKSPACE_ROOT: "/workspace"
      AIAT_MCP_SERVERS_JSON: '${AIAT_MCP_SERVERS_JSON:-{"workspace":{"transport":"stdio","command":"python","args":["-m","tool_service.mcp_workspace_server"]}}}'
      PYTHONPATH: "/app"
      OPENCODE_WORKSPACE_ROOT: "/opencode-workspace"
      AIAT_BROWSER_RUNTIME_LOCATION: "operator_laptop"
      AIAT_BROWSER_PROFILE_ROOT: "/var/lib/aiat/browser-profiles"
      LOG_LEVEL: "INFO"
    volumes:
      - ${AIAT_WORKSPACE_ROOT:-../../..}:/workspace
      - opencode_workspace:/opencode-workspace
      - browser_profiles:/var/lib/aiat/browser-profiles
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import httpx; httpx.get('http://localhost:8002/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── 7a. OmniRoute ─────────────────────────────────────────────────────────
  # Internal OpenAI-compatible route optimizer used as an explicit LiteLLM
  # fallback/free-tier route.
  omniroute-data-init:
    image: alpine:3.21.3@sha256:a8560b36e8b8210634f77d9f7f9efd7ffa463e380b75e2e74aff4511df3ef88c
    restart: "no"
    user: "0:0"
    network_mode: "none"
    volumes:
      - omniroute_data:/data
      - omniroute_logs:/logs
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /data
        mkdir -p /logs
        chown -R 10001:10001 /data
        chown -R 10001:10001 /logs
        chmod -R u+rwX /data
        chmod -R u+rwX /logs

  omniroute:
    image: "${OMNIROUTE_IMAGE_REF:?OMNIROUTE_IMAGE_REF must be an immutable OCI image reference}"
    restart: unless-stopped
    user: "10001:10001"
    networks:
      - internal
      - public
    environment:
      PORT: "20128"
      OMNIROUTE_API_KEY: "${OMNIROUTE_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      CEREBRAS_API_KEY: "${CEREBRAS_API_KEY:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      PRICING_SYNC_ENABLED: "${PRICING_SYNC_ENABLED:-true}"
      REQUEST_TIMEOUT_MS: "${OMNIROUTE_REQUEST_TIMEOUT_MS:-120000}"
      NINEROUTER_PORT: "20130"
      NINEROUTER_DISABLE_MITM: "true"
      CLIPROXYAPI_PORT: "8317"
      LOCAL_HOSTNAMES: "omniroute,litellm,host.docker.internal"
      # Trust only the explicitly supplied host CA bundle in addition to the
      # image's public roots.  This supports enterprise/AV TLS interception
      # without disabling certificate verification.
      NODE_EXTRA_CA_CERTS: "/usr/local/share/ca-certificates/aiat-extra-ca.pem"
    volumes:
      - omniroute_data:/app/data
      - omniroute_logs:/app/logs
      - type: bind
        source: "${AIAT_EXTRA_CA_CERT:-./aiat-extra-ca.pem}"
        target: /usr/local/share/ca-certificates/aiat-extra-ca.pem
        read_only: true
      - ./cliproxyapi-compat-wrapper.sh:/opt/aiat/cliproxyapi-compat-wrapper.sh:ro
      - ./repair-cliproxyapi.sh:/opt/aiat/repair-cliproxyapi.sh:ro
    depends_on:
      omniroute-data-init:
        condition: service_completed_successfully
    mem_limit: 512m
    cpus: "0.5"

  # ── 7b. LiteLLM Gateway ───────────────────────────────────────────────────
  # Primary internal OpenAI-compatible LLM gateway. AIAT keeps its public /v1
  # adapter stable and points outbound model calls here when LLM_BACKEND=litellm.
  litellm:
    image: "${LITELLM_IMAGE_REF:?LITELLM_IMAGE_REF must be an immutable OCI image reference}"
    restart: unless-stopped
    networks:
      - internal
      - workers
      - public
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy
      omniroute:
        condition: service_started
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
      LITELLM_SALT_KEY: "${LITELLM_SALT_KEY:-}"
      DATABASE_URL: "postgresql://mas_user:${POSTGRES_PASSWORD}@postgres:5432/litellm"
      OMNIROUTE_API_KEY: "${OMNIROUTE_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      CEREBRAS_API_KEY: "${CEREBRAS_API_KEY:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    mem_limit: 768m
    cpus: "0.75"

  # ── 7. Orchestrator API ─────────────────────────────────────────────────────
  opencode-runtime:
    image: "${AIAT_OPENCODE_RUNTIME_IMAGE_REF:?AIAT_OPENCODE_RUNTIME_IMAGE_REF must be an immutable OCI image reference}"
    build:
      context: ${MAS_BUILD_CONTEXT:-../..}
      dockerfile: infra/docker/Dockerfile.opencode
      args:
        OPENCODE_VERSION: "1.17.13"
        OPENCODE_TARBALL_SHA512: "qUb9m6X6f9/imuDxc2tUcN+E1vx1XWjmQWJo2Pk/t+cNxqt5KGkaMF89CvJK6QQP7gx1E82gKpV7n1QiI5spxQ=="
    restart: unless-stopped
    user: "10001:10001"
    networks:
      - internal
      - workers
    env_file:
      - path: ../../../.env
        format: raw
    depends_on:
      opencode-workspace-init:
        condition: service_completed_successfully
    environment:
      OPENCODE_SERVER_USERNAME: "${OPENCODE_SERVER_USERNAME:-aiat-opencode-runtime}"
      OPENCODE_SERVER_PASSWORD: "${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD must be configured}"
      AIAT_GATEWAY_URL: "${LLM_GATEWAY_URL:?LLM_GATEWAY_URL must be configured}"
      AIAT_GATEWAY_API_KEY: "${LLM_API_KEY:?LLM_API_KEY must be configured}"
    volumes:
      - opencode_workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=10001,gid=10001
      - /runtime:rw,noexec,nosuid,size=16m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: "1.0"
    expose:
      - "4096"
    healthcheck:
      test: ["CMD", "node", "-e", "const p=process.env.OPENCODE_SERVER_PASSWORD; fetch('http://127.0.0.1:4096/global/health',{headers:{authorization:'Basic '+Buffer.from((process.env.OPENCODE_SERVER_USERNAME||'opencode')+':'+p).toString('base64')}}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  orchestrator-api:
    image: "${AIAT_ORCHESTRATOR_IMAGE_REF:?AIAT_ORCHESTRATOR_IMAGE_REF must be an immutable OCI image reference}"
    build:
      context: ${MAS_BUILD_CONTEXT:-../..}
      dockerfile: infra/docker/Dockerfile.orchestrator-api
    restart: unless-stopped
    env_file:
      - path: ../../../.env
        format: raw
    networks:
      - internal
      - workers
      - public
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      opencode-runtime:
        condition: service_healthy
      message-router:
        condition: service_started
    environment:
      # Credential resolution must fail closed in the deployed stack.  Local
      # unit tests that omit MAS_ENVIRONMENT still retain the manager's
      # development-only fallback outside Compose.
      MAS_ENVIRONMENT: "${MAS_ENVIRONMENT:-production}"
      REDIS_URL: "redis://router_user:${ROUTER_PASSWORD}@redis:6379/0"
      PGBOUNCER_DSN: "postgresql+asyncpg://mas_user:${POSTGRES_PASSWORD}@pgbouncer:5432/mas"
      ROUTER_URL: "http://message-router:8001"
      ROUTER_SECRET: "${ROUTER_SECRET}"
      LOG_LEVEL: "INFO"
      MAS_API_KEY: "${MAS_API_KEY}"
      AIAT_OPERATOR_API_KEY: "${AIAT_OPERATOR_API_KEY:?AIAT_OPERATOR_API_KEY must be configured}"
      LLM_BACKEND: "${LLM_BACKEND:-litellm}"
      LLM_GATEWAY_URL: "${LLM_GATEWAY_URL}"
      LLM_DEFAULT_MODEL: "${LLM_DEFAULT_MODEL}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-}"
      OMNIROUTE_API_KEY: "${OMNIROUTE_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      CEREBRAS_API_KEY: "${CEREBRAS_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENCODE_API_KEY: "${OPENCODE_API_KEY:-public}"
      OPENCODE_SERVER_USERNAME: "${OPENCODE_SERVER_USERNAME:-aiat-opencode-runtime}"
      OPENCODE_SERVER_PASSWORD: "${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD must be configured}"
      WORKER_MIRROR_DIR: "/data/worker-mirrors"
    volumes:
      - worker_mirrors:/data/worker-mirrors
      - opencode_workspace:/workspace
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── 8. Dashboard ────────────────────────────────────────────────────────────
  pm-gateway:
    image: "${AIAT_PM_GATEWAY_IMAGE_REF:?AIAT_PM_GATEWAY_IMAGE_REF must be an immutable OCI image reference}"
    build:
      context: ${MAS_BUILD_CONTEXT:-../..}
      dockerfile: infra/docker/Dockerfile.pm-gateway
    restart: unless-stopped
    env_file:
      - path: ../../../.env
        format: raw
    networks:
      - internal
      - public
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      orchestrator-api:
        condition: service_healthy
    environment:
      ORCHESTRATOR_URL: "http://orchestrator-api:8000"
      PM_GATEWAY_PORT: "8010"
      PM_GATEWAY_ENVIRONMENT: "${PM_GATEWAY_ENVIRONMENT:-production}"
      PM_GATEWAY_OUTBOX_INTERVAL_SECONDS: "${PM_GATEWAY_OUTBOX_INTERVAL_SECONDS:-5}"
      PM_GATEWAY_WEBHOOK_BODY_MAX_BYTES: "${PM_GATEWAY_WEBHOOK_BODY_MAX_BYTES:-1048576}"
    mem_limit: 128m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health').read()"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Outbound-only connector for the published pm-gateway webhook hostname.
  # The tunnel route must target http://pm-gateway:8010, never localhost.
  cloudflared:
    # The tunnel is an opt-in deployment extension.  Keep it out of the
    # default stack so a missing token cannot prevent the rest of Compose from
    # starting; enable it with `--profile cloudflare` when configured.
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:2026.7.0@sha256:5e49861633763e8933475477c20bae6039ed47f32c1d267a34babc347f28f0df
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    # Docker's embedded DNS is failing SRV lookups for the tunnel edge in this
    # environment.  These resolvers are used only for the connector's outbound
    # Cloudflare discovery; no service is exposed by this setting.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      # Compose interpolates service definitions even when a profile is not
      # selected, so this must remain safe for the documented empty default.
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    networks:
      # Egress only: this does not publish a host port or make a Cloudflare
      # route to any service other than the explicitly configured pm-gateway.
      - public
      - internal
    depends_on:
      pm-gateway:
        condition: service_healthy

  dashboard:
    image: "${AIAT_DASHBOARD_IMAGE_REF:?AIAT_DASHBOARD_IMAGE_REF must be an immutable OCI image reference}"
    build:
      context: ${MAS_BUILD_CONTEXT:-../..}
      dockerfile: infra/docker/Dockerfile.dashboard
    container_name: mas-dashboard
    restart: unless-stopped
    env_file:
      - path: ../../../.env
        format: raw
    networks:
      - internal
      - public
    ports:
      - "4000:3000"
    depends_on:
      orchestrator-api:
        condition: service_healthy
      message-router:
        condition: service_healthy
      tool-service:
        condition: service_healthy
    environment:
      ORCHESTRATOR_URL: "http://orchestrator-api:8000"
      MESSAGE_ROUTER_URL: "http://message-router:8001"
      TOOL_SERVICE_URL: "http://tool-service:8002"
      PROMETHEUS_URL: "http://prometheus:9090"
      PROMETHEUS_TIMEOUT_MS: "${PROMETHEUS_TIMEOUT_MS:-750}"
      LITELLM_DASHBOARD_URL: "${LITELLM_DASHBOARD_URL:-http://localhost:4001/ui/}"
      OMNIROUTE_DASHBOARD_URL: "${OMNIROUTE_DASHBOARD_URL:-http://localhost:20128/dashboard/analytics}"
      NODE_ENV: "production"
      PORT: "3000"
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Team runners (11 containers) ────────────────────────────────────────────
  # Each team merges &team-env (env vars only) then adds TEAM_CONFIG.
  # Using <<: *team-env inside environment: is correct because *team-env
  # contains ONLY key=value environment pairs, not service-level keys.

  team-exec-ceo:
    <<: *team-defaults
    container_name: mas-team-exec-ceo
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/exec_ceo.yaml

  team-exec-coo:
    <<: *team-defaults
    container_name: mas-team-exec-coo
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/exec_coo.yaml

  team-office-cfo:
    <<: *team-defaults
    container_name: mas-team-office-cfo
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/office_cfo.yaml

  team-office-cio:
    <<: *team-defaults
    container_name: mas-team-office-cio
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/office_cio.yaml

  team-office-chrm:
    <<: *team-defaults
    container_name: mas-team-office-chrm
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/office_chrm.yaml

  team-office-cso:
    <<: *team-defaults
    container_name: mas-team-office-cso
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/office_cso.yaml

  team-office-cto:
    <<: *team-defaults
    container_name: mas-team-office-cto
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/office_cto.yaml

  team-dept-production:
    <<: *team-defaults
    container_name: mas-team-dept-production
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/dept_production.yaml

  team-dept-system:
    <<: *team-defaults
    container_name: mas-team-dept-system
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/dept_system.yaml

  team-dept-qa:
    <<: *team-defaults
    container_name: mas-team-dept-qa
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/dept_qa.yaml

  team-dept-devops:
    <<: *team-defaults
    container_name: mas-team-dept-devops
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/dept_devops.yaml

