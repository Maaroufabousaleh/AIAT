# ── docker-compose.yml ────────────────────────────────────────────────────────
# 18 containers: 7 infra + 11 team-runners.
# All infra is $0 self-hosted OSS; only LLM API costs apply.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f orchestrator-api
#   docker compose down -v   # removes volumes (destructive!)
#
# Environment:
#   Copy .env.example → .env and fill in secrets before starting.
#   Required: POSTGRES_PASSWORD, MINIO_ROOT_PASSWORD,
#             ROUTER_PASSWORD, TOOLCACHE_PASSWORD,
#             ROUTER_SECRET or AGENT_TOKEN_SECRET, TOOL_SECRET,
#             LLM_GATEWAY_URL, LLM_API_KEY

name: mas

# ── Shared env vars (merged into each team's environment: block) ──────────────
x-team-env: &team-env
  ROUTER_URL: "http://message-router:8001"
  ROUTER_SECRET: "${ROUTER_SECRET}"
  TOOL_SERVICE_URL: "http://tool-service:8002"
  TOOL_SECRET: "${TOOL_SECRET}"
  PGBOUNCER_DSN: "postgresql+asyncpg://mas_user:${POSTGRES_PASSWORD}@pgbouncer:5432/mas"
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_ACCESS_KEY: "mas_agent"
  MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
  ORCHESTRATOR_URL: "http://orchestrator-api:8000"
  LOG_LEVEL: "INFO"
  # ── LLM gateway defaults ──────────────────────────────────────────────────
  LLM_GATEWAY_URL: "${LLM_GATEWAY_URL}"
  LLM_DEFAULT_MODEL: "${LLM_DEFAULT_MODEL}"
  LLM_API_KEY: "${LLM_API_KEY:-}"
  # ── Provider API keys (read by mas-core provider modules at runtime) ──────
  GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
  OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
  GROQ_API_KEY: "${GROQ_API_KEY:-}"
  CEREBRAS_API_KEY: "${CEREBRAS_API_KEY:-}"
  MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
  CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
  CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
  OPENCODE_API_KEY: "${OPENCODE_API_KEY:-public}"

# ── Shared team defaults ───────────────────────────────────────────────────
x-team-defaults: &team-defaults
  image: mas/team-runner:latest
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile.team-runner
  restart: unless-stopped
  networks:
    - internal
    - public
  mem_limit: 512m
  cpus: "0.5"

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  redis_data:
  postgres_data:
  minio_data:

# ── Services ─────────────────────────────────────────────────────────────────

services:

  # ── 0. Redis ACL Init (one-time setup) ──────────────────────────────────────
  # Runs once to configure ACL users. Can be removed after first run.
  redis-acl-init:
    image: redis:7.2-alpine
    restart: "no"
    networks:
      - internal
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ROUTER_PASSWORD: "${ROUTER_PASSWORD}"
      TOOLCACHE_PASSWORD: "${TOOLCACHE_PASSWORD}"
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-acl-init.sh"]
    volumes:
      - ./redis-acl-init.sh:/usr/local/bin/redis-acl-init.sh:ro
    depends_on:
      redis:
        condition: service_started

  # ── 1. Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./redis.conf:/etc/redis/redis.conf:ro
    networks:
      - internal
    # Redis ports are NOT published to the host in production.
    # Use docker-compose.dev.yml to expose them for local debugging.
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "redis-cli", "-u", "redis://:router_user@redis:6379", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  # ── 2. Postgres ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mas
      POSTGRES_USER: mas_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mas_user -d mas"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  # ── 3. PgBouncer ────────────────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://mas_user:${POSTGRES_PASSWORD}@postgres:5432/mas"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      AUTH_TYPE: scram-sha-256
      SERVER_RESET_QUERY: "DISCARD ALL"
      LISTEN_PORT: "5432"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    cpus: "0.25"

  # ── 4. MinIO ────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_root
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio_data:/data
    networks:
      - internal
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # MinIO init: create bucket + access key for agents
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal
    environment:
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minio_root $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/mas-agents &&
        mc admin user add local mas_agent $$MINIO_ROOT_PASSWORD &&
        mc admin policy attach local readwrite --user mas_agent &&
        echo 'MinIO init complete'
      "

  # ── 5. Message Router ───────────────────────────────────────────────────────
  message-router:
    image: mas/message-router:latest
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      redis-acl-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      REDIS_URL: "redis://router_user:${ROUTER_PASSWORD}@redis:6379/0"
      REDIS_USERNAME: "router_user"
      REDIS_PASSWORD: "${ROUTER_PASSWORD}"
      ROUTER_SECRET: "${ROUTER_SECRET}"
      LOG_LEVEL: "INFO"
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── 6. Tool Service ─────────────────────────────────────────────────────────
  tool-service:
    image: mas/tool-service:latest
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.tool-service
    restart: unless-stopped
    networks:
      - internal
      - public
    # No host port in production — only team-runners (on internal) need it.
    # Use docker-compose.dev.yml to expose for local debugging.
    depends_on:
      redis-acl-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      # Redis ACL: connect as toolcache_user (DB 1 for tool cache)
      REDIS_URL: "redis://toolcache_user:${TOOLCACHE_PASSWORD}@redis:6379/1"
      REDIS_USERNAME: "toolcache_user"
      REDIS_PASSWORD: "${TOOLCACHE_PASSWORD}"
      TOOL_SECRET: "${TOOL_SECRET}"
      LLM_GATEWAY_URL: "${LLM_GATEWAY_URL}"
      LLM_API_KEY: "${LLM_API_KEY}"
      LOG_LEVEL: "INFO"
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import httpx; httpx.get('http://localhost:8002/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── 7. Orchestrator API ─────────────────────────────────────────────────────
  orchestrator-api:
    image: mas/orchestrator-api:latest
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.orchestrator-api
    restart: unless-stopped
    networks:
      - public
      - internal
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      message-router:
        condition: service_started
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      PGBOUNCER_DSN: "postgresql+asyncpg://mas_user:${POSTGRES_PASSWORD}@pgbouncer:5432/mas"
      ROUTER_URL: "http://message-router:8001"
      ROUTER_SECRET: "${ROUTER_SECRET}"
      LOG_LEVEL: "INFO"
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── 8. Dashboard ────────────────────────────────────────────────────────────
  dashboard:
    image: mas/dashboard:latest
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dashboard
    container_name: mas-dashboard
    restart: unless-stopped
    networks:
      - internal
      - public
    ports:
      - "4000:3000"
    depends_on:
      orchestrator-api:
        condition: service_healthy
      message-router:
        condition: service_healthy
      tool-service:
        condition: service_healthy
    environment:
      DASHBOARD_USERNAME: "${DASHBOARD_USERNAME}"
      DASHBOARD_PASSWORD_HASH: "${DASHBOARD_PASSWORD_HASH}"
      JWT_SECRET: "${JWT_SECRET}"
      MAS_API_KEY: "${MAS_API_KEY}"
      ROUTER_SECRET: "${ROUTER_SECRET}"
      ORCHESTRATOR_URL: "http://orchestrator-api:8000"
      MESSAGE_ROUTER_URL: "http://message-router:8001"
      TOOL_SERVICE_URL: "http://tool-service:8002"
      PROMETHEUS_URL: "http://prometheus:9090"
      NODE_ENV: "production"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Team runners (11 containers) ────────────────────────────────────────────
  # Each team merges &team-env (env vars only) then adds TEAM_CONFIG.
  # Using <<: *team-env inside environment: is correct because *team-env
  # contains ONLY key=value environment pairs, not service-level keys.

  team-exec-ceo:
    <<: *team-defaults
    container_name: mas-team-exec-ceo
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/exec_ceo.yaml

  team-exec-coo:
    <<: *team-defaults
    container_name: mas-team-exec-coo
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/exec_coo.yaml

  team-office-cfo:
    <<: *team-defaults
    container_name: mas-team-office-cfo
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/office_cfo.yaml

  team-office-cio:
    <<: *team-defaults
    container_name: mas-team-office-cio
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/office_cio.yaml

  team-office-chrm:
    <<: *team-defaults
    container_name: mas-team-office-chrm
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/office_chrm.yaml

  team-office-cso:
    <<: *team-defaults
    container_name: mas-team-office-cso
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/office_cso.yaml

  team-office-cto:
    <<: *team-defaults
    container_name: mas-team-office-cto
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/office_cto.yaml

  team-dept-production:
    <<: *team-defaults
    container_name: mas-team-dept-production
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/dept_production.yaml

  team-dept-system:
    <<: *team-defaults
    container_name: mas-team-dept-system
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/dept_system.yaml

  team-dept-qa:
    <<: *team-defaults
    container_name: mas-team-dept-qa
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/dept_qa.yaml

  team-dept-devops:
    <<: *team-defaults
    container_name: mas-team-dept-devops
    environment:
      <<: *team-env
      TEAM_CONFIG: /app/teams/dept_devops.yaml
