# ── Prometheus scrape configuration for MAS ──────────────────────────────────
# Scraped by the Prometheus container in docker-compose.dev.yml.
# Each FastAPI service exposes /metrics via prometheus_client.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # ── Orchestrator API ──────────────────────────────────────────────────────
  - job_name: "orchestrator-api"
    static_configs:
      - targets: ["orchestrator-api:8000"]
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/orchestrator_api_key
    scrape_interval: 10s

  # ── Message Router ────────────────────────────────────────────────────────
  - job_name: "message-router"
    static_configs:
      - targets: ["message-router:8001"]
    metrics_path: /metrics
    scrape_interval: 10s

  # ── Tool Service ──────────────────────────────────────────────────────────
  - job_name: "tool-service"
    static_configs:
      - targets: ["tool-service:8002"]
    metrics_path: /metrics
    scrape_interval: 10s

  # ── Prometheus self-monitoring ────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
