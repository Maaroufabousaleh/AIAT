[databases]
mas = host=postgres port=5432 dbname=mas user=mas_user

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = trust
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5

server_reset_query = DISCARD ALL
server_check_delay = 30

log_connections = 0
log_disconnections = 0
log_pooler_errors = 0
