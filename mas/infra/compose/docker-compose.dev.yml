# ── docker-compose.dev.yml ────────────────────────────────────────────────────
# Development overlay: exposes Redis/Postgres ports, adds admin UIs,
# exposes LiteLLM/OmniRoute analytics, keeps Prometheus for optional platform
# metrics, and enables hot-reload for FastAPI services.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

name: mas

services:

  # Expose Redis on host for local debugging (e.g. RedisInsight)
  redis:
    ports:
      - "6379:6379"

  # Expose Postgres on host for psql / pgAdmin
  postgres:
    ports:
      - "5432:5432"

  # Expose MinIO console on host
  minio:
    ports:
      - "9000:9000"
      - "9001:9001"   # MinIO Web console

  # pgAdmin — Postgres GUI
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    networks:
      - internal
      - public
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: "${POSTGRES_PASSWORD}"
    mem_limit: 256m

  # RedisInsight — Redis GUI
  redis-insight:
    image: redislabs/redisinsight:latest
    restart: unless-stopped
    networks:
      - internal
      - public
    ports:
      - "8003:5540"
    mem_limit: 256m

  # ── Prometheus (Phase 12) ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    networks:
      - internal
      - public
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - orchestrator_api_key
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Expose LLM gateway internals for local debugging.
  # Dashboard already uses host port 4000, so LiteLLM uses 4001 on the host.
  litellm:
    ports:
      - "4001:4000"

  omniroute:
    ports:
      - "20128:20128"

  # Dev overrides for FastAPI services. These intentionally avoid uvicorn's
  # reload watcher because bind-mounted WSL workspaces can raise watchfiles
  # IO errors and crash otherwise healthy services during live-stack tests.
  orchestrator-api:
    command: >
      uvicorn orchestrator_api.main:app
        --host 0.0.0.0 --port 8000
    volumes:
      - ../../apps/orchestrator-api/orchestrator_api:/app/orchestrator_api
      # Keep the provider-control-plane core hot-reloadable with the API in
      # development; production remains image-pinned.
      - ../../packages/mas-core/mas_core:/app/mas_core
      - ../../migrations:/app/migrations
    environment:
      MAS_ENVIRONMENT: development
      PYTHONPATH: /app
      LOG_LEVEL: DEBUG
      WATCHFILES_FORCE_POLLING: "true"

  message-router:
    networks:
      - internal
      - public
    ports:
      - "8001:8001"
    command: >
      uvicorn message_router.main:app
        --host 0.0.0.0 --port 8001
    volumes:
      - ../../apps/message-router/message_router:/app/message_router
    environment:
      LOG_LEVEL: DEBUG
      WATCHFILES_FORCE_POLLING: "true"

  tool-service:
    ports:
      - "8002:8002"
    command: >
      uvicorn tool_service.main:app
        --host 0.0.0.0 --port 8002
    volumes:
      - ../../apps/tool-service/tool_service:/app/tool_service
    environment:
      LOG_LEVEL: DEBUG
      WATCHFILES_FORCE_POLLING: "true"

  pm-gateway:
    ports:
      - "8010:8010"
    command: >
      uvicorn pm_gateway.main:app
        --host 0.0.0.0 --port 8010
    volumes:
      - ../../apps/pm-gateway/pm_gateway:/usr/local/lib/python3.11/site-packages/pm_gateway
    environment:
      PM_GATEWAY_ENVIRONMENT: development

secrets:
  orchestrator_api_key:
    environment: MAS_API_KEY

# ── Volumes (dev-only) ─────────────────────────────────────────────────────
volumes:
  prometheus_data:
