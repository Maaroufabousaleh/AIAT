# ── docker-compose.dev.yml ────────────────────────────────────────────────────
# Development overlay: exposes Redis/Postgres ports, adds admin UIs,
# exposes LiteLLM/OmniRoute analytics, keeps Prometheus for optional platform
# metrics, and enables hot-reload for FastAPI services.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

name: mas

networks:
  # Development-only host access for local diagnostics.  This network is
  # intentionally separate from the application public network; its ports
  # are bound to the WSL loopback interface below.
  dev_host_access:
    driver: bridge

services:

  # Expose Redis on host for local debugging (e.g. RedisInsight)
  redis:
    ports:
      - "127.0.0.1:${AIAT_DEV_REDIS_PORT:-6379}:6379"
    networks:
      - internal
      - dev_host_access

  # Expose Postgres on host for psql / pgAdmin
  postgres:
    ports:
      - "127.0.0.1:${AIAT_DEV_POSTGRES_PORT:-5432}:5432"
    networks:
      - internal
      - dev_host_access

  # Expose MinIO console on host
  minio:
    ports:
      - "127.0.0.1:${AIAT_DEV_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${AIAT_DEV_MINIO_CONSOLE_PORT:-9001}:9001"   # MinIO Web console
    networks:
      - internal
      - dev_host_access

  # pgAdmin — Postgres GUI
  pgadmin:
    image: dpage/pgadmin4:latest@sha256:2f4ce946ddf8360680d7eff4eaba1d91859eb6b4003e6623bad5c63a322c2f4d
    restart: unless-stopped
    networks:
      - internal
      - public
    ports:
      - "${AIAT_DEV_PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: "${POSTGRES_PASSWORD}"
    mem_limit: 256m

  # RedisInsight — Redis GUI
  redis-insight:
    image: redislabs/redisinsight:latest@sha256:b5e19ee240abef6edb435871b90ff8a210995422e8e018ab61c0339d318a1f84
    restart: unless-stopped
    networks:
      - internal
      - public
    ports:
      - "${REDIS_INSIGHT_PORT:-8003}:5540"
    mem_limit: 256m

  # ── Prometheus (Phase 12) ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    networks:
      - internal
      - public
    ports:
      - "${AIAT_DEV_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - orchestrator_api_key
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Expose LLM gateway internals for local debugging.
  # Dashboard already uses host port 4000, so LiteLLM uses 4001 on the host.
  litellm:
    ports:
      - "${AIAT_DEV_LITELLM_PORT:-4001}:4000"

  omniroute:
    ports:
      - "${AIAT_DEV_OMNIROUTE_API_PORT:-20128}:20128"
      - "${AIAT_DEV_OMNIROUTE_METRICS_PORT:-20129}:20129"

  dashboard:
    depends_on:
      prometheus:
        # Metrics are optional; start the dashboard as soon as Prometheus is
        # launched and let the bounded query timeout handle a cold/unhealthy
        # metrics backend without blocking the UI.
        condition: service_started

  # Dev overrides for FastAPI services. These intentionally avoid uvicorn's
  # reload watcher because bind-mounted WSL workspaces can raise watchfiles
  # IO errors and crash otherwise healthy services during live-stack tests.
  orchestrator-api:
    command: >
      uvicorn orchestrator_api.main:app
        --host 0.0.0.0 --port 8000
    volumes:
      - ../../apps/orchestrator-api/orchestrator_api:/app/orchestrator_api
      # Keep the provider-control-plane core hot-reloadable with the API in
      # development; production remains image-pinned.
      - ../../packages/mas-core/mas_core:/app/mas_core
      - ../../migrations:/app/migrations
      # Keep the checked-in default company manifest in sync with the mounted
      # development API instead of relying on a stale image layer.
      - ../../companies:/app/companies:ro
    environment:
      MAS_ENVIRONMENT: development
      PYTHONPATH: /app
      LOG_LEVEL: DEBUG
      WATCHFILES_FORCE_POLLING: "true"

  message-router:
    networks:
      - internal
      - public
    ports:
      - "${AIAT_DEV_MESSAGE_ROUTER_PORT:-8001}:8001"
    command: >
      uvicorn message_router.main:app
        --host 0.0.0.0 --port 8001
    volumes:
      - ../../apps/message-router/message_router:/app/message_router
    environment:
      LOG_LEVEL: DEBUG
      WATCHFILES_FORCE_POLLING: "true"

  tool-service:
    ports:
      - "${AIAT_DEV_TOOL_SERVICE_PORT:-8002}:8002"
    command: >
      uvicorn tool_service.main:app
        --host 0.0.0.0 --port 8002
    volumes:
      - ../../apps/tool-service/tool_service:/app/tool_service
    environment:
      LOG_LEVEL: DEBUG
      WATCHFILES_FORCE_POLLING: "true"

  pm-gateway:
    command: >
      uvicorn pm_gateway.main:app
        --host 0.0.0.0 --port 8010
    volumes:
      - ../../apps/pm-gateway/pm_gateway:/usr/local/lib/python3.11/site-packages/pm_gateway
    environment:
      PM_GATEWAY_ENVIRONMENT: development

secrets:
  orchestrator_api_key:
    environment: MAS_API_KEY

# ── Volumes (dev-only) ─────────────────────────────────────────────────────
volumes:
  prometheus_data:
