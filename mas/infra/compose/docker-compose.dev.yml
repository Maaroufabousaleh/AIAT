# ── docker-compose.dev.yml ────────────────────────────────────────────────────
# Development overlay: exposes Redis/Postgres ports, adds admin UIs,
# adds Prometheus + Grafana (Phase 12), enables hot-reload for FastAPI services.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

name: mas

services:

  # Expose Redis on host for local debugging (e.g. RedisInsight)
  redis:
    ports:
      - "6379:6379"

  # Expose Postgres on host for psql / pgAdmin
  postgres:
    ports:
      - "5432:5432"

  # Expose MinIO console on host
  minio:
    ports:
      - "9000:9000"
      - "9001:9001"   # MinIO Web console

  # pgAdmin — Postgres GUI
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    networks:
      - internal
      - public
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: "${POSTGRES_PASSWORD}"
    mem_limit: 256m

  # RedisInsight — Redis GUI
  redis-insight:
    image: redislabs/redisinsight:latest
    restart: unless-stopped
    networks:
      - internal
      - public
    ports:
      - "8003:5540"
    mem_limit: 256m

  # ── Prometheus (Phase 12) ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    networks:
      - internal
      - public
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── Grafana (Phase 12) ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana-oss:10.4.0
    restart: unless-stopped
    networks:
      - internal
      - public
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      prometheus:
        condition: service_healthy
    mem_limit: 256m
    cpus: "0.5"

  # Hot-reload overrides for FastAPI services
  orchestrator-api:
    command: >
      uvicorn orchestrator_api.main:app
        --host 0.0.0.0 --port 8000
        --reload --reload-dir /app
    volumes:
      - ../../apps/orchestrator-api/orchestrator_api:/app/orchestrator_api
      - ../../migrations:/app/migrations
    environment:
      LOG_LEVEL: DEBUG
      WATCHFILES_FORCE_POLLING: "true"

  message-router:
    ports:
      - "8001:8001"
    command: >
      uvicorn message_router.main:app
        --host 0.0.0.0 --port 8001
        --reload --reload-dir /app
    volumes:
      - ../../apps/message-router/message_router:/app/message_router
    environment:
      LOG_LEVEL: DEBUG
      WATCHFILES_FORCE_POLLING: "true"

  tool-service:
    ports:
      - "8002:8002"
    command: >
      uvicorn tool_service.main:app
        --host 0.0.0.0 --port 8002
        --reload --reload-dir /app
    volumes:
      - ../../apps/tool-service/tool_service:/app/tool_service
    environment:
      LOG_LEVEL: DEBUG
      WATCHFILES_FORCE_POLLING: "true"

# ── Volumes (dev-only) ─────────────────────────────────────────────────────
volumes:
  prometheus_data:
  grafana_data:
