services:
  stalwart:
    # The file contains only RESEND_API_KEY. Compose passes the file to the
    # container without placing its value in command arguments or this model.
    env_file:
      - path: ${STALWART_RESEND_SECRET_FILE:?Set STALWART_RESEND_SECRET_FILE to the root-owned mode-0600 file}
        format: raw
