name: aiat-smtp-gateway

# Host networking is intentional: WireGuard is host-managed and Postfix/Caddy
# must bind only the gateway's public listeners. No Docker API or management
# socket is mounted.
services:
  postfix-gateway:
    image: boky/postfix:5.1.0-debian@sha256:aafc772384232497bed875e1eb66b4d3e54ba1ebc86e2e185a6dc1dbc48182ef
    restart: unless-stopped
    network_mode: host
    environment:
      HOSTNAME: ${SMTP_GATEWAY_HOSTNAME:?SMTP_GATEWAY_HOSTNAME is required}
      AGENT_MAIL_DOMAIN: ${AGENT_MAIL_DOMAIN:?AGENT_MAIL_DOMAIN is required}
      HOME_WIREGUARD_IP: ${HOME_WIREGUARD_IP:?HOME_WIREGUARD_IP is required}
      HOME_STALWART_SMTP_PORT: ${HOME_STALWART_SMTP_PORT:-25}
      GATEWAY_QUEUE_LIFETIME: ${GATEWAY_QUEUE_LIFETIME:-2d}
      GATEWAY_BOUNCE_QUEUE_LIFETIME: ${GATEWAY_BOUNCE_QUEUE_LIFETIME:-1d}
      GATEWAY_QUEUE_MIN_FREE_KB: ${GATEWAY_QUEUE_MIN_FREE_KB:-1048576}
      GATEWAY_QUEUE_MAX_BYTES: ${GATEWAY_QUEUE_MAX_BYTES:-10737418240}
      GATEWAY_QUEUE_LIMIT_MODE: ${GATEWAY_QUEUE_LIMIT_MODE:?GATEWAY_QUEUE_LIMIT_MODE is required}
      RELAYHOST: ""
      MYNETWORKS: 127.0.0.0/8,[::1]/128
      ALLOWED_SENDER_DOMAINS: ""
      ALLOW_EMPTY_SENDER_DOMAINS: "true"
      MESSAGE_SIZE_LIMIT: ${GATEWAY_MESSAGE_SIZE_LIMIT:-26214400}
      LOG_FORMAT: plain
    volumes:
      - type: bind
        source: ${GATEWAY_QUEUE_PATH:?GATEWAY_QUEUE_PATH is required}
        target: /var/spool/postfix
      - gateway_postfix_logs:/var/log/postfix
      - ./postfix/gateway-init.sh:/docker-init.d/10-aiat-gateway.sh:ro
      - ./scripts/gateway-queue-status.sh:/usr/local/bin/aiat-gateway-queue-status:ro
    healthcheck:
      test: ["CMD-SHELL", "postfix check && /usr/local/bin/aiat-gateway-queue-status | grep -q '\"status\":\"healthy\"'"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: "1.00"

  log-sanitizer:
    image: boky/postfix:5.1.0-debian@sha256:aafc772384232497bed875e1eb66b4d3e54ba1ebc86e2e185a6dc1dbc48182ef
    restart: unless-stopped
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command: ["tail -F /var/log/postfix/maillog | /usr/local/bin/aiat-sanitize-postfix-log"]
    volumes:
      - gateway_postfix_logs:/var/log/postfix:ro
      - ./postfix/sanitize-log.sh:/usr/local/bin/aiat-sanitize-postfix-log:ro
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: "0.10"

  ingress:
    image: caddy:2.8.4-alpine@sha256:b95ed06fbc6d74d24a40902090c8cc6086ce7d08ba60a3a7e8e62bf164a9d7bb
    restart: unless-stopped
    network_mode: host
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.aiat.ca}
      IDENTITY_HOSTNAME: ${IDENTITY_HOSTNAME:-identity.aiat.ca}
      HOME_WIREGUARD_IP: ${HOME_WIREGUARD_IP:?HOME_WIREGUARD_IP is required}
      HOME_STALWART_HTTP_PORT: ${HOME_STALWART_HTTP_PORT:-8080}
      HOME_IDENTITY_SERVICE_PORT: ${HOME_IDENTITY_SERVICE_PORT:-8010}
    volumes:
      - ./ingress/Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway_caddy_data:/data
      - gateway_caddy_config:/config
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 192m
    cpus: "0.25"

volumes:
  gateway_postfix_logs:
    name: aiat_smtp_gateway_postfix_logs
  gateway_caddy_data:
    name: aiat_smtp_gateway_caddy_data
  gateway_caddy_config:
    name: aiat_smtp_gateway_caddy_config
