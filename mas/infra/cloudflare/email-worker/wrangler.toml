name = "aiat-mail-edge"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = false

# Replace only the resource identifiers during the operator-owned Cloudflare
# deployment. The Worker runtime receives the narrow MAIL_EDGE_AUTH_SECRET;
# it never receives a Cloudflare account API token.
[[d1_databases]]
binding = "DB"
database_name = "aiat-mail-edge"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "schema"

[[r2_buckets]]
binding = "MAIL_OBJECTS"
bucket_name = "aiat-mail-edge"

[vars]
MAIL_EDGE_AUTH_VERSION = "aiat.mail-edge.v1"
MAIL_EDGE_MAX_MESSAGE_BYTES = "10485760"
MAIL_EDGE_AUTH_TOLERANCE_SECONDS = "300"
MAIL_EDGE_RETENTION_DAYS = "7"
MAIL_EDGE_PROCESSED_RETENTION_DAYS = "1"

[triggers]
crons = ["*/15 * * * *"]
