name: aiat-mail-edge

# Portable Oracle/paid-VPS profile. Only SMTP/25 and HTTPS/443 are published.
# Postgres, Stalwart administration, and identity-service stay on mail_private.
services:
  identity-postgres:
    image: postgres:16.6-alpine@sha256:589f3b24f30e60a2b33f79543ed51c8f897589bcde5c59f4dc0e814551eeeb0f
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity_service
      POSTGRES_PASSWORD: ${IDENTITY_DATABASE_PASSWORD:?identity database password is required}
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data
    networks: [mail_private]
    read_only: true
    tmpfs: [/run, /tmp]
    mem_limit: 512m
    cpus: "0.50"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_service -d identity"]
      interval: 10s
      timeout: 5s
      retries: 8

  identity-service:
    image: aiat/identity-service:0.1.0
    build:
      context: ../../apps/identity-service
      dockerfile: ../../infra/docker/Dockerfile.identity-service
    restart: unless-stopped
    environment:
      MAS_ENVIRONMENT: production
      IDENTITY_DATABASE_HOST: identity-postgres
      IDENTITY_DATABASE_PORT: "5432"
      IDENTITY_DATABASE_NAME: identity
      IDENTITY_DATABASE_USER: identity_service
      IDENTITY_DATABASE_PASSWORD: ${IDENTITY_DATABASE_PASSWORD:?identity database password is required}
      IDENTITY_SERVICE_SECRET: ${IDENTITY_SERVICE_SECRET:?identity service secret is required}
      IDENTITY_CONTENT_ENCRYPTION_KEY: ${IDENTITY_CONTENT_ENCRYPTION_KEY:?identity content encryption key is required}
      IDENTITY_CLIENT_PUBLIC_KEYS_JSON: '${IDENTITY_CLIENT_PUBLIC_KEYS_JSON:?identity client public keys are required}'
      IDENTITY_CLIENT_SCOPES_JSON: '${IDENTITY_CLIENT_SCOPES_JSON:?identity client scopes are required}'
      STALWART_API_KEY: ${STALWART_API_KEY:?Stalwart API key is required}
      STALWART_JMAP_SERVICE_TOKEN: ${STALWART_JMAP_SERVICE_TOKEN:?Stalwart JMAP service token is required}
      RESEND_API_KEY: ${RESEND_API_KEY:?Resend API key is required}
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-aiat.ca}
      AGENT_MAIL_DOMAIN: ${AGENT_MAIL_DOMAIN:-agents.aiat.ca}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.aiat.ca}
      BROWSER_RUNTIME_LOCATION: operator_laptop
      # Private Docker-network transport. Public JMAP terminates TLS at Caddy.
      STALWART_PUBLIC_URL: http://stalwart:8080
      PUBLIC_IDENTITY_URL: https://${IDENTITY_HOSTNAME}
      DIRECT_MX_OUTBOUND_ENABLED: "false"
      OUTBOUND_RELAY_PROVIDER: resend
      OUTBOUND_RELAY_HOST: smtp.resend.com
      OUTBOUND_RELAY_PORT: "465"
      OUTBOUND_RELAY_TLS_MODE: implicit
    depends_on:
      identity-postgres:
        condition: service_healthy
      identity-migrate:
        condition: service_completed_successfully
      stalwart:
        condition: service_started
    networks: [mail_private, mail_egress]
    read_only: true
    tmpfs: [/run, /tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 384m
    cpus: "0.50"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8

  identity-migrate:
    image: aiat/identity-service:0.1.0
    build:
      context: ../../apps/identity-service
      dockerfile: ../../infra/docker/Dockerfile.identity-service
    restart: "no"
    environment:
      IDENTITY_DATABASE_HOST: identity-postgres
      IDENTITY_DATABASE_PORT: "5432"
      IDENTITY_DATABASE_NAME: identity
      IDENTITY_DATABASE_USER: identity_service
      IDENTITY_DATABASE_PASSWORD: ${IDENTITY_DATABASE_PASSWORD:?identity database password is required}
    entrypoint: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    depends_on:
      identity-postgres:
        condition: service_healthy
    networks: [mail_private]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 192m
    cpus: "0.25"

  stalwart:
    image: ghcr.io/stalwartlabs/stalwart:v0.16.7@sha256:6a8ddaa5728a5e78a8611085069f63414cd43c3a669471785dd41aad1ca16e63
    restart: unless-stopped
    environment:
      STALWART_PUBLIC_URL: https://${MAIL_HOSTNAME:-mail.aiat.ca}
      RESEND_API_KEY: ${RESEND_API_KEY:?Resend API key is required}
      STALWART_RECOVERY_ADMIN: ${STALWART_RECOVERY_ADMIN:-}
    volumes:
      - stalwart_config:/etc/stalwart
      - stalwart_data:/var/lib/stalwart
    networks: [mail_private, mail_egress]
    ports:
      - "25:25"
      # Private bootstrap/recovery path only. Reach it through an SSH tunnel;
      # it is bound to loopback and is never exposed by the VPS firewall.
      - "127.0.0.1:18080:8080"
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: "0.75"
    healthcheck:
      # Do not treat a mounted data directory as service health. The pinned
      # image includes curl and Stalwart exposes distinct readiness/liveness
      # endpoints on its private HTTP listener.
      test: ["CMD-SHELL", "curl -fsS -H 'X-Forwarded-For: 127.0.0.1' http://127.0.0.1:8080/healthz/ready"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 8

  ingress:
    image: caddy:2.8.4-alpine@sha256:b95ed06fbc6d74d24a40902090c8cc6086ce7d08ba60a3a7e8e62bf164a9d7bb
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME contact email is required}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.aiat.ca}
      IDENTITY_HOSTNAME: ${IDENTITY_HOSTNAME:-identity.aiat.ca}
    ports:
      - "80:80"
      - "443:443"
    networks: [mail_private, mail_egress]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 192m
    cpus: "0.25"
    depends_on:
      identity-service:
        condition: service_healthy

  encrypted-backup:
    image: aiat/mail-edge-backup:0.1.0
    build:
      context: ../docker
      dockerfile: Dockerfile.mail-edge-backup
    profiles: [backup]
    environment:
      PGHOST: identity-postgres
      PGUSER: identity_service
      PGPASSWORD: ${IDENTITY_DATABASE_PASSWORD:?identity database password is required}
      PGDATABASE: identity
      BACKUP_ENCRYPTION_RECIPIENT: ${BACKUP_ENCRYPTION_RECIPIENT:?age recipient is required}
    volumes:
      - stalwart_config:/source/stalwart-config:ro
      - stalwart_data:/source/stalwart-data:ro
      - mail_edge_backups:/backups
      - ./scripts/backup.sh:/opt/backup.sh:ro
    entrypoint: ["/bin/sh", "/opt/backup.sh"]
    networks: [mail_private]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: "0.25"

  encrypted-restore:
    image: aiat/mail-edge-backup:0.1.0
    build:
      context: ../docker
      dockerfile: Dockerfile.mail-edge-backup
    profiles: [restore]
    environment:
      PGHOST: identity-postgres
      PGUSER: identity_service
      PGPASSWORD: ${IDENTITY_DATABASE_PASSWORD:?identity database password is required}
      PGDATABASE: identity
      BACKUP_FILE: ${BACKUP_FILE:-/backups/SET_BACKUP_FILE}
      BACKUP_DECRYPTION_IDENTITY_FILE: /run/age/identity.txt
      RESTORE_CONFIRM: ${RESTORE_CONFIRM:-}
      STALWART_RESTORE_OFFLINE: ${STALWART_RESTORE_OFFLINE:-false}
    volumes:
      - mail_edge_backups:/backups:ro
      - stalwart_config:/target/stalwart-config
      - stalwart_data:/target/stalwart-data
      - ./scripts/restore.sh:/opt/restore.sh:ro
      - ${BACKUP_DECRYPTION_IDENTITY_FILE:-./DO_NOT_CREATE_AGE_IDENTITY}:/run/age/identity.txt:ro
    entrypoint: ["/bin/sh", "/opt/restore.sh"]
    networks: [mail_private]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: "0.25"

  stalwart-relay-configurator:
    image: aiat/mail-edge-backup:0.1.0
    build:
      context: ../docker
      dockerfile: Dockerfile.mail-edge-backup
    profiles: [configure]
    environment:
      STALWART_ADMIN_URL: http://stalwart:8080/api
      STALWART_ADMIN_INSECURE_TLS: "false"
      STALWART_API_KEY: ${STALWART_API_KEY:?Stalwart API key is required}
      STALWART_RELAY_POLICY: /opt/stalwart-relay-policy.json
      STALWART_RELAY_VERIFY_SCRIPT: /opt/verify-stalwart-relay.sh
    volumes:
      - ./stalwart-relay-policy.json:/opt/stalwart-relay-policy.json:ro
      - ./scripts/configure-stalwart-relay.sh:/opt/configure-stalwart-relay.sh:ro
      - ./scripts/verify-stalwart-relay.sh:/opt/verify-stalwart-relay.sh:ro
    entrypoint: ["/bin/sh", "/opt/configure-stalwart-relay.sh"]
    networks: [mail_private]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: "0.10"
    depends_on:
      stalwart:
        condition: service_started

networks:
  mail_private:
    driver: bridge
    internal: true
  # Only permits outbound ACME, relay, and API requests.  It publishes no
  # administration ports; all service-to-service administration stays private.
  mail_egress:
    driver: bridge

volumes:
  identity_postgres_data:
  stalwart_config:
  stalwart_data:
  caddy_data:
  caddy_config:
  mail_edge_backups:
