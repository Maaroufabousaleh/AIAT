schema_version: "1"
policy:
  programme_scope: personal-internal-only
  license_handling: metadata-only
  enforce_license_gate: false
  license_metadata_missing_action: operator-notice
  license_metadata_restriction_action: operator-notice
  require_exact_version: true
  record_source_and_license_metadata_when_known: true
components:
  - id: langgraph
    role: default-worker-runtime
    license: MIT
    version: 0.6.11
    source: https://github.com/langchain-ai/langgraph
    license_evidence: https://github.com/langchain-ai/langgraph/blob/main/LICENSE
    integration: python-dependency
    status: available
  - id: crewai
    role: default-worker-runtime
    license: MIT
    version: 1.6.1
    source: https://github.com/crewAIInc/crewAI
    license_evidence: https://github.com/crewAIInc/crewAI/blob/main/LICENSE
    integration: python-dependency
    status: available
  - id: microsoft-agent-framework
    role: default-worker-runtime
    license: MIT
    version: "1.13.0 (locked; optional-not-installed)"
    source: https://github.com/microsoft/agent-framework/tree/main/python
    license_evidence: https://github.com/microsoft/agent-framework/blob/main/LICENSE
    integration: optional-adapter
    status: available-locked-pending-install
    compatibility_lock: mas/docs/provenance/runtime_compatibility.yaml
    mcp_compatibility: ">=1.27,<2"
    current_workspace_mcp: "==1.23.3"
    activation_preflight: mas/scripts/check_runtime_compatibility.py
  - id: opencode
    role: coding-worker-runtime
    license: MIT
    version: 1.17.13
    source: https://github.com/anomalyco/opencode
    license_evidence: https://github.com/anomalyco/opencode/blob/dev/LICENSE
    integration: pinned-container
    status: available
  - id: docling
    role: document-ingestion
    license: MIT
    version: 2.110.0
    source: https://github.com/docling-project/docling
    license_evidence: https://github.com/docling-project/docling/blob/main/LICENSE
    integration: subprocess-adapter
    status: available
  - id: semgrep
    role: security-evaluator
    license: LGPL-2.1
    version: 1.168.0
    source: https://github.com/semgrep/semgrep
    license_evidence: https://github.com/semgrep/semgrep/blob/develop/LICENSE
    integration: external-cli
    status: available
  - id: skillspector
    role: security-evaluator
    license: unknown
    version: null
    source: operator-supplied
    source_identity: unresolved-until-configured
    license_evidence: null
    integration: sandboxed-cli-adapter
    status: unavailable-until-configured
    unavailable_reason: Exact SkillSpector repository/CLI identity is operator-supplied and is not present in this workspace.
    operator_notice: Exact SkillSpector repository/CLI identity may be recorded when configured; missing or unusual licence metadata is informational only for this personal internal-use programme.
  - id: gvisor
    role: sandbox
    license: Apache-2.0
    version: null
    source: https://github.com/google/gvisor
    license_evidence: https://github.com/google/gvisor/blob/master/LICENSE
    integration: runtime-profile
    status: unavailable-until-host-pinned
    unavailable_reason: Native runsc registration is not present in the current Docker host.
  - id: firecracker
    role: high-risk-sandbox
    license: Apache-2.0
    version: null
    source: https://github.com/firecracker-microvm/firecracker
    license_evidence: https://github.com/firecracker-microvm/firecracker/blob/main/LICENSE-APACHE
    integration: optional-runtime-profile
    status: unavailable-until-host-pinned
    unavailable_reason: A measured Firecracker host binary/profile is not present in the current evidence environment.
  - id: opentofu
    role: iac-adapter
    license: MPL-2.0
    version: 1.11.7
    source: https://github.com/opentofu/opentofu
    license_evidence: https://github.com/opentofu/opentofu/blob/main/LICENSE
    integration: external-cli
    status: available
  - id: ccpm
    role: planning-adapter
    license: MIT
    version: null
    source: https://github.com/automazeio/ccpm
    license_evidence: https://github.com/automazeio/ccpm/blob/main/LICENSE
    integration: external-adapter
    status: unavailable-until-pinned
    unavailable_reason: No exact upstream ccpm release is installed or recorded in this workspace.
  - id: litellm
    role: model-gateway-analytics
    license: MIT
    version: null
    source: https://github.com/BerriAI/litellm
    license_evidence: https://github.com/BerriAI/litellm/blob/main/LICENSE
    integration: external-service
    status: unavailable-until-image-pinned
    unavailable_reason: LITELLM_IMAGE_REF is deployment-supplied and no immutable ref is configured in this workspace.
  - id: omniroute
    role: routing-analytics
    license: MIT
    version: 3.8.38
    source: https://github.com/diegosouzapw/OmniRoute
    license_evidence: https://github.com/diegosouzapw/OmniRoute/blob/main/LICENSE
    integration: external-service
