metadata:
  id: coding_worker_openhands_candidate
  name: Coding Worker (OpenHands candidate)
  version: "0.1-candidate"
  description: Inactive parallel candidate for the AIAT coding-worker shell.
  source_repo: https://github.com/OpenHands/software-agent-sdk.git
  source_revision: v1.43.0
  version_pin: "v1.43.0+4c1237f391fe394e9f67505fe3a0bd2d81f84188"
  tags: [worker, dept_qa, candidate, inactive]
  update_policy: manual
  evaluation_status: pending_complete_certification
runtime:
  transport: http
  adapter_config:
    adapter_type: openhands_agent_server
    entrypoint: OpenHandsAgentServerAdapter
    base_url: ${AIAT_OPENHANDS_AGENT_SERVER_URL}
    interface_verification_ref: mas/docs/provenance/openhands-candidate/2026-08-22-v1.43.0/interface-verification.json
    image_ref: ghcr.io/openhands/agent-server:1.43.0-python@sha256:36f847d1dfbbbdce90052437b06a3c6e76b8a54683228182eaf73085f03fcd97
    image_platform_digest: sha256:c826bcfa6455267d8f99fe277d97d00806bc0f90bf263b94268cab29fa7be529
    session_api_key_ref: AIAT secret boundary (not persisted)
    agent_profile_ref: operator-provisioned OpenHands profile UUID
    aiat_mcp_profile_ref: dedicated disposable aiat-openhands-* MCP settings key referenced by the profile
    aiat_mcp_bridge_url: http://tool-service:8002/openhands/mcp
    profile_controls:
      public_skills_disabled: true
      plugins_disabled: true
      browser_disabled: true
      subagents_disabled: true
      direct_credentials_disabled: true
      model_switching_disabled: true
    cleanup: AIAT-controlled disposable conversation cleanup
integration:
  adapter_entrypoint: OpenHandsAgentServerAdapter
  adapter_module: mas_core.worker_registry.openhands_agent_server_adapter
  isolation_mode: wrapper
  certified_adapter_version: null
runtime_tier: external
model_mode: aiat_gateway
model_profile_id: null
certification_status: pending
worker_activation: inactive
permission_grants: [repository.read, repository.write, tests.execute]
tool_grants: [aiat.repository.read, aiat.repository.write, aiat.tests.execute]
source_provenance:
  source_provider: github
  exact_release: "v1.43.0"
  source_commit: 4c1237f391fe394e9f67505fe3a0bd2d81f84188
  transport_type: openhands_agent_server
  license_id: MIT
  license_metadata_only: true
  security_scan_status: not_run
  sbom_status: not_run
  interface_evidence_ref: mas/docs/provenance/openhands-candidate/2026-08-22-v1.43.0/interface-verification.json
capabilities:
  - name: qa.code_implement
    description: Perform bounded coding work through the AIAT-governed OpenHands candidate adapter.
    required_tools: [aiat.repository.read, aiat.repository.write, aiat.tests.execute]
sandbox:
  profile: gvisor
  network_mode: egress-allowlist
  egress_allowlist: [llm-gateway:4000, tool-service:8002]
