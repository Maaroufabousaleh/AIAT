schema_version: "1"
programme_scope: personal-internal-only
decision_policy:
  release_requires:
    - all_required_checks_pass
    - no_pending_evidence
    - clean_worktree
    - live_profile_included
  blocked_live_evidence_is_not_a_pass: true
  licence_metadata_is_not_a_gate: true

# The checker executes these existing, bounded verifiers without a shell.  A
# live_args entry is optional because some static contracts have no live mode.
# The report records only safe status/count/reason fields from their output.
checks:
  - id: provenance
    category: static
    script: scripts/check_provenance.py
    args: []
  - id: documentation_index
    category: documentation
    script: scripts/check_docs_index.py
    args: [--json]
  - id: release_environment
    category: release
    script: scripts/check_release_environment.py
    args: [--json]
    live_args: [--require-native-linux, --json]
  - id: api_contract
    category: contract
    script: scripts/check_api_contract.py
    args: [--json]
  - id: api_observability
    category: contract
    script: scripts/check_api_observability.py
    args: [--json]
  - id: trace_evidence
    category: contract
    script: scripts/check_trace_evidence.py
    args: [--json]
    # Reuse the bounded trace emitted by the live transport probe.  This keeps
    # the aggregate read-back deterministic without creating project/worker
    # state; the trace endpoint returns `not_found` on a fresh deployment.
    live_args: [--live, --json, --trace-id, aiat-live-trace-20260811-phase]
  - id: live_trace_observability
    category: integration
    script: scripts/check_live_trace_observability.py
    args: [--json]
    live_args: [--live, --json]
  - id: live_tool_trace
    category: integration
    script: scripts/check_live_tool_trace.py
    args: [--json]
    live_args: [--live, --json]
  - id: native_trace_spans
    category: contract
    script: scripts/check_native_trace_spans.py
    args: [--json]
  - id: trace_retention_plan
    category: contract
    script: scripts/check_trace_retention.py
    args: [--json]
  - id: slo_capacity
    category: contract
    script: scripts/check_slo_capacity.py
    args: [--json]
    live_args: [--live, --json]
  - id: prompt_tool_reconciliation
    category: static
    script: scripts/check_prompt_tool_reconciliation.py
    args: [--json]
  - id: worker_reconciliation
    category: static
    script: scripts/check_worker_reconciliation.py
    args: [--json]
    live_args: [--live, --json]
  - id: default_worker_bindings
    category: contract
    script: scripts/check_default_worker_bindings.py
    args: [--json]
    live_args: [--live, --json]
    retained_live_evidence:
      path: docs/provenance/worker_reconciliation_live.json
      schema_version: aiat.worker-reconciliation-live-evidence.v1
  - id: worker_run_lifecycle
    category: recovery
    script: scripts/check_worker_run_lifecycle.py
    args: [--json]
  - id: network_boundary
    category: static
    script: scripts/check_network_boundary.py
    args: [--json]
    live_args: [--live, --json]
  - id: image_provenance
    category: static
    script: scripts/check_image_provenance.py
    args: [--json]
    live_args: [--live, --json]
  - id: image_budgets
    category: static
    script: scripts/check_image_budgets.py
    args: []
  - id: metric_series_budget
    category: operations
    script: scripts/check_metric_series_budget.py
    args: [--json]
    live_args: [--live, --json]
  - id: sandbox_runtime_readiness
    category: static
    script: scripts/check_sandbox_runtime_readiness.py
    args: [--json]
    live_args: [--live, --json]
  - id: firecracker_worker_pool_readiness
    category: integration
