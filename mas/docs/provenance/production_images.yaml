schema_version: "1"
programme_scope: personal-internal-only
image_identity: immutable-oci-digest

# Application images are deliberately deployment-supplied: this repository
# cannot invent a registry digest for an image that has not been built. The
# release ledger fills `oci_digest`, SBOM, source revision, lock hash, and scan
# fields from the clean native-Linux build/pull.
images:
  - id: team-runner
    ref_env: AIAT_TEAM_RUNNER_IMAGE_REF
    build_recipe: infra/docker/Dockerfile.team-runner
    source_revision: pending-release-ledger
    lock_hash: pending-release-ledger
    oci_digest: pending-release-ledger
    sbom: pending-release-ledger
    scan: pending-release-ledger
