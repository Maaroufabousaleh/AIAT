metadata:
  id: tech_analyst
  name: Tech Analyst
  version: "1.0"
  description: LangGraph-backed CIO worker for stack research, integration analysis, and capability mapping.
  source_repo: local
  source_revision: working-tree
  tags: [worker, office_cio]
  update_policy: manual
  evaluation_status: approved
runtime:
  transport: process
  adapter_config:
    entrypoint: WorkerAgent
    preferred_runtime: langgraph
    supported_frameworks: [langgraph, microsoft_agent_framework]
integration:
  adapter_entrypoint: WorkerAgent
  isolation_mode: langgraph
runtime_tier: langgraph
capabilities:
  - name: technology.stack_analysis
    description: Analyze technical stack options and integration feasibility.
    required_tools: [capability.search, web_search, web_fetch, blob.upload]
sandbox:
  profile: standard
  network_mode: egress-allowlist
  egress_allowlist: [api.github.com:443]
