metadata:
  id: chrm
  name: Chief Human Resource Manager
  version: '1.0'
  description: AIAT human-resources governance shell for staffing feasibility, worker capacity review, and hiring-board coordination.
  source_repo: local
  source_revision: working-tree
  tags:
  - c_suite
  - office_chrm
  version_pin: null
  update_policy: manual
  evaluation_status: approved
runtime:
  transport: process
  adapter_config:
    entrypoint: CSuiteAgent
  timeout_seconds: 300
  stop_grace_seconds: 60
capabilities:
- name: capability.list_workers
  version: '1.0'
  description: List registered workers and capabilities.
  risk_level: low
  required_tools:
  - capability.list_workers
- name: capability.search
  version: '1.0'
  description: Search for workers by capability.
  risk_level: low
  required_tools:
  - capability.search
- name: workforce.review
  version: '1.0'
  description: Review staffing feasibility and route deeper utilization analysis to HR workers.
  risk_level: low
  required_tools:
  - document.get_latest
  - document.list
  - web_search
  - review.submit
sandbox:
  profile: restricted
  filesystem: {}
  network_mode: egress-allowlist
  egress_allowlist:
  - api.github.com:443
  linux_security: {}
checkpointing:
  enabled: true
  strategy: on_every_llm_call
  every_n_calls: 1
  store:
    kind: postgres
    table: agent_checkpoints
observability:
  logs_format: json
  metrics_enabled: true
  traces_enabled: true
integration:
  adapter_entrypoint: CSuiteAgent
  adapter_module: null
  wrapper_config: {}
  compatibility_tests: []
  isolation_mode: native
limits:
  max_concurrent_tasks: 10
  max_instances: 1
  rate_limit_per_minute: 60
  max_payload_size_bytes: 10485760
