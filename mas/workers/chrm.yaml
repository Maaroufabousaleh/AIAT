metadata:
  id: chrm
  name: Chief Human Resource Manager
  version: '1.0'
  description: Auto-generated baseline manifest for chrm
  source_repo: local
  source_revision: working-tree
  tags:
  - c_suite
  - office_chrm
runtime:
  transport: process
  adapter_config:
    entrypoint: CSuiteAgent
  timeout_seconds: 300
  stop_grace_seconds: 60
capabilities:
- name: capability.list_workers
  version: '1.0'
  description: List registered workers and capabilities.
  risk_level: low
  required_tools:
  - capability.list_workers
- name: kpi.query_history
  version: '1.0'
  description: Query KPI history.
  risk_level: low
  required_tools:
  - kpi.query_history
- name: capability.search
  version: '1.0'
  description: Search for workers by capability.
  risk_level: low
  required_tools:
  - capability.search
sandbox:
  profile: restricted
  filesystem: {}
  network_mode: egress-allowlist
  egress_allowlist:
  - api.github.com:443
  linux_security: {}
checkpointing:
  enabled: true
  strategy: on_every_llm_call
  every_n_calls: 1
  store:
    kind: postgres
    table: agent_checkpoints
observability:
  logs_format: json
  metrics_enabled: true
  traces_enabled: true
