metadata:
  id: cfo
  name: Chief Financial Officer
  version: '1.0'
  description: Auto-generated baseline manifest for cfo
  source_repo: local
  source_revision: working-tree
  tags:
  - c_suite
  - office_cfo
  version_pin: null
  update_policy: manual
  evaluation_status: approved
runtime:
  transport: process
  adapter_config:
    entrypoint: CSuiteAgent
  timeout_seconds: 300
  stop_grace_seconds: 60
capabilities:
- name: kpi.compute
  version: '1.0'
  description: Compute KPI snapshot.
  risk_level: low
  required_tools:
  - kpi.compute
- name: kpi.query_history
  version: '1.0'
  description: Query KPI history.
  risk_level: low
  required_tools:
  - kpi.query_history
- name: web_search
  version: '1.0'
  description: Search the web.
  risk_level: low
  required_tools:
  - web_search
sandbox:
  profile: restricted
  filesystem: {}
  network_mode: egress-allowlist
  egress_allowlist:
  - api.github.com:443
  linux_security: {}
checkpointing:
  enabled: true
  strategy: on_every_llm_call
  every_n_calls: 1
  store:
    kind: postgres
    table: agent_checkpoints
observability:
  logs_format: json
  metrics_enabled: true
  traces_enabled: true
integration:
  adapter_entrypoint: CSuiteAgent
  adapter_module: null
  wrapper_config: {}
  compatibility_tests: []
  isolation_mode: native
limits:
  max_concurrent_tasks: 10
  max_instances: 1
  rate_limit_per_minute: 60
  max_payload_size_bytes: 10485760
