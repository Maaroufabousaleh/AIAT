metadata:
  id: cfo
  name: Chief Financial Officer
  version: '1.0'
  description: AIAT finance governance shell for budget review, cost-risk decisions, and routing detailed KPI analysis to finance workers.
  source_repo: local
  source_revision: working-tree
  tags:
  - c_suite
  - office_cfo
  version_pin: null
  update_policy: manual
  evaluation_status: approved
runtime:
  transport: process
  adapter_config:
    entrypoint: CSuiteAgent
  timeout_seconds: 300
  stop_grace_seconds: 60
capabilities:
- name: finance.review
  version: '1.0'
  description: Review financial feasibility, budget posture, and cost evidence for executive decision points.
  risk_level: low
  required_tools:
  - document.get_latest
  - document.list
  - web_search
  - review.submit
- name: finance.research
  version: '1.0'
  description: Gather external pricing, benchmark, and commercial-risk context for finance review.
  risk_level: low
  required_tools:
  - web_search
  - web_fetch
sandbox:
  profile: restricted
  filesystem: {}
  network_mode: egress-allowlist
  egress_allowlist:
  - api.github.com:443
  linux_security: {}
checkpointing:
  enabled: true
  strategy: on_every_llm_call
  every_n_calls: 1
  store:
    kind: postgres
    table: agent_checkpoints
observability:
  logs_format: json
  metrics_enabled: true
  traces_enabled: true
integration:
  adapter_entrypoint: CSuiteAgent
  adapter_module: null
  wrapper_config: {}
  compatibility_tests: []
  isolation_mode: native
limits:
  max_concurrent_tasks: 10
  max_instances: 1
  rate_limit_per_minute: 60
  max_payload_size_bytes: 10485760
