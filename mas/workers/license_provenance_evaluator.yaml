metadata:
  id: license_provenance_evaluator
  name: License Provenance Evaluator
  version: "1.0"
  description: Non-blocking hiring-board metadata collector for source, version, license, notices, and stated restrictions.
  source_repo: local
  source_revision: working-tree
  tags: [worker, office_cso]
  update_policy: manual
  evaluation_status: approved
runtime:
  transport: process
  adapter_config:
    entrypoint: WorkerAgent
integration:
  adapter_entrypoint: WorkerAgent
  isolation_mode: native
runtime_tier: builtin
capabilities:
  - name: hiring.license_provenance_evaluate
    description: Record license posture, provenance, version pins, notices, and operator-visible restrictions without making license a hiring or activation gate.
    required_tools: [file_read, web_search, web_fetch, blob.upload]
sandbox:
  profile: restricted
  network_mode: egress-allowlist
  egress_allowlist: [api.github.com:443]
