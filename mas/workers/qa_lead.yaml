metadata:
  id: qa_lead
  name: QA Lead
  version: '1.0'
  description: Auto-generated baseline manifest for qa_lead
  source_repo: local
  source_revision: working-tree
  tags:
  - admin
  - dept_qa
  version_pin: null
  update_policy: manual
  evaluation_status: approved
runtime:
  transport: process
  adapter_config:
    entrypoint: AdminAgent
  timeout_seconds: 300
  stop_grace_seconds: 60
capabilities:
- name: document.create_draft
  version: '1.0'
  description: Create a document draft.
  risk_level: low
  required_tools:
  - document.create_draft
- name: document.get_latest
  version: '1.0'
  description: Fetch latest document version.
  risk_level: low
  required_tools:
  - document.get_latest
- name: blob.upload
  version: '1.0'
  description: Capability mapped from tool blob.upload
  risk_level: low
  required_tools:
  - blob.upload
- name: blob.download
  version: '1.0'
  description: Capability mapped from tool blob.download
  risk_level: low
  required_tools:
  - blob.download
- name: issue.create
  version: '1.0'
  description: Capability mapped from tool issue.create
  risk_level: low
  required_tools:
  - issue.create
- name: project.status
  version: '1.0'
  description: Capability mapped from tool project.status
  risk_level: low
  required_tools:
  - project.status
sandbox:
  profile: standard
  filesystem: {}
  network_mode: egress-allowlist
  egress_allowlist:
  - api.github.com:443
  linux_security: {}
checkpointing:
  enabled: true
  strategy: on_every_llm_call
  every_n_calls: 1
  store:
    kind: postgres
    table: agent_checkpoints
observability:
  logs_format: json
  metrics_enabled: true
  traces_enabled: true
integration:
  adapter_entrypoint: AdminAgent
  adapter_module: null
  wrapper_config: {}
  compatibility_tests: []
  isolation_mode: native
limits:
  max_concurrent_tasks: 10
  max_instances: 1
  rate_limit_per_minute: 60
  max_payload_size_bytes: 10485760
