metadata:
  id: test_evaluation_worker
  name: Test Evaluation Worker
  version: "1.0"
  description: QA worker for evaluating test results, failure evidence, and regression risk.
  source_repo: local
  source_revision: working-tree
  tags: [worker, dept_qa]
  update_policy: manual
  evaluation_status: approved
runtime:
  transport: process
  adapter_config:
    entrypoint: WorkerAgent
    test_stack: [playwright, pytest]
integration:
  adapter_entrypoint: WorkerAgent
  isolation_mode: wrapper
runtime_tier: external
capabilities:
  - name: qa.test_evaluate
    description: Evaluate test logs, browser screenshots, coverage, and release readiness evidence.
    required_tools: [file_read, web_search, browser_screenshot, blob.upload]
sandbox:
  profile: gvisor
  network_mode: egress-allowlist
  egress_allowlist: [api.github.com:443]
