metadata:
  id: financial_analyst_1
  name: Financial Analyst
  version: '1.0'
  description: Auto-generated baseline manifest for financial_analyst_1
  source_repo: local
  source_revision: working-tree
  tags:
  - worker
  - office_cfo
runtime:
  transport: process
  adapter_config:
    entrypoint: WorkerAgent
  timeout_seconds: 300
  stop_grace_seconds: 60
capabilities:
- name: cost_estimate
  version: '1.0'
  description: Capability mapped from tool cost_estimate
  risk_level: low
  required_tools:
  - cost_estimate
- name: market_research
  version: '1.0'
  description: Capability mapped from tool market_research
  risk_level: low
  required_tools:
  - market_research
- name: web_search
  version: '1.0'
  description: Capability mapped from tool web_search
  risk_level: low
  required_tools:
  - web_search
sandbox:
  profile: standard
  filesystem: {}
  network_mode: egress-allowlist
  egress_allowlist:
  - api.github.com:443
  linux_security: {}
checkpointing:
  enabled: true
  strategy: on_every_llm_call
  every_n_calls: 1
  store:
    kind: postgres
    table: agent_checkpoints
observability:
  logs_format: json
  metrics_enabled: true
  traces_enabled: true
