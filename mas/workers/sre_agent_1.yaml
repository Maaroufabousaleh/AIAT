metadata:
  id: sre_agent_1
  name: SRE Agent
  version: '1.0'
  description: Auto-generated baseline manifest for sre_agent_1
  source_repo: local
  source_revision: working-tree
  tags:
  - worker
  - dept_devops
  version_pin: null
  update_policy: manual
  evaluation_status: approved
runtime:
  transport: process
  adapter_config:
    entrypoint: WorkerAgent
  timeout_seconds: 300
  stop_grace_seconds: 60
capabilities:
- name: monitoring.setup
  version: '1.0'
  description: Capability mapped from tool monitoring.setup
  risk_level: low
  required_tools:
  - monitoring.setup
- name: secrets.manage
  version: '1.0'
  description: Capability mapped from tool secrets.manage
  risk_level: low
  required_tools:
  - secrets.manage
- name: web_search
  version: '1.0'
  description: Capability mapped from tool web_search
  risk_level: low
  required_tools:
  - web_search
- name: blob.upload
  version: '1.0'
  description: Capability mapped from tool blob.upload
  risk_level: low
  required_tools:
  - blob.upload
sandbox:
  profile: standard
  filesystem: {}
  network_mode: egress-allowlist
  egress_allowlist:
  - api.github.com:443
  linux_security: {}
checkpointing:
  enabled: true
  strategy: on_every_llm_call
  every_n_calls: 1
  store:
    kind: postgres
    table: agent_checkpoints
observability:
  logs_format: json
  metrics_enabled: true
  traces_enabled: true
integration:
  adapter_entrypoint: WorkerAgent
  adapter_module: null
  wrapper_config: {}
  compatibility_tests: []
  isolation_mode: native
limits:
  max_concurrent_tasks: 10
  max_instances: 1
  rate_limit_per_minute: 60
  max_payload_size_bytes: 10485760
