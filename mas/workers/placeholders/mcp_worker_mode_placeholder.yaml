protocol_version: aiat.v1
metadata:
  id: mcp_worker_mode_placeholder
  name: MCP Worker Mode Placeholder
  version: '0.1'
  description: Placeholder manifest for future MCP-backed worker mode integration.
  source_repo: local
  source_revision: placeholder
  tags:
  - placeholder
  - dept_infra
  - mcp
  version_pin: null
  update_policy: manual
  evaluation_status: pending
runtime:
  transport: mcp
  adapter_config:
    endpoint: disabled-placeholder
    disabled_placeholder: true
  timeout_seconds: 300
  stop_grace_seconds: 60
capabilities:
- name: worker.mode.mcp
  version: '0.1'
  description: Placeholder capability for future MCP worker mode.
  risk_level: medium
  required_tools: []
sandbox:
  profile: gvisor
  filesystem: {}
  network_mode: egress-deny-all
  egress_allowlist: []
  linux_security: {}
integration:
  adapter_entrypoint: MCPWorkerAdapter
  adapter_module: null
  wrapper_config:
    placeholder_only: true
  compatibility_tests: []
  isolation_mode: wrapper
limits:
  max_concurrent_tasks: 1
  max_instances: 1
  rate_limit_per_minute: 10
  max_payload_size_bytes: 10485760
checkpointing:
  enabled: true
  strategy: on_every_llm_call
  every_n_calls: 1
  store:
    kind: postgres
    table: agent_checkpoints
observability:
  logs_format: json
  metrics_enabled: true
  traces_enabled: true
