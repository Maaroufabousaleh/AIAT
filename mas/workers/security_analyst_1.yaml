metadata:
  id: security_analyst_1
  name: Security Analyst
  version: '1.0'
  description: Auto-generated baseline manifest for security_analyst_1
  source_repo: local
  source_revision: working-tree
  tags:
  - worker
  - office_cso
runtime:
  transport: process
  adapter_config:
    entrypoint: WorkerAgent
  timeout_seconds: 300
  stop_grace_seconds: 60
capabilities:
- name: review.submit
  version: '1.0'
  description: Submit a review response.
  risk_level: low
  required_tools:
  - review.submit
sandbox:
  profile: standard
  filesystem: {}
  network_mode: egress-allowlist
  egress_allowlist:
  - api.github.com:443
  linux_security: {}
checkpointing:
  enabled: true
  strategy: on_every_llm_call
  every_n_calls: 1
  store:
    kind: postgres
    table: agent_checkpoints
observability:
  logs_format: json
  metrics_enabled: true
  traces_enabled: true
