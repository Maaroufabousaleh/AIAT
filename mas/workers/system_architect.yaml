metadata:
  id: system_architect
  name: System Architect
  version: '1.0'
  description: Auto-generated baseline manifest for system_architect
  source_repo: local
  source_revision: working-tree
  tags:
  - worker
  - dept_system
runtime:
  transport: process
  adapter_config:
    entrypoint: WorkerAgent
  timeout_seconds: 300
  stop_grace_seconds: 60
capabilities:
- name: tech_stack_analyze
  version: '1.0'
  description: Capability mapped from tool tech_stack_analyze
  risk_level: low
  required_tools:
  - tech_stack_analyze
- name: web_search
  version: '1.0'
  description: Capability mapped from tool web_search
  risk_level: low
  required_tools:
  - web_search
- name: code_analyze
  version: '1.0'
  description: Capability mapped from tool code_analyze
  risk_level: low
  required_tools:
  - code_analyze
- name: blob.upload
  version: '1.0'
  description: Capability mapped from tool blob.upload
  risk_level: low
  required_tools:
  - blob.upload
sandbox:
  profile: standard
  filesystem: {}
  network_mode: egress-allowlist
  egress_allowlist:
  - api.github.com:443
  linux_security: {}
checkpointing:
  enabled: true
  strategy: on_every_llm_call
  every_n_calls: 1
  store:
    kind: postgres
    table: agent_checkpoints
observability:
  logs_format: json
  metrics_enabled: true
  traces_enabled: true
