metadata:
  id: security_analyst
  name: Security Analyst
  version: "1.0"
  description: CSO worker for security analysis using Semgrep/SkillSpector-style adapter outputs before CSO review submission.
  source_repo: local
  source_revision: working-tree
  tags: [worker, office_cso]
  update_policy: manual
  evaluation_status: approved
runtime:
  transport: process
  adapter_config:
    entrypoint: WorkerAgent
    preferred_tools: [semgrep, skillspector]
integration:
  adapter_entrypoint: WorkerAgent
  isolation_mode: wrapper
runtime_tier: external
capabilities:
  - name: security.analysis
    description: Analyze security posture and prepare evidence-backed CSO review findings.
    required_tools: [file_read, web_search, blob.upload]
sandbox:
  profile: gvisor
  network_mode: egress-allowlist
  egress_allowlist: [api.github.com:443]
