metadata:
  id: sandbox_evaluator
  name: Sandbox Evaluator
  version: "1.0"
  description: Default sandbox evaluator for gVisor and optional Firecracker high-risk worker isolation.
  source_repo: local
  source_revision: working-tree
  tags: [worker, office_cso]
  update_policy: manual
  evaluation_status: approved
runtime:
  transport: process
  adapter_config:
    entrypoint: WorkerAgent
    default_sandbox: gvisor
    high_risk_sandbox: firecracker
integration:
  adapter_entrypoint: WorkerAgent
  isolation_mode: wrapper
runtime_tier: external
capabilities:
  - name: sandbox.evaluate
    description: Evaluate sandbox profile, filesystem/network limits, and high-risk isolation requirements.
    required_tools: [file_read, web_search, blob.upload]
sandbox:
  profile: gvisor
  network_mode: egress-allowlist
  egress_allowlist: [api.github.com:443]
