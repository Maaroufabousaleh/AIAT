metadata:
  id: coding_worker
  name: Coding Worker
  version: "1.0"
  description: QA coding worker backed by OpenCode/OpenHands core for implementation tasks.
  source_repo: local
  source_revision: working-tree
  tags: [worker, dept_qa]
  update_policy: manual
  evaluation_status: approved
runtime:
  transport: process
  adapter_config:
    entrypoint: WorkerAgent
    coding_stack: [opencode, openhands-core]
    excluded_default_code: [openhands-enterprise]
integration:
  adapter_entrypoint: WorkerAgent
  isolation_mode: wrapper
runtime_tier: external
capabilities:
  - name: qa.code_implement
    description: Perform bounded coding work using approved OSS coding-worker adapters.
    required_tools: [file_read, file_write, web_search, blob.upload]
sandbox:
  profile: gvisor
  network_mode: egress-allowlist
  egress_allowlist: [api.github.com:443]
