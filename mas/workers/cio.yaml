metadata:
  id: cio
  name: Chief Information Officer
  version: '1.0'
  description: Auto-generated baseline manifest for cio
  source_repo: local
  source_revision: working-tree
  tags:
  - c_suite
  - office_cio
runtime:
  transport: process
  adapter_config:
    entrypoint: CSuiteAgent
  timeout_seconds: 300
  stop_grace_seconds: 60
capabilities:
- name: tech_stack_analyze
  version: '1.0'
  description: Capability mapped from tool tech_stack_analyze
  risk_level: low
  required_tools:
  - tech_stack_analyze
- name: integration_check
  version: '1.0'
  description: Capability mapped from tool integration_check
  risk_level: low
  required_tools:
  - integration_check
- name: web_search
  version: '1.0'
  description: Capability mapped from tool web_search
  risk_level: low
  required_tools:
  - web_search
- name: code_analyze
  version: '1.0'
  description: Capability mapped from tool code_analyze
  risk_level: low
  required_tools:
  - code_analyze
sandbox:
  profile: restricted
  filesystem: {}
  network_mode: egress-allowlist
  egress_allowlist:
  - api.github.com:443
  linux_security: {}
checkpointing:
  enabled: true
  strategy: on_every_llm_call
  every_n_calls: 1
  store:
    kind: postgres
    table: agent_checkpoints
observability:
  logs_format: json
  metrics_enabled: true
  traces_enabled: true
