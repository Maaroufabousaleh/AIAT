metadata:
  id: cost_estimator
  name: Cost Estimator
  version: "1.0"
  description: Production worker for cost estimates using KPI history and CFO rules.
  source_repo: local
  source_revision: working-tree
  tags: [worker, dept_production]
  update_policy: manual
  evaluation_status: approved
runtime:
  transport: process
  adapter_config:
    entrypoint: WorkerAgent
    preferred_runtime: langgraph
integration:
  adapter_entrypoint: WorkerAgent
  isolation_mode: langgraph
runtime_tier: langgraph
capabilities:
  - name: production.cost_estimate
    description: Estimate implementation cost, budget risk, and contingency needs.
    required_tools: [kpi.compute, kpi.query_history, web_search, blob.upload]
sandbox:
  profile: standard
  network_mode: egress-allowlist
  egress_allowlist: [api.github.com:443]
