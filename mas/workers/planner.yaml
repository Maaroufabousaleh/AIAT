metadata:
  id: planner
  name: Planner
  version: "1.0"
  description: Production planning worker using ccpm/GitHub Issues defaults instead of Plane/OpenProject.
  source_repo: local
  source_revision: working-tree
  tags: [worker, dept_production]
  update_policy: manual
  evaluation_status: approved
runtime:
  transport: process
  adapter_config:
    entrypoint: WorkerAgent
    default_planning_adapter: ccpm
    optional_issue_adapter: github_issues
integration:
  adapter_entrypoint: WorkerAgent
  isolation_mode: langgraph
runtime_tier: langgraph
capabilities:
  - name: production.plan_issues
    description: Convert requirements into issue/sprint-ready work packages.
    required_tools: [capability.search, capability.list_workers, document.get_latest, blob.upload]
sandbox:
  profile: standard
  network_mode: egress-allowlist
  egress_allowlist: [api.github.com:443]
