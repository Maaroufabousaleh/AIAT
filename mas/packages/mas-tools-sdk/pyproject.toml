[project]
name = "mas-tools-sdk"
version = "0.1.0"
description = "Tool interface definition + async HTTP client for the tool-service"
requires-python = ">=3.11"

dependencies = [
    "mas-core",
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mas_tools_sdk"]

# ── uv workspace dependency ───────────────────────────────────────────────────
[tool.uv.sources]
mas-core = { workspace = true }
