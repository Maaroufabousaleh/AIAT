[project]
name = "mas-core"
version = "0.1.0"
description = "Shared library: agent runtime, protocols, policy engine, LLM gateway, workflow controller"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.2",
    "redis[hiredis]>=5.0",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "aioboto3>=13.0",
    "httpx[http2]>=0.27",
    "tenacity>=8.5",           # retry / backoff
    "cachetools>=5.4",         # LRU cache for idempotency
    "python-ulid>=2.0",        # sortable UUIDs for message_id
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mas_core"]
