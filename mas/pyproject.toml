[project]
name = "mas"
version = "0.1.0"
description = "AIAT Multi-Agent System — corporate-hierarchy MAS monorepo"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "mas-core",
    "mas-tools-sdk",
    "message-router",
    "tool-service",
    "team-runner",
    "orchestrator-api",
    "pm-gateway",
]

# ── uv workspace ──────────────────────────────────────────────────────────────
# All workspace members are listed here.  Each member has its own pyproject.toml
# with its own dependencies.  Run `uv sync` from this directory to install
# everything into a single virtual environment at the repo root.

[tool.uv.workspace]
members = [
    "packages/mas-core",
    "packages/mas-tools-sdk",
    "apps/orchestrator-api",
    "apps/team-runner",
    "apps/message-router",
    "apps/tool-service",
    "apps/identity-service",
    "apps/pm-gateway",
]

# ── shared dev dependencies ────────────────────────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "trio>=0.27",
    "pytest-cov>=5.0",
    "fastapi>=0.115",
    "pyyaml>=6.0",
    "httpx>=0.27",          # async test client
    "fakeredis>=2.25",      # in-memory Redis for unit tests
    "respx>=0.21",          # mock httpx calls
    "ruff>=0.6",
    "mypy>=1.11",
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.11",
]

[tool.uv.sources]
mas-core = { workspace = true }
mas-tools-sdk = { workspace = true }
message-router = { workspace = true }
tool-service = { workspace = true }
identity-service = { workspace = true }
team-runner = { workspace = true }
orchestrator-api = { workspace = true }
pm-gateway = { workspace = true }

# ── ruff config (shared) ──────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mas_core", "mas_tools_sdk"]

# ── mypy (shared) ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# ── pytest (shared) ───────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = [
    "packages/mas-core/tests",
    "packages/mas-tools-sdk/tests",
    "apps/message-router/tests",
    "apps/orchestrator-api/tests",
    "apps/pm-gateway/tests",
    "apps/team-runner/tests",
    "apps/tool-service/tests",
]
addopts = "--tb=short -q --import-mode=importlib -p no:cacheprovider"
markers = [
    "live: marks tests that require external providers/network and are opt-in via MAS_RUN_LIVE_TESTS=1",
]
